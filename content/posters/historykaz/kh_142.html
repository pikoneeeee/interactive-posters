        h1, h2, h3 { font-family: 'Montserrat', sans-serif; }
        
        .tab-active {
            background-color: white !important;
            color: #1e293b !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .lang-active {
            background-color: #facc15 !important;
            color: #1e293b !important;
            font-weight: 900;
        }

        .glass { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        }
        
        /* Themes */
        .theme-agri { background: #fffbeb; --accent: #b45309; --grad: linear-gradient(135deg, #f59e0b 0%, #b45309 100%); }
        .theme-social { background: #f0fdf4; --accent: #15803d; --grad: linear-gradient(135deg, #22c55e 0%, #15803d 100%); }
        .theme-spirit { background: #eef2ff; --accent: #4338ca; --grad: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); }
        
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .learning-card {
            border-radius: 2rem;
            transition: all 0.3s ease;
        }
        .learning-card:hover {
            transform: scale(1.02);
            box-shadow: 0 30px 60px -12px rgba(0,0,0,0.1);
        }
    </style>
</head>

            render();
        }

            render();
