<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плакат 148: Число Прилагательных</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fontawesome.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body { background-color: #ecfeff; font-family: 'Open Sans', sans-serif; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        .poster {
            width: 210mm; min-height: 297mm; background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 40px;
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        h1, h3 { font-family: 'Montserrat', sans-serif; }
        .card { background: rgba(255,255,255,0.95); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 6px solid; }
        .decor { position: absolute; border-radius: 50%; z-index: 0; }
        .plural-ending { color: #0891b2; font-weight: 900; font-size: 1.5em; }
    </style>
    <script src="../../libs/chart.min.js"></script>
</head>
<body>

<div class="poster">
        <div class="decor bg-cyan-200 w-96 h-96 -top-20 -right-20 opacity-40"></div>

        <div class="relative z-10 flex flex-col h-full">
            <header class="text-center mb-10 border-b-4 border-cyan-600 pb-6">
                <span class="bg-cyan-600 text-white px-4 py-1 rounded-full text-sm font-bold uppercase tracking-widest">Тема №148</span>
                <h1 class="text-4xl font-black text-cyan-900 mt-4 uppercase">ЧИСЛО ПРИЛАГАТЕЛЬНЫХ</h1>
                <p class="text-xl text-cyan-700 mt-2">Единственное и Множественное</p>
            </header>

            <div class="flex-grow grid grid-cols-1 gap-6">

                <!-- Единственное -->
                <div class="card border-cyan-500">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-2xl font-bold text-cyan-900 uppercase">ЕДИНСТВЕННОЕ</h3>
                        <i class="fas fa-user text-3xl text-cyan-600"></i>
                    </div>
                    <p class="text-gray-600 mb-2">Изменяется по <b>РОДАМ</b>.</p>
                    <div class="bg-cyan-50 p-3 rounded text-center">
                        <p class="font-bold text-gray-800">Красн<b>ый</b> (м.р.)</p>
                        <p class="font-bold text-gray-800">Красн<b>ая</b> (ж.р.)</p>
                        <p class="font-bold text-gray-800">Красн<b>ое</b> (ср.р.)</p>
                    </div>
                </div>

                <!-- Множественное -->
                <div class="card border-blue-500 bg-blue-50">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-2xl font-bold text-blue-900 uppercase">МНОЖЕСТВЕННОЕ</h3>
                        <div class="flex gap-1">
                            <i class="fas fa-user text-2xl text-blue-600"></i>
                            <i class="fas fa-user text-2xl text-blue-600"></i>
                        </div>
                    </div>
                    <p class="text-blue-800 font-bold text-center mb-2 uppercase">КАКИЕ?</p>
                    <div class="flex justify-center gap-8 mb-4">
                        <span class="plural-ending">-ЫЕ</span>
                        <span class="plural-ending">-ИЕ</span>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-blue-200 text-center">
                        <p class="text-lg text-gray-800">
                            Красн<b>ые</b> шары<br>
                            Син<b>ие</b> ленты<br>
                            Добр<b>ые</b> люди
                        </p>
                    </div>
                    <p class="text-center text-xs text-gray-500 mt-4 font-bold uppercase">
                        Во множественном числе по родам НЕ изменяются!
                    </p>
                </div>

            </div>
        </div>
    </div>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>


</body>
</html>
