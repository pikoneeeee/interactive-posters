<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плакат 138: Родительный Падеж</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fontawesome.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body { background-color: #f0f9ff; font-family: 'Open Sans', sans-serif; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        .poster {
            width: 210mm; min-height: 297mm; background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 40px;
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        h1, h3 { font-family: 'Montserrat', sans-serif; }
        .card { background: rgba(255,255,255,0.95); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 6px solid; }
        .decor { position: absolute; border-radius: 50%; z-index: 0; }
        .prep-tag { background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 0.9em; margin: 2px; display: inline-block; }
    </style>
    <script src="../../libs/chart.min.js"></script>
</head>
<body>

<div class="poster">
        <div class="decor bg-sky-200 w-96 h-96 -top-20 -right-20 opacity-40"></div>

        <div class="relative z-10 flex flex-col h-full">
            <header class="text-center mb-10 border-b-4 border-sky-600 pb-6">
                <span class="bg-sky-600 text-white px-4 py-1 rounded-full text-sm font-bold uppercase tracking-widest">Тема №138</span>
                <h1 class="text-4xl font-black text-sky-900 mt-4 uppercase">РОДИТЕЛЬНЫЙ ПАДЕЖ</h1>
                <p class="text-xl text-sky-700 mt-2">Кого? Чего?</p>
            </header>

            <div class="flex-grow space-y-6">

                <div class="card border-sky-500 text-center">
                    <p class="text-gray-500 uppercase tracking-widest text-sm mb-2">Слово-помощник: НЕТ</p>
                    <div class="my-4">
                        <span class="text-4xl font-black text-sky-600 block mb-2">КОГО?</span>
                        <span class="text-4xl font-black text-sky-600 block">ЧЕГО?</span>
                    </div>
                </div>

                <div class="card border-indigo-500 bg-sky-50">
                    <h3 class="text-xl font-bold text-indigo-900 uppercase mb-4 text-center">Предлоги</h3>
                    <div class="text-center mb-4">
                        <span class="prep-tag">ОТ</span>
                        <span class="prep-tag">ДО</span>
                        <span class="prep-tag">ИЗ</span>
                        <span class="prep-tag">БЕЗ</span>
                        <span class="prep-tag">У</span>
                        <span class="prep-tag">ДЛЯ</span>
                        <span class="prep-tag">ОКОЛО</span>
                        <span class="prep-tag">С</span>
                        <span class="prep-tag">ВОКРУГ</span>
                        <span class="prep-tag">ПОСЛЕ</span>
                    </div>

                    <div class="bg-white p-4 rounded-xl border border-indigo-200 text-center">
                        <p class="text-lg font-medium text-gray-800">
                            Стоять <b>у доски</b>.<br>
                            Выйти <b>из дома</b>.<br>
                            Нет <b>времени</b>.
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </div>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>


</body>
</html>
