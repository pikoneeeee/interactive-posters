<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плакат 161: Члены предложения</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fontawesome.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body { background-color: #fdf4ff; font-family: 'Open Sans', sans-serif; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        .poster {
            width: 210mm; min-height: 297mm; background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 40px;
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        h1, h3 { font-family: 'Montserrat', sans-serif; }
        .card { background: rgba(255,255,255,0.95); border-radius: 12px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; border-left: 6px solid; }
        .decor { position: absolute; border-radius: 50%; z-index: 0; }
        .underline-wave { text-decoration: underline; text-decoration-style: wavy; text-decoration-color: #a855f7; }
        .underline-dash { border-bottom: 2px dashed #a855f7; }
        .underline-dot-dash { border-bottom: 2px dotted #a855f7; } /* using dotted to simulate dot-dash */
    </style>
    <script src="../../libs/chart.min.js"></script>
</head>
<body>

<div class="poster">
        <div class="decor bg-purple-200 w-96 h-96 -top-20 -right-20 opacity-40"></div>

        <div class="relative z-10 flex flex-col h-full">
            <header class="text-center mb-8 border-b-4 border-purple-600 pb-6">
                <span class="bg-purple-600 text-white px-4 py-1 rounded-full text-sm font-bold uppercase tracking-widest">Тема №161</span>
                <h1 class="text-4xl font-black text-purple-900 mt-4 uppercase">ЧЛЕНЫ ПРЕДЛОЖЕНИЯ</h1>
                <p class="text-xl text-purple-700 mt-2">Структура предложения</p>
            </header>

            <div class="flex-grow space-y-4">

                <!-- Главные -->
                <div class="card border-purple-500 bg-purple-50">
                    <h3 class="text-xl font-bold text-purple-900 uppercase mb-4 text-center">ГЛАВНЫЕ (Основа)</h3>
                    <div class="grid grid-cols-2 gap-4 text-center">
                        <div class="bg-white p-3 rounded shadow-sm">
                            <span class="font-bold block text-lg">ПОДЛЕЖАЩЕЕ</span>
                            <span class="text-xs text-gray-500 block">Кто? Что?</span>
                            <div class="border-b-2 border-black w-2/3 mx-auto mt-2"></div>
                        </div>
                        <div class="bg-white p-3 rounded shadow-sm">
                            <span class="font-bold block text-lg">СКАЗУЕМОЕ</span>
                            <span class="text-xs text-gray-500 block">Что делает?</span>
                            <div class="border-b-4 border-double border-black w-2/3 mx-auto mt-2 h-1"></div>
                        </div>
                    </div>
                </div>

                <!-- Второстепенные -->
                <div class="card border-fuchsia-500">
                    <h3 class="text-xl font-bold text-fuchsia-900 uppercase mb-4 text-center">ВТОРОСТЕПЕННЫЕ</h3>

                    <div class="space-y-3">
                        <div class="flex items-center gap-4 bg-fuchsia-50 p-2 rounded">
                            <div class="w-1/3 font-bold text-right text-fuchsia-800">Определение</div>
                            <div class="w-2/3 text-sm">
                                Какой? Чей? <span class="underline-wave font-bold ml-2">волнистая</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-4 bg-fuchsia-50 p-2 rounded">
                            <div class="w-1/3 font-bold text-right text-fuchsia-800">Дополнение</div>
                            <div class="w-2/3 text-sm">
                                Падежные вопросы <span class="underline-dash font-bold ml-2">пунктир</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-4 bg-fuchsia-50 p-2 rounded">
                            <div class="w-1/3 font-bold text-right text-fuchsia-800">Обстоятельство</div>
                            <div class="w-2/3 text-sm">
                                Где? Когда? Как? <span class="font-bold ml-2">_ . _ . _</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>


</body>
</html>
