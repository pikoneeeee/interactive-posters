<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плакат 137: Именительный Падеж</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fontawesome.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body { background-color: #ecfeff; font-family: 'Open Sans', sans-serif; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        .poster {
            width: 210mm; min-height: 297mm; background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 40px;
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        h1, h3 { font-family: 'Montserrat', sans-serif; }
        .card { background: rgba(255,255,255,0.95); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 6px solid; }
        .decor { position: absolute; border-radius: 50%; z-index: 0; }
        .main-q { font-size: 2.5rem; font-weight: 900; color: #0284c7; display: block; }
    </style>
    <script src="../../libs/chart.min.js"></script>
</head>
<body>

<div class="poster">
        <div class="decor bg-cyan-200 w-96 h-96 -top-20 -right-20 opacity-40"></div>

        <div class="relative z-10 flex flex-col h-full">
            <header class="text-center mb-10 border-b-4 border-cyan-600 pb-6">
                <span class="bg-cyan-600 text-white px-4 py-1 rounded-full text-sm font-bold uppercase tracking-widest">Тема №137</span>
                <h1 class="text-4xl font-black text-cyan-900 mt-4 uppercase">ИМЕНИТЕЛЬНЫЙ ПАДЕЖ</h1>
                <p class="text-xl text-cyan-700 mt-2">Начальная форма</p>
            </header>

            <div class="flex-grow space-y-6">

                <div class="card border-cyan-500 text-center">
                    <p class="text-gray-500 uppercase tracking-widest text-sm mb-2">Слово-помощник: ЕСТЬ</p>
                    <div class="my-6">
                        <span class="main-q">КТО?</span>
                        <span class="main-q">ЧТО?</span>
                    </div>
                    <p class="text-gray-700 text-lg">
                        Никогда не употребляется с предлогами!
                    </p>
                </div>

                <div class="card border-blue-500 bg-blue-50">
                    <h3 class="text-xl font-bold text-blue-900 uppercase mb-4 text-center">Роль в предложении</h3>
                    <p class="text-center text-gray-800 mb-4 text-lg">
                        Существительное в Именительном падеже — это <b>ГЛАВНЫЙ</b> член предложения.
                    </p>

                    <div class="bg-white p-4 rounded-xl border border-blue-200 text-center shadow-sm">
                        <p class="text-xl font-medium text-gray-800 mb-2">
                            <span class="border-b-2 border-blue-600 font-bold">Солнце</span> светит ярко.
                        </p>
                        <p class="text-sm text-gray-500">
                            (Что?) Солнце — <b>ПОДЛЕЖАЩЕЕ</b>.
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </div>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>


</body>
</html>
