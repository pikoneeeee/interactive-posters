<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плакат 142: Предложный Падеж</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fontawesome.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body { background-color: #f5f3ff; font-family: 'Open Sans', sans-serif; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        .poster {
            width: 210mm; min-height: 297mm; background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 40px;
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        h1, h3 { font-family: 'Montserrat', sans-serif; }
        .card { background: rgba(255,255,255,0.95); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 6px solid; }
        .decor { position: absolute; border-radius: 50%; z-index: 0; }
        .prep-tag { background: #ede9fe; color: #5b21b6; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 1.1em; margin: 5px; display: inline-block; }
    </style>
    <script src="../../libs/chart.min.js"></script>
</head>
<body>

<div class="poster">
        <div class="decor bg-violet-200 w-96 h-96 -top-20 -right-20 opacity-40"></div>
        
        <div class="relative z-10 flex flex-col h-full">
            <header class="text-center mb-10 border-b-4 border-violet-600 pb-6">
                <span class="bg-violet-600 text-white px-4 py-1 rounded-full text-sm font-bold uppercase tracking-widest">Тема №142</span>
                <h1 class="text-4xl font-black text-violet-900 mt-4 uppercase">ПРЕДЛОЖНЫЙ ПАДЕЖ</h1>
                <p class="text-xl text-violet-700 mt-2">О ком? О чём?</p>
            </header>

            <div class="flex-grow space-y-6">
                
                <div class="card border-violet-500 text-center">
                    <p class="text-gray-500 uppercase tracking-widest text-sm mb-2">Слово-помощник: ДУМАЮ / ГОВОРЮ</p>
                    <div class="my-4">
                        <span class="text-4xl font-black text-violet-600 block mb-2">О КОМ?</span>
                        <span class="text-4xl font-black text-violet-600 block">О ЧЁМ?</span>
                    </div>
                </div>

                <div class="card border-purple-500 bg-violet-50">
                    <h3 class="text-xl font-bold text-purple-900 uppercase mb-4 text-center">Предлоги</h3>
                    <div class="text-center mb-4">
                        <span class="prep-tag">О (ОБ)</span>
                        <span class="prep-tag">В</span>
                        <span class="prep-tag">НА</span>
                        <span class="prep-tag">ПРИ</span>
                    </div>
                    
                    <div class="bg-white p-4 rounded-xl border border-purple-200 text-center">
                        <p class="text-lg font-medium text-gray-800 mb-2">
                            Мечтать <b>о каникулах</b>.
                        </p>
                        <p class="text-lg font-medium text-gray-800 mb-2">
                            Жить <b>в городе</b>.
                        </p>
                        <p class="text-lg font-medium text-gray-800">
                            Играть <b>на пианино</b>.
                        </p>
                    </div>
                </div>

                <div class="card border-gray-400 text-center">
                    <p class="text-gray-600 italic">
                        <i class="fas fa-exclamation-triangle mr-1"></i>
                        Предложный падеж употребляется <b>ТОЛЬКО</b> с предлогами!
                    </p>
                </div>

            </div>
        </div>
    </div>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>


</body>
</html>
