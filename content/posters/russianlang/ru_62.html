<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плакат 83: Глагол</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fontawesome.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body { background-color: #eff6ff; font-family: 'Open Sans', sans-serif; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        .poster {
            width: 210mm; min-height: 297mm; background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 40px;
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        h1, h3 { font-family: 'Montserrat', sans-serif; }
        .card { background: rgba(255,255,255,0.95); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 6px solid; }
        .decor { position: absolute; border-radius: 50%; z-index: 0; }
        .double-underline { border-bottom: 3px double #1d4ed8; display: inline-block; padding-bottom: 2px; }
    </style>
    <script src="../../libs/chart.min.js"></script>
</head>
<body>

<div class="poster">
        <div class="decor bg-blue-200 w-96 h-96 -top-20 -right-20 opacity-40"></div>

        <div class="relative z-10 flex flex-col h-full">
            <header class="text-center mb-10 border-b-4 border-blue-600 pb-6">
                <span class="bg-blue-600 text-white px-4 py-1 rounded-full text-sm font-bold uppercase tracking-widest">Тема №83</span>
                <h1 class="text-5xl font-black text-blue-900 mt-4 uppercase">ГЛАГОЛ</h1>
                <p class="text-xl text-blue-700 mt-2">Действие предмета</p>
            </header>

            <div class="flex-grow space-y-6">

                <!-- Definition -->
                <div class="card border-blue-500">
                    <h3 class="text-2xl font-bold text-blue-900 uppercase mb-3 text-center">Часть речи</h3>
                    <p class="text-gray-700 text-lg text-center mb-4">
                        Обозначает действие или состояние предмета.
                    </p>
                    <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 flex justify-around">
                        <div class="text-center">
                            <span class="block font-bold text-blue-800">ЧТО ДЕЛАТЬ?</span>
                            <span class="text-sm">Рисовать, Спать</span>
                        </div>
                        <div class="text-center">
                            <span class="block font-bold text-blue-800">ЧТО СДЕЛАТЬ?</span>
                            <span class="text-sm">Нарисовать, Уснуть</span>
                        </div>
                    </div>
                </div>

                <!-- Syntax -->
                <div class="card border-indigo-500">
                    <h3 class="text-2xl font-bold text-indigo-900 uppercase mb-3 text-center">В предложении</h3>
                    <p class="text-gray-700 text-lg text-center mb-4">
                        Обычно является <b>СКАЗУЕМЫМ</b>.
                    </p>

                    <div class="bg-indigo-50 p-6 rounded-xl border border-indigo-100 text-center">
                        <p class="text-sm text-gray-500 mb-2">Подчёркивается двумя чертами:</p>
                        <div class="text-2xl font-serif text-gray-800">
                            Мальчик <span class="double-underline">читает</span> книгу.
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>


</body>
</html>
