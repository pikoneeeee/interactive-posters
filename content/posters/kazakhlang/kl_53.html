<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фразеологизмдер</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <style>
        
        body { font-family: 'Inter', sans-serif; background-color: #f0fdfa; color: #111827; }
        .container { max-width: 1000px; margin: auto; padding: 20px; }
        .header-card {
            background: linear-gradient(135deg, #b45309, #d97706);
            border-radius: 1rem; color: white; padding: 40px; text-align: center; margin-bottom: 30px;
            box-shadow: 0 10px 25px -5px rgba(180, 83, 9, 0.4);
        }
        .phrase-card {
            background-color: white; border-radius: 1rem; padding: 20px;
            display: flex; align-items: center; border-left: 6px solid #d97706;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .icon { font-size: 3rem; margin-right: 20px; }
        .phrase-title { font-size: 1.25rem; font-weight: 800; color: #92400e; margin-bottom: 5px; }
        .phrase-meaning { color: #4b5563; font-style: italic; }
    </style>
    <script src="../../libs/chart.min.js"></script>
</head>
<body>

<div class="container">
        <header class="header-card">
            <h1 class="text-4xl font-extrabold mb-2">ФРАЗЕОЛОГИЗМДЕР</h1>
            <p class="text-yellow-100 text-lg">Тұрақты сөз тіркестері</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="phrase-card">
                <div class="icon">🦊</div>
                <div>
                    <h3 class="phrase-title">Қой аузынан шөп алмас</h3>
                    <p class="phrase-meaning">Өте момын, жуас адам.</p>
                </div>
            </div>

            <div class="phrase-card">
                <div class="icon">🏃</div>
                <div>
                    <h3 class="phrase-title">Төбе шашы тік тұру</h3>
                    <p class="phrase-meaning">Қатты қорқу, шошыну.</p>
                </div>
            </div>

            <div class="phrase-card">
                <div class="icon">👂</div>
                <div>
                    <h3 class="phrase-title">Құлақ асу</h3>
                    <p class="phrase-meaning">Тыңдау, айтқанға көну.</p>
                </div>
            </div>

            <div class="phrase-card">
                <div class="icon">🤥</div>
                <div>
                    <h3 class="phrase-title">Көз бояу</h3>
                    <p class="phrase-meaning">Алдау, шындықты жасыру.</p>
                </div>
            </div>

            <div class="phrase-card">
                <div class="icon">🤐</div>
                <div>
                    <h3 class="phrase-title">Жұмған аузын ашпау</h3>
                    <p class="phrase-meaning">Үндемеу, сөйлемеу.</p>
                </div>
            </div>

            <div class="phrase-card">
                <div class="icon">👺</div>
                <div>
                    <h3 class="phrase-title">Мұрнын шүйіру</h3>
                    <p class="phrase-meaning">Менсінбеу, тәкаппарлану.</p>
                </div>
            </div>
        </div>
    </div>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>


</body>
</html>
