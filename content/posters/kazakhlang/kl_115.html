<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плакат 28: Хабарландыру</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fontawesome.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body { background-color: #fffbeb; font-family: 'Open Sans', sans-serif; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        .poster {
            width: 210mm; min-height: 297mm; background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 40px;
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        h1, h3 { font-family: 'Montserrat', sans-serif; }
        .card { background: rgba(255,255,255,0.95); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 6px solid; }
        .decor { position: absolute; border-radius: 50%; z-index: 0; }
    </style>
    <script src="../../libs/chart.min.js"></script>
</head>
<body>

<div class="poster">
        <div class="decor bg-yellow-200 w-96 h-96 -bottom-10 -left-10 opacity-40"></div>

        <div class="relative z-10 flex flex-col h-full">
            <header class="text-center mb-10 border-b-4 border-yellow-500 pb-6">
                <span class="bg-yellow-500 text-white px-4 py-1 rounded-full text-sm font-bold uppercase tracking-widest">Тақырып №28</span>
                <h1 class="text-5xl font-black text-yellow-900 mt-4 uppercase">ХАБАРЛАНДЫРУ</h1>
                <p class="text-xl text-yellow-700 mt-2">(Объявление)</p>
            </header>

            <div class="flex-grow space-y-6">

                <div class="card border-yellow-500">
                    <h3 class="text-2xl font-bold text-yellow-900 uppercase mb-3 flex items-center gap-2">
                        <i class="fas fa-bullhorn"></i> Анықтама
                    </h3>
                    <p class="text-gray-700 text-lg">
                        Көпшілікке арналған, белгілі бір жаңалықты, іс-шараны немесе қажеттілікті жария ететін қысқа мәтінді құжат.
                    </p>
                </div>

                <div class="card border-orange-500 bg-yellow-50">
                    <h3 class="text-xl font-bold text-orange-900 uppercase mb-4 text-center">Негізгі сұрақтары</h3>
                    <div class="grid grid-cols-2 gap-4 text-center">
                        <div class="bg-white p-4 rounded-lg shadow-sm border border-yellow-100">
                            <span class="block text-4xl mb-2">📢</span>
                            <span class="font-bold text-gray-800">НЕ БОЛАДЫ?</span>
                        </div>
                        <div class="bg-white p-4 rounded-lg shadow-sm border border-yellow-100">
                            <span class="block text-4xl mb-2">📅</span>
                            <span class="font-bold text-gray-800">ҚАШАН?</span>
                        </div>
                        <div class="bg-white p-4 rounded-lg shadow-sm border border-yellow-100">
                            <span class="block text-4xl mb-2">📍</span>
                            <span class="font-bold text-gray-800">ҚАЙДА?</span>
                        </div>
                        <div class="bg-white p-4 rounded-lg shadow-sm border border-yellow-100">
                            <span class="block text-4xl mb-2">📞</span>
                            <span class="font-bold text-gray-800">БАЙЛАНЫС</span>
                        </div>
                    </div>
                </div>

                <div class="mt-auto bg-yellow-100 p-4 rounded-xl text-center border border-yellow-300">
                    <p class="text-yellow-800 font-bold">Хабарландыру мәтіні қысқа, түсінікті және нақты болуы керек!</p>
                </div>

            </div>
        </div>
    </div>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>


</body>
</html>
