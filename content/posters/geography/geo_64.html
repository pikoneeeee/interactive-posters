<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countries of the World: Diversity and Types</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #020617; color: white; min-height: 100vh; }
        .heading-font { font-family: 'Montserrat', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .rounded-custom { border-radius: 2.5rem; }
        .lang-btn.active { background: #6366f1; color: white; font-weight: 800; }
        .type-card { transition: all 0.3s; cursor: pointer; }
        .type-card:hover { background: rgba(99, 102, 241, 0.15); border-color: #6366f1; }
    </style>
</head>
<body class="p-4 md:p-8">

<header class="glass rounded-custom p-6 mb-8 flex flex-col md:flex-row justify-between items-center border-b border-indigo-500/20">
        <div class="flex items-center gap-4">
            <div class="text-3xl">🏛️</div>
            <div>
                <h1 id="main-title" class="heading-font text-2xl md:text-3xl uppercase tracking-tighter text-indigo-400"></h1>
                <p id="sub-title" class="text-white/40 text-[10px] uppercase tracking-widest"></p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="window.setLang('ru')" id="btn-ru" class="lang-btn px-4 py-2 rounded-xl border border-white/20 text-[10px] font-bold">RU</button>
            <button onclick="window.setLang('kz')" id="btn-kz" class="lang-btn px-4 py-2 rounded-xl border border-white/20 text-[10px] font-bold">KZ</button>
            <button onclick="window.setLang('en')" id="btn-en" class="lang-btn px-4 py-2 rounded-xl border border-white/20 text-[10px] font-bold">EN</button>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-8">
        <div class="lg:col-span-4 flex flex-col justify-center p-8 glass rounded-custom border-l-8 border-indigo-500">
            <h3 id="info-title" class="heading-font text-3xl mb-6 text-white"></h3>
            <div id="info-text" class="text-lg font-light leading-relaxed text-white/70 space-y-6"></div>
        </div>

        <div class="lg:col-span-8 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div onclick="showDetail('monarchy')" class="type-card glass p-8 rounded-3xl border border-white/5 flex flex-col justify-center">
                <span class="text-4xl mb-4">👑</span>
                <h4 id="t1-n" class="font-bold text-indigo-400 uppercase text-xs tracking-widest mb-2"></h4>
                <p id="t1-d" class="text-xs text-white/50"></p>
            </div>
            <div onclick="showDetail('republic')" class="type-card glass p-8 rounded-3xl border border-white/5 flex flex-col justify-center">
                <span class="text-4xl mb-4">🗳️</span>
                <h4 id="t2-n" class="font-bold text-indigo-400 uppercase text-xs tracking-widest mb-2"></h4>
                <p id="t2-d" class="text-xs text-white/50"></p>
            </div>
            <div onclick="showDetail('giant')" class="type-card glass p-8 rounded-3xl border border-white/5 flex flex-col justify-center">
                <span class="text-4xl mb-4">📐</span>
                <h4 id="t3-n" class="font-bold text-indigo-400 uppercase text-xs tracking-widest mb-2"></h4>
                <p id="t3-d" class="text-xs text-white/50"></p>
            </div>
            <div onclick="showDetail('island')" class="type-card glass p-8 rounded-3xl border border-white/5 flex flex-col justify-center">
                <span class="text-4xl mb-4">🏝️</span>
                <h4 id="t4-n" class="font-bold text-indigo-400 uppercase text-xs tracking-widest mb-2"></h4>
                <p id="t4-d" class="text-xs text-white/50"></p>
            </div>
        </div>
    </main>

    <script>
        const translations = {
            ru: {
                title: "Страны Мира", subtitle: "Политическое и территориальное многообразие",
                defaultTitle: "Мир государств",
                defaultText: "На современной карте мира насчитывается около 230 стран (из них более 190 — суверенные государства). Страны различаются по площади, численности населения, форме правления и уровню развития.",
                types: {
                    monarchy: { n: "Монархия", d: "Власть принадлежит одному человеку и передается по наследству. Бывают абсолютными и конституционными (Великобритания)." },
                    republic: { n: "Республика", d: "Органы власти выбираются на определенный срок. Самая распространенная форма правления в современном мире." },
                    giant: { n: "Страны-гиганты", d: "Страны с огромной территорией (Россия, Канада, Китай, США, Бразилия, Австралия, Индия, Казахстан)." },
                    island: { n: "Островные", d: "Государства, расположенные полностью на островах (Япония, Индонезия, Мадагаскар)." }
                }
            },
            kz: {
                title: "Әлем Елдері", subtitle: "Саяси және аумақтық әртүрлілік",
                defaultTitle: "Мемлекеттер әлемі",
                defaultText: "Қазіргі дүниежүзілік картада 230-ға жуық ел бар (оның 190-нан астамы егеменді мемлекеттер). Елдер аумағы, халқы және басқару формасы бойынша ерекшеленеді.",
                types: {
                    monarchy: { n: "Монархия", d: "Билік бір адамның қолында болады және мұрагерлікпен беріледі (Ұлыбритания, Сауд Арабиясы)." },
                    republic: { n: "Республика", d: "Билік органдары белгілі бір мерзімге сайланады. Қазіргі әлемдегі ең көп таралған басқару түрі." },
                    giant: { n: "Алып елдер", d: "Аумағы өте үлкен елдер (Ресей, Канада, Қытай, АҚШ, Бразилия, Австралия, Үндістан, Қазақстан)." },
                    island: { n: "Аралдық", d: "Толығымен аралдарда орналасқан мемлекеттер (Жапония, Индонезия, Мадагаскар)." }
                }
            },
            en: {
                title: "World Countries", subtitle: "Political and Territorial Diversity",
                defaultTitle: "World of States",
                defaultText: "There are about 230 countries on the modern world map (over 190 are sovereign states). They differ in land area, population size, government form, and development level.",
                types: {
                    monarchy: { n: "Monarchy", d: "Power is held by a single individual and inherited. Can be absolute or constitutional (e.g., UK)." },
                    republic: { n: "Republic", d: "Authorities are elected for a specific term. The most common form of government today." },
                    giant: { n: "Giant Countries", d: "Countries with vast territories (Russia, Canada, China, USA, Brazil, Australia, India, Kazakhstan)." },
                    island: { n: "Island Nations", d: "States located entirely on islands (e.g., Japan, Indonesia, Madagascar)." }
                }
            }
        };

        let currentLang = 'ru';

        window.setLang = function(l) { currentLang = l; updateUI(); }
        window.showDetail = function(key) {
            const t = translations[currentLang].types[key];
            document.getElementById('info-title').textContent = t.n;
            document.getElementById('info-text').textContent = t.d;
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('sub-title').textContent = t.subtitle;
            document.getElementById('info-title').textContent = t.defaultTitle;
            document.getElementById('info-text').textContent = t.defaultText;
            
            document.getElementById('t1-n').textContent = t.types.monarchy.n; document.getElementById('t1-d').textContent = t.types.monarchy.d;
            document.getElementById('t2-n').textContent = t.types.republic.n; document.getElementById('t2-d').textContent = t.types.republic.d;
            document.getElementById('t3-n').textContent = t.types.giant.n; document.getElementById('t3-d').textContent = t.types.giant.d;
            document.getElementById('t4-n').textContent = t.types.island.n; document.getElementById('t4-d').textContent = t.types.island.d;
        }

        // Читаем язык из URL параметра
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'ru';
        console.log('Плакат: язык из URL =', lang);
        
        window.onload = () => setLang(lang);
    </script>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>









<style data-oi-map-overlay>
.oi-map-btn{
  position:fixed; right:16px; bottom:16px; z-index:9999;
  padding:10px 14px; border-radius:999px; border:1px solid rgba(0,0,0,.15);
  background:#fff; cursor:pointer; font:600 14px/1.1 system-ui,-apple-system,Segoe UI,Roboto,Arial;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}
.oi-table-btn{
  position:fixed; right:120px; bottom:16px; z-index:9999;
  padding:10px 14px; border-radius:999px; border:1px solid rgba(0,0,0,.15);
  background:#fff; cursor:pointer; font:600 14px/1.1 system-ui,-apple-system,Segoe UI,Roboto,Arial;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.oi-map-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:10000;
  display:none; align-items:center; justify-content:center; padding:18px;
}
.oi-map-backdrop[aria-hidden="false"]{ display:flex; }

.oi-map-modal{
  width:min(1200px, 100%); height:min(85vh, 900px);
  background:#111; border-radius:14px; overflow:hidden; position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.oi-map-close{
  position:absolute; top:10px; right:10px; z-index:3;
  width:40px; height:40px; border-radius:999px; border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.35); color:#fff; cursor:pointer; font-size:22px;
}

.oi-map-viewport{
  width:100%; height:100%; overflow:auto; -webkit-overflow-scrolling:touch;
  touch-action: pan-x pan-y;
  background:#000;
  padding-top:62px; /* место под тулбар */
}

.oi-map-img{
  display:block;
  transform-origin: 0 0;
  user-select:none; -webkit-user-drag:none;
}

.oi-map-toolbar{
  position:absolute; left:12px; top:12px; right:12px; z-index:2;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  pointer-events:none;
}

.oi-map-tabs{ display:flex; gap:8px; flex-wrap:wrap; pointer-events:auto; }

.oi-map-tab{
  min-width:36px; height:34px; padding:0 10px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(0,0,0,.35); color:#fff;
  cursor:pointer; font:600 14px system-ui,-apple-system,Segoe UI,Roboto,Arial;
}

.oi-map-tab.is-active{
  background:rgba(255,255,255,.12);
  border-color: rgba(255,255,255,.45);
}

.oi-map-hint{
  pointer-events:none;
  color:#fff; opacity:.85; font:12px/1.2 system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.18);
  padding:8px 10px; border-radius:10px;
}
</style>

<button class="oi-map-btn" type="button" data-oi-map-btn>🗺️ Карта</button>


<div class="oi-map-backdrop" aria-hidden="true" data-oi-map-backdrop>
  <div class="oi-map-modal" role="dialog" aria-modal="true" aria-label="Карта">
    <button class="oi-map-close" type="button" aria-label="Закрыть" data-oi-map-close>×</button>

    <div class="oi-map-toolbar">
      <div class="oi-map-tabs">
        <button type="button" class="oi-map-tab is-active" data-oi-map-tab="1">1</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="2">2</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="3">3</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="4">4</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="5">5</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="6">6</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="7">7</button>
      </div>
      <div class="oi-map-hint">Колёсико/трекпад — зум • Esc — закрыть</div>

    <div class="oi-map-viewport" data-oi-map-viewport>

<img class="oi-map-img" data-oi-map-img data-map="2" src="../../assets/maps/karta_2.png" alt="map 2" style="display:none;">
<img class="oi-map-img" data-oi-map-img data-map="3" src="../../assets/maps/karta_3.png" alt="map 3" style="display:none;">
<img class="oi-map-img" data-oi-map-img data-map="4" src="../../assets/maps/karta_4.png" alt="map 4" style="display:none;">
<img class="oi-map-img" data-oi-map-img data-map="5" src="../../assets/maps/karta_5.png" alt="map 5" style="display:none;">
<img class="oi-map-img" data-oi-map-img data-map="6" src="../../assets/maps/karta_6.png" alt="map 6" style="display:none;">
<img class="oi-map-img" data-oi-map-img data-map="7" src="../../assets/maps/karta_7.png" alt="map 7" style="display:none;">
    </div>
  </div>
</div>




<script data-oi-map-overlay>
(function(){
  // ====== MAPS ======
  const mapBtn = document.querySelector('[data-oi-map-btn]');
  const mapBackdrop = document.querySelector('[data-oi-map-backdrop]');
  const mapCloseBtn = document.querySelector('[data-oi-map-close]');
  const mapViewport = document.querySelector('[data-oi-map-viewport]');
  const mapTabs = Array.from(document.querySelectorAll('[data-oi-map-tab]'));
  const mapImgs = Array.from(document.querySelectorAll('[data-oi-map-img][data-map]'));

  // ====== MENDELEEV ======
  const tableBtn = document.querySelector('[data-oi-table-btn]');
  const tableBackdrop = document.querySelector('[data-oi-table-backdrop]');
  const tableCloseBtn = document.querySelector('[data-oi-table-close]');
  const tableViewport = document.querySelector('[data-oi-table-viewport]');
  const tableTabs = Array.from(document.querySelectorAll('[data-oi-table-tab]'));
  const tableImgs = Array.from(document.querySelectorAll('[data-oi-table-img][data-table]'));

  let scale = 1;

  function applyScale(){
    mapImgs.forEach(img => { img.style.transform = `scale(${scale})`; });
    tableImgs.forEach(img => { img.style.transform = `scale(${scale})`; });
  }

  function openBackdrop(backdrop){
    backdrop.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
  }
  function closeBackdrop(backdrop){
    backdrop.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
  }

  function showMap(n){
    mapImgs.forEach(img => {
      img.style.display = (img.getAttribute('data-map') === String(n)) ? 'block' : 'none';
    });
    mapTabs.forEach(t => t.classList.toggle('is-active', t.getAttribute('data-oi-map-tab') === String(n)));
    if(mapViewport){ mapViewport.scrollTop = 0; mapViewport.scrollLeft = 0; }
  }

  function showTable(n){
    tableImgs.forEach(img => {
      img.style.display = (img.getAttribute('data-table') === String(n)) ? 'block' : 'none';
    });
    tableTabs.forEach(t => t.classList.toggle('is-active', t.getAttribute('data-oi-table-tab') === String(n)));
    if(tableViewport){ tableViewport.scrollTop = 0; tableViewport.scrollLeft = 0; }
  }

  // MAP events
  if(mapBtn && mapBackdrop && mapCloseBtn && mapViewport && mapImgs.length){
    mapBtn.addEventListener('click', () => openBackdrop(mapBackdrop));
    mapCloseBtn.addEventListener('click', () => closeBackdrop(mapBackdrop));
    mapBackdrop.addEventListener('click', (e)=>{ if(e.target === mapBackdrop) closeBackdrop(mapBackdrop); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeBackdrop(mapBackdrop); });
    mapTabs.forEach(t => t.addEventListener('click', () => showMap(t.getAttribute('data-oi-map-tab'))));

    mapViewport.addEventListener('wheel', (e)=>{
      if(mapBackdrop.getAttribute('aria-hidden') !== 'false') return;
      e.preventDefault();
      const delta = -Math.sign(e.deltaY) * 0.1;
      scale = Math.min(4, Math.max(0.6, scale + delta));
      applyScale();
    }, {passive:false});

    showMap(1);
  }

  // TABLE events
  if(tableBtn && tableBackdrop && tableCloseBtn && tableViewport && tableImgs.length){
    tableBtn.addEventListener('click', () => openBackdrop(tableBackdrop));
    tableCloseBtn.addEventListener('click', () => closeBackdrop(tableBackdrop));
    tableBackdrop.addEventListener('click', (e)=>{ if(e.target === tableBackdrop) closeBackdrop(tableBackdrop); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeBackdrop(tableBackdrop); });
    tableTabs.forEach(t => t.addEventListener('click', () => showTable(t.getAttribute('data-oi-table-tab'))));

    tableViewport.addEventListener('wheel', (e)=>{
      if(tableBackdrop.getAttribute('aria-hidden') !== 'false') return;
      e.preventDefault();
      const delta = -Math.sign(e.deltaY) * 0.1;
      scale = Math.min(4, Math.max(0.6, scale + delta));
      applyScale();
    }, {passive:false});

    showTable(1);
  }

  applyScale();
})();
</script>
</body>
</html>
