<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Map: Political Geography</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #0f172a, #000000);
            color: white;
            min-height: 100vh;
        }
        .heading-font { font-family: 'Montserrat', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .rounded-custom { border-radius: 2.5rem; }
        canvas { cursor: grab; }
        canvas:active { cursor: grabbing; }
        .lang-btn.active { background: #38bdf8; color: #0f172a; font-weight: 800; }
    </style>
</head>
<body class="p-4 md:p-8">

<header class="glass rounded-custom p-6 mb-6 flex flex-col md:flex-row justify-between items-center border-b border-sky-500/30">
        <div>
            <h1 id="main-title" class="heading-font text-2xl md:text-4xl uppercase tracking-tighter text-sky-400"></h1>
            <p id="sub-title" class="mt-2 text-white/50 font-light tracking-widest text-xs uppercase"></p>
        </div>
        <div class="flex gap-2 mt-4 md:mt-0">
            <button onclick="setLang('ru')" id="btn-ru" class="lang-btn px-4 py-2 rounded-xl border border-white/20 text-xs font-bold transition-all">RU</button>
            <button onclick="setLang('kz')" id="btn-kz" class="lang-btn px-4 py-2 rounded-xl border border-white/20 text-xs font-bold transition-all">KZ</button>
            <button onclick="setLang('en')" id="btn-en" class="lang-btn px-4 py-2 rounded-xl border border-white/20 text-xs font-bold transition-all">EN</button>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-6">
        <!-- Globe Canvas -->
        <div class="lg:col-span-8 glass rounded-custom p-4 relative flex flex-col items-center justify-center min-h-[500px]">
            <h2 id="canvas-heading" class="heading-font text-lg text-sky-200 uppercase absolute top-6 left-8 opacity-70"></h2>
            <canvas id="globeCanvas"></canvas>
            <div class="absolute bottom-6 flex gap-4 text-[10px] text-white/30 uppercase tracking-widest">
                <span id="hint-rotate">Drag to rotate</span> • <span id="hint-click">Click points</span>
            </div>
        </div>

        <!-- Info Panel -->
        <div class="lg:col-span-4 glass rounded-custom p-8 flex flex-col justify-center border-r-4 border-sky-500">
            <div id="info-content" class="transition-opacity duration-300">
                <div id="country-flag" class="text-6xl mb-4">🌍</div>
                <h3 id="info-title" class="heading-font text-3xl mb-4 text-sky-300"></h3>
                <div id="info-text" class="text-sm font-light leading-relaxed text-white/80 space-y-4"></div>
            </div>
        </div>
    </main>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
        <div class="glass rounded-custom p-8 hover:bg-sky-500/10 transition-all border-t border-white/5">
            <h4 id="card1-title" class="heading-font text-lg mb-3 text-sky-400"></h4>
            <div id="card1-desc" class="text-white/60 text-xs leading-relaxed"></div>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-sky-500/10 transition-all border-t border-white/5">
            <h4 id="card2-title" class="heading-font text-lg mb-3 text-sky-400"></h4>
            <div id="card2-desc" class="text-white/60 text-xs leading-relaxed"></div>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-sky-500/10 transition-all border-t border-white/5">
            <h4 id="card3-title" class="heading-font text-lg mb-3 text-sky-400"></h4>
            <div id="card3-desc" class="text-white/60 text-xs leading-relaxed"></div>
        </div>
    </section>

    <script>
        const translations = {
            ru: {
                title: "Политическая Карта",
                subtitle: "Государства и столицы мира",
                canvasHeading: "3D Глобус",
                hintRotate: "Тяните для вращения",
                hintClick: "Нажмите на город",
                defaultTitle: "Политическая география",
                defaultText: "Политическая карта мира — это географическая карта, на которой изображены государственные границы всех стран мира. В настоящее время в мире насчитывается более 200 государств.",
                cities: {
                    astana: { name: "Астана (Казахстан)", flag: "🇰🇿", text: "Столица Казахстана. Крупнейший политический, административный, деловой и культурный центр страны." },
                    london: { name: "Лондон (Великобритания)", flag: "🇬🇧", text: "Столица Соединенного Королевства. Один из ведущих мировых финансовых центров." },
                    tokyo: { name: "Токио (Япония)", flag: "🇯🇵", text: "Столица Японии. Самая густонаселенная городская агломерация в мире." },
                    ny: { name: "Вашингтон (США)", flag: "🇺🇸", text: "Столица Соединенных Штатов Америки. Местопребывание президента и конгресса." },
                    brasilia: { name: "Бразилиа (Бразилия)", flag: "🇧🇷", text: "Столица Бразилии, построенная по специальному плану в виде самолета в центре страны." }
                },
                cards: [
                    { title: "Суверенитет", desc: "Независимость государства во внешних делах и верховенство государственной власти во внутренних делах." },
                    { title: "Границы", desc: "Линии, определяющие пределы государственной территории (суши, вод, недр и воздушного пространства)." },
                    { title: "Столица", desc: "Главный город государства, местопребывание правительства и других высших органов власти." }
                ]
            },
            kz: {
                title: "Саяси Карта",
                subtitle: "Әлем мемлекеттері мен астаналары",
                canvasHeading: "3D Глобус",
                hintRotate: "Айналдыру үшін тартыңыз",
                hintClick: "Қаланы басыңыз",
                defaultTitle: "Саяси география",
                defaultText: "Әлемнің саяси картасы — әлемнің барлық елдерінің мемлекеттік шекаралары бейнеленген географиялық карта. Қазіргі уақытта әлемде 200-ден астам мемлекет бар.",
                cities: {
                    astana: { name: "Астана (Қазақстан)", flag: "🇰🇿", text: "Қазақстанның астанасы. Елдің ірі саяси, әкімшілік, іскерлік және мәдени орталығы." },
                    london: { name: "Лондон (Ұлыбритания)", flag: "🇬🇧", text: "Біріккен Корольдіктің астанасы. Әлемдегі жетекші қаржы орталықтарының бірі." },
                    tokyo: { name: "Токио (Жапония)", flag: "🇯🇵", text: "Жапонияның астанасы. Әлемдегі ең тығыз қоныстанған қалалық агломерация." },
                    ny: { name: "Вашингтон (АҚШ)", flag: "🇺🇸", text: "Америка Құрама Штаттарының астанасы. Президент пен конгресстің орналасқан жері." },
                    brasilia: { name: "Бразилиа (Бразилия)", flag: "🇧🇷", text: "Бразилияның астанасы, елдің орталығында ұшақ пішінінде арнайы жоспармен салынған." }
                },
                cards: [
                    { title: "Егемендік", desc: "Мемлекеттің сыртқы істердегі тәуелсіздігі және ішкі істердегі мемлекеттік биліктің үстемдігі." },
                    { title: "Шекаралар", desc: "Мемлекеттік аумақтың (құрлық, су, жер қойнауы және әуе кеңістігі) шегін анықтайтын сызықтар." },
                    { title: "Астана", desc: "Мемлекеттің бас қаласы, үкіметтің және басқа да жоғарғы билік органдарының орналасқан жері." }
                ]
            },
            en: {
                title: "Political Map",
                subtitle: "States and Capitals of the World",
                canvasHeading: "3D Globe",
                hintRotate: "Drag to rotate",
                hintClick: "Click a city",
                defaultTitle: "Political Geography",
                defaultText: "The political map of the world shows the state borders of all countries. Currently, there are over 200 states in the world.",
                cities: {
                    astana: { name: "Astana (Kazakhstan)", flag: "🇰🇿", text: "Capital of Kazakhstan. Major political, administrative, business, and cultural center." },
                    london: { name: "London (UK)", flag: "🇬🇧", text: "Capital of the United Kingdom. One of the world's leading financial centers." },
                    tokyo: { name: "Tokyo (Japan)", flag: "🇯🇵", text: "Capital of Japan. The most populous urban agglomeration in the world." },
                    ny: { name: "Washington D.C. (USA)", flag: "🇺🇸", text: "Capital of the USA. Seat of the President and Congress." },
                    brasilia: { name: "Brasilia (Brazil)", flag: "🇧🇷", text: "Capital of Brazil, built on a specific plan in the shape of an airplane." }
                },
                cards: [
                    { title: "Sovereignty", desc: "Independence of a state in foreign affairs and supremacy of state power in internal affairs." },
                    { title: "Borders", desc: "Lines defining the limits of state territory (land, water, subsoil, and airspace)." },
                    { title: "Capital", desc: "The principal city of a state, the seat of government and other high authorities." }
                ]
            }
        };

        let currentLang = 'ru';
        let rotation = 0;
        let isDragging = false;
        let lastX = 0;
        let canvas, ctx;

        // Coordinates approximate
        const points = [
            { id: 'astana', lat: 51, lon: 71, color: '#facc15' },
            { id: 'london', lat: 51, lon: 0, color: '#f87171' },
            { id: 'tokyo', lat: 35, lon: 139, color: '#f472b6' },
            { id: 'ny', lat: 38, lon: -77, color: '#60a5fa' },
            { id: 'brasilia', lat: -15, lon: -47, color: '#4ade80' }
        ];

        window.setLang = function(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');
            updateUI();
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('sub-title').textContent = t.subtitle;
            document.getElementById('canvas-heading').textContent = t.canvasHeading;
            document.getElementById('hint-rotate').textContent = t.hintRotate;
            document.getElementById('hint-click').textContent = t.hintClick;
            
            // If default state
            const infoTitle = document.getElementById('info-title');
            if (infoTitle.textContent === '' || infoTitle.textContent === translations['ru'].defaultTitle || infoTitle.textContent === translations['kz'].defaultTitle || infoTitle.textContent === translations['en'].defaultTitle) {
                infoTitle.textContent = t.defaultTitle;
                document.getElementById('info-text').textContent = t.defaultText;
                document.getElementById('country-flag').textContent = "🌍";
            }

            document.getElementById('card1-title').textContent = t.cards[0].title;
            document.getElementById('card1-desc').innerHTML = t.cards[0].desc;
            document.getElementById('card2-title').textContent = t.cards[1].title;
            document.getElementById('card2-desc').innerHTML = t.cards[1].desc;
            document.getElementById('card3-title').textContent = t.cards[2].title;
            document.getElementById('card3-desc').innerHTML = t.cards[2].desc;
        }

        function draw() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const r = Math.min(canvas.width, canvas.height) * 0.35;

            // Atmosphere glow
            const grad = ctx.createRadialGradient(cx - r*0.3, cy - r*0.3, r*0.1, cx, cy, r);
            grad.addColorStop(0, '#1e3a8a');
            grad.addColorStop(1, '#0f172a');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();

            // Grid
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1;
            
            ctx.beginPath();
            // Longitude lines
            for (let i = 0; i < 360; i += 30) {
                const radX = Math.abs(r * Math.cos((rotation + i) * Math.PI / 180));
                ctx.ellipse(cx, cy, radX, r, 0, 0, Math.PI * 2);
            }
            // Latitude lines
            ctx.ellipse(cx, cy, r, r*0.3, 0, 0, Math.PI*2); 
            ctx.ellipse(cx, cy, r, r*0.7, 0, 0, Math.PI*2); 
            ctx.stroke();

            // Points
            points.forEach(p => {
                let lon = p.lon + rotation;
                // Normalize to -180...180 range for visibility check
                while (lon > 180) lon -= 360;
                while (lon < -180) lon += 360;

                // Draw if visible (front hemisphere)
                if (lon > -90 && lon < 90) {
                    const x = cx + r * Math.cos(p.lat * Math.PI / 180) * Math.sin(lon * Math.PI / 180);
                    const y = cy - r * Math.sin(p.lat * Math.PI / 180);
                    
                    // Pulse effect
                    const time = Date.now() * 0.003;
                    ctx.beginPath();
                    ctx.arc(x, y, 6 + Math.sin(time)*2, 0, Math.PI*2);
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 15; ctx.shadowColor = p.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    
                    // Label
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 10px Inter';
                    ctx.fillText(p.id.toUpperCase(), x + 10, y + 3);
                }
            });

            // Outer ring
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(cx, cy, r + 5, 0, Math.PI*2); ctx.stroke();

            requestAnimationFrame(draw);
        }

        window.onload = function() {
            canvas = document.getElementById('globeCanvas');
            if(canvas) {
                ctx = canvas.getContext('2d');
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight || 500;
                
                canvas.addEventListener('mousedown', (e) => { isDragging = true; lastX = e.clientX; });
                window.addEventListener('mouseup', () => isDragging = false);
                window.addEventListener('mousemove', (e) => {
                    if (isDragging) {
                        const delta = e.clientX - lastX;
                        rotation += delta * 0.5;
                        lastX = e.clientX;
                    }
                });

                canvas.addEventListener('click', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const mx = e.clientX - rect.left;
                    const my = e.clientY - rect.top;
                    const cx = canvas.width / 2;
                    const cy = canvas.height / 2;
                    const r = Math.min(canvas.width, canvas.height) * 0.35;

                    points.forEach(p => {
                        let lon = p.lon + rotation;
                        while (lon > 180) lon -= 360;
                        while (lon < -180) lon += 360;

                        if (lon > -90 && lon < 90) {
                            const x = cx + r * Math.cos(p.lat * Math.PI / 180) * Math.sin(lon * Math.PI / 180);
                            const y = cy - r * Math.sin(p.lat * Math.PI / 180);
                            
                            const dist = Math.sqrt((mx-x)**2 + (my-y)**2);
                            if(dist < 20) {
                                const data = translations[currentLang].cities[p.id];
                                document.getElementById('info-title').textContent = data.name;
                                document.getElementById('info-text').textContent = data.text;
                                document.getElementById('country-flag').textContent = data.flag;
                            }
                        }
                    });
                });

                setLang('ru');
                draw();
            }
        };

        window.onresize = function() {
            if(canvas) {
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight || 500;
            }
        };
    </script>

<script data-oi-map-overlay>
(function(){
  // ====== MAPS ======
  const mapBtn = document.querySelector('[data-oi-map-btn]');
  const mapBackdrop = document.querySelector('[data-oi-map-backdrop]');
  const mapCloseBtn = document.querySelector('[data-oi-map-close]');
  const mapViewport = document.querySelector('[data-oi-map-viewport]');
  const mapTabs = Array.from(document.querySelectorAll('[data-oi-map-tab]'));
  const mapImgs = Array.from(document.querySelectorAll('[data-oi-map-img][data-map]'));

  // ====== MENDELEEV ======
  const tableBtn = document.querySelector('[data-oi-table-btn]');
  const tableBackdrop = document.querySelector('[data-oi-table-backdrop]');
  const tableCloseBtn = document.querySelector('[data-oi-table-close]');
  const tableViewport = document.querySelector('[data-oi-table-viewport]');
  const tableTabs = Array.from(document.querySelectorAll('[data-oi-table-tab]'));
  const tableImgs = Array.from(document.querySelectorAll('[data-oi-table-img][data-table]'));

  let scale = 1;

  function applyScale(){
    mapImgs.forEach(img => { img.style.transform = `scale(${scale})`; });
    tableImgs.forEach(img => { img.style.transform = `scale(${scale})`; });
  }

  function openBackdrop(backdrop){
    backdrop.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
  }
  function closeBackdrop(backdrop){
    backdrop.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
  }

  function showMap(n){
    mapImgs.forEach(img => {
      img.style.display = (img.getAttribute('data-map') === String(n)) ? 'block' : 'none';
    });
    mapTabs.forEach(t => t.classList.toggle('is-active', t.getAttribute('data-oi-map-tab') === String(n)));
    if(mapViewport){ mapViewport.scrollTop = 0; mapViewport.scrollLeft = 0; }
  }

  function showTable(n){
    tableImgs.forEach(img => {
      img.style.display = (img.getAttribute('data-table') === String(n)) ? 'block' : 'none';
    });
    tableTabs.forEach(t => t.classList.toggle('is-active', t.getAttribute('data-oi-table-tab') === String(n)));
    if(tableViewport){ tableViewport.scrollTop = 0; tableViewport.scrollLeft = 0; }
  }

  // MAP events
  if(mapBtn && mapBackdrop && mapCloseBtn && mapViewport && mapImgs.length){
    mapBtn.addEventListener('click', () => openBackdrop(mapBackdrop));
    mapCloseBtn.addEventListener('click', () => closeBackdrop(mapBackdrop));
    mapBackdrop.addEventListener('click', (e)=>{ if(e.target === mapBackdrop) closeBackdrop(mapBackdrop); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeBackdrop(mapBackdrop); });
    mapTabs.forEach(t => t.addEventListener('click', () => showMap(t.getAttribute('data-oi-map-tab'))));

    mapViewport.addEventListener('wheel', (e)=>{
      if(mapBackdrop.getAttribute('aria-hidden') !== 'false') return;
      e.preventDefault();
      const delta = -Math.sign(e.deltaY) * 0.1;
      scale = Math.min(4, Math.max(0.6, scale + delta));
      applyScale();
    }, {passive:false});

    showMap(1);
  }

  // TABLE events
  if(tableBtn && tableBackdrop && tableCloseBtn && tableViewport && tableImgs.length){
    tableBtn.addEventListener('click', () => openBackdrop(tableBackdrop));
    tableCloseBtn.addEventListener('click', () => closeBackdrop(tableBackdrop));
    tableBackdrop.addEventListener('click', (e)=>{ if(e.target === tableBackdrop) closeBackdrop(tableBackdrop); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeBackdrop(tableBackdrop); });
    tableTabs.forEach(t => t.addEventListener('click', () => showTable(t.getAttribute('data-oi-table-tab'))));

    tableViewport.addEventListener('wheel', (e)=>{
      if(tableBackdrop.getAttribute('aria-hidden') !== 'false') return;
      e.preventDefault();
      const delta = -Math.sign(e.deltaY) * 0.1;
      scale = Math.min(4, Math.max(0.6, scale + delta));
      applyScale();
    }, {passive:false});

    showTable(1);
  }

  applyScale();
})();
</script>
</body>
</html>
