<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Settlement and Races</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top, #1e1b4b, #020617); color: white; min-height: 100vh; }
        .heading-font { font-family: 'Montserrat', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .rounded-custom { border-radius: 2.5rem; }
        .lang-btn.active { background: #6366f1; color: white; font-weight: 800; }
        .race-btn { transition: all 0.3s; }
        .race-btn.active { background: rgba(99, 102, 241, 0.2); border-color: #6366f1; color: #a5b4fc; }
    </style>
</head>
<body class="p-4 md:p-8">

<header class="glass rounded-custom p-6 mb-6 flex flex-col md:flex-row justify-between items-center border-t border-indigo-500/30">
        <div>
            <h1 id="main-title" class="heading-font text-2xl md:text-4xl uppercase tracking-tighter text-indigo-400"></h1>
            <p id="sub-title" class="mt-1 text-white/30 font-bold uppercase tracking-widest text-[10px]"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="window.setLang('ru')" id="btn-ru" class="lang-btn px-4 py-2 rounded-xl border border-white/20 text-xs font-bold transition-all">RU</button>
            <button onclick="window.setLang('kz')" id="btn-kz" class="lang-btn px-4 py-2 rounded-xl border border-white/20 text-xs font-bold transition-all">KZ</button>
            <button onclick="window.setLang('en')" id="btn-en" class="lang-btn px-4 py-2 rounded-xl border border-white/20 text-xs font-bold transition-all">EN</button>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-6">
        <div class="lg:col-span-3 flex flex-col gap-3">
             <h3 id="nav-title" class="heading-font text-sm text-indigo-300 uppercase mb-2 tracking-widest">Races</h3>
             <button onclick="showRace('euro')" id="btn-euro" class="race-btn p-4 glass rounded-2xl text-left text-xs font-bold uppercase border border-white/5"></button>
             <button onclick="showRace('mong')" id="btn-mong" class="race-btn p-4 glass rounded-2xl text-left text-xs font-bold uppercase border border-white/5"></button>
             <button onclick="showRace('negro')" id="btn-negro" class="race-btn p-4 glass rounded-2xl text-left text-xs font-bold uppercase border border-white/5"></button>
        </div>

        <div class="lg:col-span-9 glass rounded-custom p-10 flex flex-col justify-center border-l-4 border-indigo-500 min-h-[400px] relative overflow-hidden">
            <div id="display-view" class="transition-all duration-500">
                <h3 id="display-title" class="heading-font text-4xl mb-6 text-white"></h3>
                <div id="display-text" class="text-xl font-light leading-relaxed text-white/80 space-y-6"></div>
            </div>
            <!-- Decorative backdrop -->
            <div class="absolute -bottom-20 -right-20 w-80 h-80 bg-indigo-500/10 blur-[120px] rounded-full"></div>
        </div>
    </main>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="glass rounded-custom p-8">
            <h4 id="fact-title" class="font-bold text-indigo-400 text-xs uppercase mb-2">History</h4>
            <p id="fact-text" class="text-sm text-white/60"></p>
        </div>
        <div class="glass rounded-custom p-8 flex flex-col justify-center items-center text-center">
            <div class="text-3xl mb-2">🌍 ➡️ 🌏</div>
            <p id="migration-text" class="text-[10px] uppercase tracking-widest text-white/40"></p>
        </div>
        <div class="glass rounded-custom p-8">
            <h4 id="equality-title" class="font-bold text-indigo-400 text-xs uppercase mb-2">Equality</h4>
            <p id="equality-text" class="text-sm text-white/60"></p>
        </div>
    </section>

    <script>
        const translations = {
            ru: {
                title: "Расы и Заселение", subtitle: "Путь человечества сквозь тысячелетия",
                navTitle: "Основные расы",
                btnEuro: "Европеоидная", btnMong: "Монголоидная", btnNegro: "Негроидная",
                races: {
                    euro: { t: "Европеоидная раса", d: "Характерны светлая кожа, мягкие волосы, узкий нос. Сформировалась в условиях умеренного и холодного климата Европы и Азии." },
                    mong: { t: "Монголоидная раса", d: "Характерны желтоватая кожа, прямые жесткие волосы, узкий разрез глаз. Сформировалась в открытых степях и пустынях Азии." },
                    negro: { t: "Негроидная раса", d: "Характерны темная кожа, курчавые волосы, широкий нос. Темный пигмент защищает от жесткого солнечного излучения тропиков." }
                },
                history: "Предки человека начали заселение планеты из Восточной Африки около 70-100 тысяч лет назад.",
                migration: "Великая миграция: Африка -> Евразия -> Америка",
                equality: "Все расы биологически равны. Различия во внешности — это лишь адаптация к разным климатическим условиям."
            },
            kz: {
                title: "Нәсілдер және Қоныстану", subtitle: "Адамзаттың мыңжылдықтардағы жолы",
                navTitle: "Негізгі нәсілдер",
                btnEuro: "Еуропеоидтық", btnMong: "Монголоидтық", btnNegro: "Негроидтық",
                races: {
                    euro: { t: "Еуропеоидтық нәсіл", d: "Ашық тері, жұмсақ шаш, жіңішке мұрын тән. Еуропа мен Азияның қоңыржай және суық климатында қалыптасқан." },
                    mong: { t: "Монголоидтық нәсіл", d: "Сары тері, тік қайратты шаш, қысық көз тән. Азияның ашық далалары мен шөлдерінде қалыптасқан." },
                    negro: { t: "Негроидтық нәсіл", d: "Қара тері, бұйра шаш, жалпақ мұрын тән. Қара пигмент тропиктің қатты күн сәулесінен қорғайды." }
                },
                history: "Адамның арғы аталары планетаны Шығыс Африкадан шамамен 70-100 мың жыл бұрын қоныстана бастаған.",
                migration: "Ұлы миграция: Африка -> Евразия -> Америка",
                equality: "Барлық нәсілдер биологиялық тұрғыдан тең. Сыртқы айырмашылықтар — климатқа бейімделу нәтижесі."
            },
            en: {
                title: "Races & Settlement", subtitle: "Humanity's Journey Through the Ages",
                navTitle: "Major Races",
                btnEuro: "Caucasoid", btnMong: "Mongoloid", btnNegro: "Negroid",
                races: {
                    euro: { t: "Caucasoid Race", d: "Characterized by light skin, soft hair, and a narrow nose. Evolved in the temperate and cold climates of Europe and West Asia." },
                    mong: { t: "Mongoloid Race", d: "Characterized by yellowish skin, straight coarse hair, and epicanthic eye folds. Evolved in the open steppes and deserts of Asia." },
                    negro: { t: "Negroid Race", d: "Characterized by dark skin, curly hair, and a broad nose. Dark pigment protects from intense tropical solar radiation." }
                },
                history: "Human ancestors began settling the planet from East Africa approximately 70-100 thousand years ago.",
                migration: "Great Migration: Africa -> Eurasia -> Americas",
                equality: "All races are biologically equal. Physical differences are mere adaptations to diverse environmental conditions."
            }
        };

        let currentLang = 'ru', activeRace = 'euro';

        window.setLang = function(l) { currentLang = l; updateUI(); }
        window.showRace = function(r) { activeRace = r; updateUI(); }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('sub-title').textContent = t.subtitle;
            document.getElementById('nav-title').textContent = t.navTitle;
            document.getElementById('btn-euro').textContent = t.btnEuro;
            document.getElementById('btn-mong').textContent = t.btnMong;
            document.getElementById('btn-negro').textContent = t.btnNegro;

            document.querySelectorAll('.race-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${activeRace}`).classList.add('active');

            const race = t.races[activeRace];
            const view = document.getElementById('display-view');
            view.style.opacity = '0';
            setTimeout(() => {
                document.getElementById('display-title').textContent = race.t;
                document.getElementById('display-text').textContent = race.d;
                view.style.opacity = '1';
            }, 300);

            document.getElementById('fact-text').textContent = t.history;
            document.getElementById('migration-text').textContent = t.migration;
            document.getElementById('equality-text').textContent = t.equality;
        }

        // Читаем язык из URL параметра
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'ru';
        console.log('Плакат: язык из URL =', lang);
        
        window.onload = () => setLang(lang);
    </script>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>









<style data-oi-map-overlay>
.oi-map-btn{
  position:fixed; right:16px; bottom:16px; z-index:9999;
  padding:10px 14px; border-radius:999px; border:1px solid rgba(0,0,0,.15);
  background:#fff; cursor:pointer; font:600 14px/1.1 system-ui,-apple-system,Segoe UI,Roboto,Arial;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}
.oi-table-btn{
  position:fixed; right:120px; bottom:16px; z-index:9999;
  padding:10px 14px; border-radius:999px; border:1px solid rgba(0,0,0,.15);
  background:#fff; cursor:pointer; font:600 14px/1.1 system-ui,-apple-system,Segoe UI,Roboto,Arial;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.oi-map-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:10000;
  display:none; align-items:center; justify-content:center; padding:18px;
}
.oi-map-backdrop[aria-hidden="false"]{ display:flex; }

.oi-map-modal{
  width:min(1200px, 100%); height:min(85vh, 900px);
  background:#111; border-radius:14px; overflow:hidden; position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.oi-map-close{
  position:absolute; top:10px; right:10px; z-index:3;
  width:40px; height:40px; border-radius:999px; border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.35); color:#fff; cursor:pointer; font-size:22px;
}

.oi-map-viewport{
  width:100%; height:100%; overflow:auto; -webkit-overflow-scrolling:touch;
  touch-action: pan-x pan-y;
  background:#000;
  padding-top:62px; /* место под тулбар */
}

.oi-map-img{
  display:block;
  transform-origin: 0 0;
  user-select:none; -webkit-user-drag:none;
}

.oi-map-toolbar{
  position:absolute; left:12px; top:12px; right:12px; z-index:2;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  pointer-events:none;
}

.oi-map-tabs{ display:flex; gap:8px; flex-wrap:wrap; pointer-events:auto; }

.oi-map-tab{
  min-width:36px; height:34px; padding:0 10px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(0,0,0,.35); color:#fff;
  cursor:pointer; font:600 14px system-ui,-apple-system,Segoe UI,Roboto,Arial;
}

.oi-map-tab.is-active{
  background:rgba(255,255,255,.12);
  border-color: rgba(255,255,255,.45);
}

.oi-map-hint{
  pointer-events:none;
  color:#fff; opacity:.85; font:12px/1.2 system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.18);
  padding:8px 10px; border-radius:10px;
}
</style>

<button class="oi-map-btn" type="button" data-oi-map-btn>🗺️ Карта</button>


<div class="oi-map-backdrop" aria-hidden="true" data-oi-map-backdrop>
  <div class="oi-map-modal" role="dialog" aria-modal="true" aria-label="Карта">

      <div class="oi-map-tabs">
        <button type="button" class="oi-map-tab is-active" data-oi-map-tab="1">1</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="2">2</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="3">3</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="4">4</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="5">5</button>

<button type="button" class="oi-map-tab" data-oi-map-tab="7">7</button>

    </div>
  </div>

<script data-oi-map-overlay>
(function(){
  // ====== MAPS ======
  const mapBtn = document.querySelector('[data-oi-map-btn]');
  const mapBackdrop = document.querySelector('[data-oi-map-backdrop]');
  const mapCloseBtn = document.querySelector('[data-oi-map-close]');
  const mapViewport = document.querySelector('[data-oi-map-viewport]');
  const mapTabs = Array.from(document.querySelectorAll('[data-oi-map-tab]'));
  const mapImgs = Array.from(document.querySelectorAll('[data-oi-map-img][data-map]'));

  // ====== MENDELEEV ======
  const tableBtn = document.querySelector('[data-oi-table-btn]');
  const tableBackdrop = document.querySelector('[data-oi-table-backdrop]');
  const tableCloseBtn = document.querySelector('[data-oi-table-close]');
  const tableViewport = document.querySelector('[data-oi-table-viewport]');
  const tableTabs = Array.from(document.querySelectorAll('[data-oi-table-tab]'));
  const tableImgs = Array.from(document.querySelectorAll('[data-oi-table-img][data-table]'));

  let scale = 1;

  function applyScale(){
    mapImgs.forEach(img => { img.style.transform = `scale(${scale})`; });
    tableImgs.forEach(img => { img.style.transform = `scale(${scale})`; });
  }

  function openBackdrop(backdrop){
    backdrop.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
  }
  function closeBackdrop(backdrop){
    backdrop.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
  }

  function showMap(n){
    mapImgs.forEach(img => {
      img.style.display = (img.getAttribute('data-map') === String(n)) ? 'block' : 'none';
    });
    mapTabs.forEach(t => t.classList.toggle('is-active', t.getAttribute('data-oi-map-tab') === String(n)));
    if(mapViewport){ mapViewport.scrollTop = 0; mapViewport.scrollLeft = 0; }
  }

  function showTable(n){
    tableImgs.forEach(img => {
      img.style.display = (img.getAttribute('data-table') === String(n)) ? 'block' : 'none';
    });
    tableTabs.forEach(t => t.classList.toggle('is-active', t.getAttribute('data-oi-table-tab') === String(n)));
    if(tableViewport){ tableViewport.scrollTop = 0; tableViewport.scrollLeft = 0; }
  }

  // MAP events
  if(mapBtn && mapBackdrop && mapCloseBtn && mapViewport && mapImgs.length){
    mapBtn.addEventListener('click', () => openBackdrop(mapBackdrop));
    mapCloseBtn.addEventListener('click', () => closeBackdrop(mapBackdrop));
    mapBackdrop.addEventListener('click', (e)=>{ if(e.target === mapBackdrop) closeBackdrop(mapBackdrop); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeBackdrop(mapBackdrop); });
    mapTabs.forEach(t => t.addEventListener('click', () => showMap(t.getAttribute('data-oi-map-tab'))));

    mapViewport.addEventListener('wheel', (e)=>{
      if(mapBackdrop.getAttribute('aria-hidden') !== 'false') return;
      e.preventDefault();
      const delta = -Math.sign(e.deltaY) * 0.1;
      scale = Math.min(4, Math.max(0.6, scale + delta));
      applyScale();
    }, {passive:false});

    showMap(1);
  }

  // TABLE events
  if(tableBtn && tableBackdrop && tableCloseBtn && tableViewport && tableImgs.length){
    tableBtn.addEventListener('click', () => openBackdrop(tableBackdrop));
    tableCloseBtn.addEventListener('click', () => closeBackdrop(tableBackdrop));
    tableBackdrop.addEventListener('click', (e)=>{ if(e.target === tableBackdrop) closeBackdrop(tableBackdrop); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeBackdrop(tableBackdrop); });
    tableTabs.forEach(t => t.addEventListener('click', () => showTable(t.getAttribute('data-oi-table-tab'))));

    tableViewport.addEventListener('wheel', (e)=>{
      if(tableBackdrop.getAttribute('aria-hidden') !== 'false') return;
      e.preventDefault();
      const delta = -Math.sign(e.deltaY) * 0.1;
      scale = Math.min(4, Math.max(0.6, scale + delta));
      applyScale();
    }, {passive:false});

    showTable(1);
  }

  applyScale();
})();
</script>
