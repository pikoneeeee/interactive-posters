<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate-forming Factors Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0c0a09; color: white; min-height: 100vh; }
        .heading-font { font-family: 'Montserrat', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .rounded-custom { border-radius: 2.5rem; }
        .lang-btn.active { background: #f59e0b; color: #451a03; font-weight: 800; }
        .factor-node { transition: all 0.4s; cursor: pointer; }
        .factor-node:hover { transform: scale(1.05); border-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
        .factor-node.active { border-left: 8px solid #f59e0b; background: rgba(245, 158, 11, 0.15); }
    </style>
</head>
<body class="p-4 md:p-8">

<header class="glass rounded-custom p-6 mb-8 flex flex-col md:flex-row justify-between items-center border-b border-yellow-500/20">
        <div>
            <h1 id="main-title" class="heading-font text-3xl md:text-4xl uppercase tracking-tighter text-yellow-500"></h1>
            <p id="sub-title" class="mt-1 text-white/30 font-bold uppercase tracking-widest text-[10px]"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="window.setLang('ru')" id="btn-ru" class="lang-btn px-4 py-2 rounded-xl border border-white/20 text-xs font-bold transition-all">RU</button>
            <button onclick="window.setLang('kz')" id="btn-kz" class="lang-btn px-4 py-2 rounded-xl border border-white/20 text-xs font-bold transition-all">KZ</button>
            <button onclick="window.setLang('en')" id="btn-en" class="lang-btn px-4 py-2 rounded-xl border border-white/20 text-xs font-bold transition-all">EN</button>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">
        <div class="lg:col-span-4 flex flex-col gap-4" id="factor-list">
            <!-- Buttons injected by JS -->
        </div>

        <div class="lg:col-span-8 glass rounded-custom p-10 flex flex-col justify-center border-l-4 border-yellow-600 relative overflow-hidden">
            <div id="content-view" class="relative z-10 transition-all duration-500">
                <div id="display-icon" class="text-7xl mb-8">☀️</div>
                <h3 id="display-title" class="heading-font text-4xl mb-6 text-white"></h3>
                <div id="display-text" class="text-xl font-light leading-relaxed text-white/80 space-y-6"></div>
            </div>
            <!-- Decorative Light -->
            <div class="absolute -bottom-20 -right-20 w-80 h-80 bg-yellow-500/10 blur-[120px] rounded-full"></div>
        </div>
    </main>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="glass rounded-custom p-8"><h4 id="ft1-t" class="heading-font text-yellow-500 mb-2 uppercase"></h4><p id="ft1-d" class="text-xs text-white/50"></p></div>
        <div class="glass rounded-custom p-8"><h4 id="ft2-t" class="heading-font text-yellow-500 mb-2 uppercase"></h4><p id="ft2-d" class="text-xs text-white/50"></p></div>
        <div class="glass rounded-custom p-8"><h4 id="ft3-t" class="heading-font text-yellow-500 mb-2 uppercase"></h4><p id="ft3-d" class="text-xs text-white/50"></p></div>
    </section>

    <script>
        const translations = {
            ru: {
                title: "Климат: Причины", subtitle: "Факторы формирования климата Земли",
                factors: {
                    lat: { icon: "☀️", title: "Географическая широта", text: "Главный фактор. От широты зависит угол падения солнечных лучей и, как следствие, количество тепла. На экваторе лучи падают отвесно ($90^\circ$), у полюсов — под малым углом." },
                    circ: { icon: "🌬️", title: "Циркуляция атмосферы", text: "Постоянное движение воздушных масс переносит тепло и влагу. Пассаты, муссоны и западные ветры — главные 'двигатели' климата." },
                    surface: { icon: "🏔️", title: "Подстилающая поверхность", text: "Рельеф (горы преграждают путь ветрам), высота местности и характер поверхности (лес, снег, песок) влияют на поглощение солнечного тепла." },
                    ocean: { icon: "🌊", title: "Океанические течения", text: "Теплые течения (Гольфстрим) согревают побережья и приносят дожди. Холодные течения (Перуанское) делают берега засушливыми и холодными." }
                },
                facts: [
                    { t: "Радиация", d: "Прямая и рассеянная энергия солнца." },
                    { t: "Альбедо", d: "Отражательная способность поверхности." },
                    { t: "Амплитуда", d: "Разница между экстремумами температур." }
                ]
            },
            kz: {
                title: "Климат: Себептері", subtitle: "Жер климатының қалыптасу факторлары",
                factors: {
                    lat: { icon: "☀️", title: "Географиялық ендік", text: "Басты фактор. Ендікке күн сәулесінің түсу бұрышы мен жылу мөлшері байланысты." },
                    circ: { icon: "🌬️", title: "Атмосфера циркуляциясы", text: "Ауа массаларының тұрақты қозғалысы жылу мен ылғалды тасымалдайды." },
                    surface: { icon: "🏔️", title: "Жер бетінің сипаты", text: "Рельеф, биіктік және беткі қабаттың түрі (орман, қар, құм) жылудың сіңірілуіне әсер етеді." },
                    ocean: { icon: "🌊", title: "Мұхит ағыстары", text: "Жылы ағыстар жағалауды жылытып, жаңбыр әкеледі. Суық ағыстар құрғақшылық тудырады." }
                },
                facts: [
                    { t: "Радиация", d: "Күннің тікелей және шашыранды энергиясы." },
                    { t: "Альбедо", d: "Беткі қабаттың шағылыстыру қабілеті." },
                    { t: "Амплитуда", d: "Температура ауытқуының айырмашылығы." }
                ]
            },
            en: {
                title: "Climate: Causes", subtitle: "Factors Determining Earth's Climate",
                factors: {
                    lat: { icon: "☀️", title: "Latitude", text: "Primary factor. Latitude determines the sun rays' angle of incidence and solar heat amount. Vertical at the equator ($90^\circ$), oblique near the poles." },
                    circ: { icon: "🌬️", title: "Air Circulation", text: "Continuous movement of air masses transfers heat and moisture. Trade winds and monsoons are the main climate drivers." },
                    surface: { icon: "🏔️", title: "Underlying Surface", text: "Relief (mountains block winds), altitude, and surface type (forest, snow, sand) affect solar heat absorption." },
                    ocean: { icon: "🌊", title: "Ocean Currents", text: "Warm currents (Gulf Stream) heat the coasts and bring rain. Cold currents (Peruvian) create arid and cold coastal regions." }
                },
                facts: [
                    { t: "Radiation", d: "Direct and scattered solar energy." },
                    { t: "Albedo", d: "Surface reflectivity coefficient." },
                    { t: "Amplitude", d: "Difference between temperature extremes." }
                ]
            }
        };

        let currentLang = 'ru', activeF = 'lat';

        window.setLang = function(l) { currentLang = l; updateUI(); }
        window.selectF = function(f) { activeF = f; updateUI(); }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('sub-title').textContent = t.subtitle;
            
            const list = document.getElementById('factor-list');
            list.innerHTML = '';
            Object.keys(t.factors).forEach(key => {
                const f = t.factors[key];
                const div = document.createElement('div');
                div.className = `factor-node glass p-6 rounded-3xl flex items-center gap-4 ${activeF === key ? 'active' : ''}`;
                div.onclick = () => selectF(key);
                div.innerHTML = `<span class="text-3xl">${f.icon}</span><span class="font-bold uppercase text-[10px] tracking-widest">${f.title}</span>`;
                list.appendChild(div);
            });

            const active = t.factors[activeF];
            document.getElementById('display-icon').textContent = active.icon;
            document.getElementById('display-title').textContent = active.title;
            document.getElementById('display-text').textContent = active.text;

            document.getElementById('ft1-t').textContent = t.facts[0].t; document.getElementById('ft1-d').textContent = t.facts[0].d;
            document.getElementById('ft2-t').textContent = t.facts[1].t; document.getElementById('ft2-d').textContent = t.facts[1].d;
            document.getElementById('ft3-t').textContent = t.facts[2].t; document.getElementById('ft3-d').textContent = t.facts[2].d;
        }

        // Читаем язык из URL параметра
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'ru';
        console.log('Плакат: язык из URL =', lang);
        
        window.onload = () => setLang(lang);
    </script>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>









<style data-oi-map-overlay>
.oi-map-btn{
  position:fixed; right:16px; bottom:16px; z-index:9999;
  padding:10px 14px; border-radius:999px; border:1px solid rgba(0,0,0,.15);
  background:#fff; cursor:pointer; font:600 14px/1.1 system-ui,-apple-system,Segoe UI,Roboto,Arial;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}
.oi-table-btn{
  position:fixed; right:120px; bottom:16px; z-index:9999;
  padding:10px 14px; border-radius:999px; border:1px solid rgba(0,0,0,.15);
  background:#fff; cursor:pointer; font:600 14px/1.1 system-ui,-apple-system,Segoe UI,Roboto,Arial;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.oi-map-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:10000;
  display:none; align-items:center; justify-content:center; padding:18px;
}
.oi-map-backdrop[aria-hidden="false"]{ display:flex; }

.oi-map-modal{
  width:min(1200px, 100%); height:min(85vh, 900px);
  background:#111; border-radius:14px; overflow:hidden; position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.oi-map-close{
  position:absolute; top:10px; right:10px; z-index:3;
  width:40px; height:40px; border-radius:999px; border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.35); color:#fff; cursor:pointer; font-size:22px;
}

.oi-map-viewport{
  width:100%; height:100%; overflow:auto; -webkit-overflow-scrolling:touch;
  touch-action: pan-x pan-y;
  background:#000;
  padding-top:62px; /* место под тулбар */
}

.oi-map-img{
  display:block;
  transform-origin: 0 0;
  user-select:none; -webkit-user-drag:none;
}

.oi-map-toolbar{
  position:absolute; left:12px; top:12px; right:12px; z-index:2;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  pointer-events:none;
}

.oi-map-tabs{ display:flex; gap:8px; flex-wrap:wrap; pointer-events:auto; }

.oi-map-tab{
  min-width:36px; height:34px; padding:0 10px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(0,0,0,.35); color:#fff;
  cursor:pointer; font:600 14px system-ui,-apple-system,Segoe UI,Roboto,Arial;
}

.oi-map-tab.is-active{
  background:rgba(255,255,255,.12);
  border-color: rgba(255,255,255,.45);
}

.oi-map-hint{
  pointer-events:none;
  color:#fff; opacity:.85; font:12px/1.2 system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.18);
  padding:8px 10px; border-radius:10px;
}
</style>

<button class="oi-map-btn" type="button" data-oi-map-btn>🗺️ Карта</button>


<div class="oi-map-backdrop" aria-hidden="true" data-oi-map-backdrop>
  <div class="oi-map-modal" role="dialog" aria-modal="true" aria-label="Карта">
    <button class="oi-map-close" type="button" aria-label="Закрыть" data-oi-map-close>×</button>

    <div class="oi-map-toolbar">
      <div class="oi-map-tabs">
        <button type="button" class="oi-map-tab is-active" data-oi-map-tab="1">1</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="2">2</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="3">3</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="4">4</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="5">5</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="6">6</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="7">7</button>
      </div>
      <div class="oi-map-hint">Колёсико/трекпад — зум • Esc — закрыть</div>
    </div>

    <div class="oi-map-viewport" data-oi-map-viewport>
      <img class="oi-map-img" data-oi-map-img data-map="1" src="../../assets/maps/karta_1.png" alt="map 1" style="display:block;">
<img class="oi-map-img" data-oi-map-img data-map="2" src="../../assets/maps/karta_2.png" alt="map 2" style="display:none;">
<img class="oi-map-img" data-oi-map-img data-map="3" src="../../assets/maps/karta_3.png" alt="map 3" style="display:none;">
<img class="oi-map-img" data-oi-map-img data-map="4" src="../../assets/maps/karta_4.png" alt="map 4" style="display:none;">
<img class="oi-map-img" data-oi-map-img data-map="5" src="../../assets/maps/karta_5.png" alt="map 5" style="display:none;">
<img class="oi-map-img" data-oi-map-img data-map="6" src="../../assets/maps/karta_6.png" alt="map 6" style="display:none;">
<img class="oi-map-img" data-oi-map-img data-map="7" src="../../assets/maps/karta_7.png" alt="map 7" style="display:none;">
    </div>
  </div>
</div>




<script data-oi-map-overlay>
(function(){
  // ====== MAPS ======
  const mapBtn = document.querySelector('[data-oi-map-btn]');
  const mapBackdrop = document.querySelector('[data-oi-map-backdrop]');
  const mapCloseBtn = document.querySelector('[data-oi-map-close]');
  const mapViewport = document.querySelector('[data-oi-map-viewport]');
  const mapTabs = Array.from(document.querySelectorAll('[data-oi-map-tab]'));
  const mapImgs = Array.from(document.querySelectorAll('[data-oi-map-img][data-map]'));

  // ====== MENDELEEV ======
  const tableBtn = document.querySelector('[data-oi-table-btn]');
  const tableBackdrop = document.querySelector('[data-oi-table-backdrop]');
  const tableCloseBtn = document.querySelector('[data-oi-table-close]');
  const tableViewport = document.querySelector('[data-oi-table-viewport]');
  const tableTabs = Array.from(document.querySelectorAll('[data-oi-table-tab]'));
  const tableImgs = Array.from(document.querySelectorAll('[data-oi-table-img][data-table]'));

  let scale = 1;

  function applyScale(){
    mapImgs.forEach(img => { img.style.transform = `scale(${scale})`; });
    tableImgs.forEach(img => { img.style.transform = `scale(${scale})`; });
  }

  function openBackdrop(backdrop){
    backdrop.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
  }
  function closeBackdrop(backdrop){
    backdrop.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
  }

  function showMap(n){
    mapImgs.forEach(img => {
      img.style.display = (img.getAttribute('data-map') === String(n)) ? 'block' : 'none';
    });
    mapTabs.forEach(t => t.classList.toggle('is-active', t.getAttribute('data-oi-map-tab') === String(n)));
    if(mapViewport){ mapViewport.scrollTop = 0; mapViewport.scrollLeft = 0; }
  }

  function showTable(n){
    tableImgs.forEach(img => {
      img.style.display = (img.getAttribute('data-table') === String(n)) ? 'block' : 'none';
    });
    tableTabs.forEach(t => t.classList.toggle('is-active', t.getAttribute('data-oi-table-tab') === String(n)));
    if(tableViewport){ tableViewport.scrollTop = 0; tableViewport.scrollLeft = 0; }
  }

  // MAP events
  if(mapBtn && mapBackdrop && mapCloseBtn && mapViewport && mapImgs.length){
    mapBtn.addEventListener('click', () => openBackdrop(mapBackdrop));
    mapCloseBtn.addEventListener('click', () => closeBackdrop(mapBackdrop));
    mapBackdrop.addEventListener('click', (e)=>{ if(e.target === mapBackdrop) closeBackdrop(mapBackdrop); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeBackdrop(mapBackdrop); });
    mapTabs.forEach(t => t.addEventListener('click', () => showMap(t.getAttribute('data-oi-map-tab'))));

    mapViewport.addEventListener('wheel', (e)=>{
      if(mapBackdrop.getAttribute('aria-hidden') !== 'false') return;
      e.preventDefault();
      const delta = -Math.sign(e.deltaY) * 0.1;
      scale = Math.min(4, Math.max(0.6, scale + delta));
      applyScale();
    }, {passive:false});

    showMap(1);
  }

  // TABLE events
  if(tableBtn && tableBackdrop && tableCloseBtn && tableViewport && tableImgs.length){
    tableBtn.addEventListener('click', () => openBackdrop(tableBackdrop));
    tableCloseBtn.addEventListener('click', () => closeBackdrop(tableBackdrop));
    tableBackdrop.addEventListener('click', (e)=>{ if(e.target === tableBackdrop) closeBackdrop(tableBackdrop); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeBackdrop(tableBackdrop); });
    tableTabs.forEach(t => t.addEventListener('click', () => showTable(t.getAttribute('data-oi-table-tab'))));

    tableViewport.addEventListener('wheel', (e)=>{
      if(tableBackdrop.getAttribute('aria-hidden') !== 'false') return;
      e.preventDefault();
      const delta = -Math.sign(e.deltaY) * 0.1;
      scale = Math.min(4, Math.max(0.6, scale + delta));
      applyScale();
    }, {passive:false});

    showTable(1);
  }

  applyScale();
})();
</script>
</body>
</html>
