<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morocco: Kingdom of Light</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, #7c2d12, #c2410c);
            color: #fff;
            min-height: 100vh;
        }
        .header-font { font-family: 'Playfair Display', serif; }
        .moroccan-pattern {
            background-image: radial-gradient(#fff 10%, transparent 11%), radial-gradient(#fff 10%, transparent 11%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            opacity: 0.05;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
        }
        .lang-link { cursor: pointer; border-bottom: 2px solid transparent; }
        .lang-link.active { border-color: #fff; font-weight: bold; }
    </style>
</head>
<body class="p-6 md:p-12 relative overflow-hidden">

<div class="absolute inset-0 moroccan-pattern pointer-events-none"></div>

    <div class="relative z-10 grid grid-cols-1 lg:grid-cols-2 gap-12 h-full">
        <!-- Content Side -->
        <div class="flex flex-col justify-center gap-8">
            <div class="flex items-center gap-4 text-sm font-bold tracking-widest">
                <span onclick="window.setLang('ru')" id="l-ru" class="lang-link active">RU</span>
                <span onclick="window.setLang('kz')" id="l-kz" class="lang-link">KZ</span>
                <span onclick="window.setLang('en')" id="l-en" class="lang-link">EN</span>
            </div>

            <h1 id="main-header" class="header-font text-6xl md:text-8xl leading-tight text-orange-100"></h1>
            
            <div class="glass-card p-8">
                <h3 id="sub-header" class="text-xl font-bold mb-4 text-orange-200"></h3>
                <p id="desc-text" class="text-lg leading-relaxed opacity-90"></p>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div class="text-center">
                    <div class="text-3xl mb-2">🏔️</div>
                    <div class="text-xs uppercase tracking-widest opacity-60">High Atlas</div>
                </div>
                <div class="text-center">
                    <div class="text-3xl mb-2">🕌</div>
                    <div class="text-xs uppercase tracking-widest opacity-60">Culture</div>
                </div>
                <div class="text-center">
                    <div class="text-3xl mb-2">🧪</div>
                    <div class="text-xs uppercase tracking-widest opacity-60">Phosphates</div>
                </div>
            </div>
        </div>

        <!-- Visual Side -->
        <div class="glass-card p-4 relative min-h-[500px]">
            <canvas id="moroccoCanvas" class="w-full h-full rounded-xl"></canvas>
            <div class="absolute bottom-8 right-8 text-right">
                <div class="text-6xl font-bold header-font">75%</div>
                <div class="text-sm uppercase tracking-widest">of world's Phosphates</div>
            </div>
        </div>
    </div>

    <script>
        const texts = {
            ru: {
                h: "Марокко",
                sub: "Врата Африки",
                desc: "Уникальное королевство на стыке Европы и Африки, омываемое водами Атлантики и Средиземного моря. Страна Атласских гор, древних медин и бескрайней Сахары. Марокко — мировой лидер по запасам фосфоритов, «хлеба» для мировой агрохимии."
            },
            kz: {
                h: "Марокко",
                sub: "Африка қақпасы",
                desc: "Еуропа мен Африканың түйіскен жеріндегі, Атлант мұхиты мен Жерорта теңізі шайып жатқан бірегей патшалық. Атлас таулары, ежелгі мединдер және шексіз Сахара елі. Марокко — әлемдік агрохимияның «наны» саналатын фосфорит қоры бойынша әлемдік көшбасшы."
            },
            en: {
                h: "Morocco",
                sub: "Gateway to Africa",
                desc: "A unique kingdom at the crossroads of Europe and Africa, washed by the Atlantic and Mediterranean. Land of the Atlas Mountains, ancient medinas, and the Sahara. Morocco holds 75% of the world's phosphate reserves."
            }
        };

        let cl = 'ru';
        let cvs, cx;

        window.setLang = function(l) {
            cl = l;
            document.querySelectorAll('.lang-link').forEach(el => el.classList.remove('active'));
            document.getElementById(`l-${l}`).classList.add('active');
            
            document.getElementById('main-header').textContent = texts[cl].h;
            document.getElementById('sub-header').textContent = texts[cl].sub;
            document.getElementById('desc-text').textContent = texts[cl].desc;
        }

        function draw() {
            const w = cvs.width, h = cvs.height;
            const t = Date.now() * 0.001;
            cx.clearRect(0, 0, w, h);

            // Sky
            const sky = cx.createLinearGradient(0, 0, 0, h);
            sky.addColorStop(0, '#0c4a6e'); sky.addColorStop(0.5, '#0ea5e9'); sky.addColorStop(1, '#f97316'); // Sunset
            cx.fillStyle = sky; cx.fillRect(0, 0, w, h);

            // Sun
            cx.fillStyle = '#fde047';
            cx.beginPath(); cx.arc(w*0.7, h*0.3, 40, 0, Math.PI*2); cx.fill();

            // Atlas Mountains Silhouette
            cx.fillStyle = '#451a03';
            cx.beginPath();
            cx.moveTo(0, h);
            for(let i=0; i<=w; i+=10) {
                const y = h*0.6 - Math.abs(Math.sin(i*0.01))*100 - Math.sin(i*0.03 + 1)*50;
                cx.lineTo(i, y);
            }
            cx.lineTo(w, h);
            cx.fill();

            // Star (Flag symbol)
            cx.strokeStyle = '#15803d'; // Green pentagram
            cx.lineWidth = 3;
            const starX = w*0.2, starY = h*0.2;
            const r = 30;
            cx.beginPath();
            for(let i=0; i<5; i++) {
                const ang = -Math.PI/2 + i * (Math.PI*2*2/5);
                const x = starX + Math.cos(ang)*r;
                const y = starY + Math.sin(ang)*r;
                if(i==0) cx.moveTo(x,y); else cx.lineTo(x,y);
            }
            cx.closePath(); cx.stroke();

            requestAnimationFrame(draw);
        }

        window.onload = () => {
            cvs = document.getElementById('moroccoCanvas');
            cx = cvs.getContext('2d');
            const resize = () => {
                cvs.width = cvs.parentElement.clientWidth;
                cvs.height = cvs.parentElement.clientHeight;
            };
            window.addEventListener('resize', resize);
            resize();
            window.setLang('ru');
            draw();
        };
    </script>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>









<style data-oi-map-overlay>
.oi-map-btn{
  position:fixed; right:16px; bottom:16px; z-index:9999;

  box-shadow:0 8px 20px rgba(0,0,0,.12);
}
.oi-table-btn{
  position:fixed; right:120px; bottom:16px; z-index:9999;

  background:#fff; cursor:pointer; font:600 14px/1.1 system-ui,-apple-system,Segoe UI,Roboto,Arial;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.oi-map-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:10000;
  display:none; align-items:center; justify-content:center; padding:18px;
}
.oi-map-backdrop[aria-hidden="false"]{ display:flex; }

.oi-map-modal{
  width:min(1200px, 100%); height:min(85vh, 900px);
  background:#111; border-radius:14px; overflow:hidden; position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.oi-map-close{
  position:absolute; top:10px; right:10px; z-index:3;
  width:40px; height:40px; border-radius:999px; border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.35); color:#fff; cursor:pointer; font-size:22px;
}

.oi-map-viewport{
  width:100%; height:100%; overflow:auto; -webkit-overflow-scrolling:touch;
  touch-action: pan-x pan-y;
  background:#000;
  padding-top:62px; /* место под тулбар */
}

.oi-map-img{
  display:block;
  transform-origin: 0 0;
  user-select:none; -webkit-user-drag:none;
}

.oi-map-toolbar{
  position:absolute; left:12px; top:12px; right:12px; z-index:2;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  pointer-events:none;
}

.oi-map-tabs{ display:flex; gap:8px; flex-wrap:wrap; pointer-events:auto; }

.oi-map-tab{
  min-width:36px; height:34px; padding:0 10px;

  background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.18);
  padding:8px 10px; border-radius:10px;
}
</style>

<img class="oi-map-img" data-oi-map-img data-map="5" src="../../assets/maps/karta_5.png" alt="map 5" style="display:none;">
<img class="oi-map-img" data-oi-map-img data-map="6" src="../../assets/maps/karta_6.png" alt="map 6" style="display:none;">

<script data-oi-map-overlay>
(function(){
  // ====== MAPS ======
  const mapBtn = document.querySelector('[data-oi-map-btn]');
  const mapBackdrop = document.querySelector('[data-oi-map-backdrop]');
  const mapCloseBtn = document.querySelector('[data-oi-map-close]');
  const mapViewport = document.querySelector('[data-oi-map-viewport]');
  const mapTabs = Array.from(document.querySelectorAll('[data-oi-map-tab]'));
  const mapImgs = Array.from(document.querySelectorAll('[data-oi-map-img][data-map]'));

  // ====== MENDELEEV ======
  const tableBtn = document.querySelector('[data-oi-table-btn]');
  const tableBackdrop = document.querySelector('[data-oi-table-backdrop]');
  const tableCloseBtn = document.querySelector('[data-oi-table-close]');
  const tableViewport = document.querySelector('[data-oi-table-viewport]');
  const tableTabs = Array.from(document.querySelectorAll('[data-oi-table-tab]'));
  const tableImgs = Array.from(document.querySelectorAll('[data-oi-table-img][data-table]'));

  let scale = 1;

  function applyScale(){
    mapImgs.forEach(img => { img.style.transform = `scale(${scale})`; });
    tableImgs.forEach(img => { img.style.transform = `scale(${scale})`; });
  }

  function openBackdrop(backdrop){
    backdrop.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
  }
  function closeBackdrop(backdrop){
    backdrop.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
  }

  function showMap(n){
    mapImgs.forEach(img => {
      img.style.display = (img.getAttribute('data-map') === String(n)) ? 'block' : 'none';
    });
    mapTabs.forEach(t => t.classList.toggle('is-active', t.getAttribute('data-oi-map-tab') === String(n)));
    if(mapViewport){ mapViewport.scrollTop = 0; mapViewport.scrollLeft = 0; }
  }

  function showTable(n){
    tableImgs.forEach(img => {
      img.style.display = (img.getAttribute('data-table') === String(n)) ? 'block' : 'none';
    });
    tableTabs.forEach(t => t.classList.toggle('is-active', t.getAttribute('data-oi-table-tab') === String(n)));
    if(tableViewport){ tableViewport.scrollTop = 0; tableViewport.scrollLeft = 0; }
  }

  // MAP events
  if(mapBtn && mapBackdrop && mapCloseBtn && mapViewport && mapImgs.length){
    mapBtn.addEventListener('click', () => openBackdrop(mapBackdrop));
    mapCloseBtn.addEventListener('click', () => closeBackdrop(mapBackdrop));
    mapBackdrop.addEventListener('click', (e)=>{ if(e.target === mapBackdrop) closeBackdrop(mapBackdrop); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeBackdrop(mapBackdrop); });
    mapTabs.forEach(t => t.addEventListener('click', () => showMap(t.getAttribute('data-oi-map-tab'))));

    mapViewport.addEventListener('wheel', (e)=>{
      if(mapBackdrop.getAttribute('aria-hidden') !== 'false') return;
      e.preventDefault();
      const delta = -Math.sign(e.deltaY) * 0.1;
      scale = Math.min(4, Math.max(0.6, scale + delta));
      applyScale();
    }, {passive:false});

    showMap(1);
  }

  // TABLE events
  if(tableBtn && tableBackdrop && tableCloseBtn && tableViewport && tableImgs.length){
    tableBtn.addEventListener('click', () => openBackdrop(tableBackdrop));
    tableCloseBtn.addEventListener('click', () => closeBackdrop(tableBackdrop));
    tableBackdrop.addEventListener('click', (e)=>{ if(e.target === tableBackdrop) closeBackdrop(tableBackdrop); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeBackdrop(tableBackdrop); });
    tableTabs.forEach(t => t.addEventListener('click', () => showTable(t.getAttribute('data-oi-table-tab'))));

    tableViewport.addEventListener('wheel', (e)=>{
      if(tableBackdrop.getAttribute('aria-hidden') !== 'false') return;
      e.preventDefault();
      const delta = -Math.sign(e.deltaY) * 0.1;
      scale = Math.min(4, Math.max(0.6, scale + delta));
      applyScale();
    }, {passive:false});

    showTable(1);
  }

  applyScale();
})();
</script>
