<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribution of Organisms</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #052e16; color: white; min-height: 100vh; }
        .heading-font { font-family: 'Montserrat', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .rounded-custom { border-radius: 2.5rem; }
        canvas { border-radius: 2rem; cursor: pointer; }
        .lang-btn.active { background: #22c55e; color: #052e16; font-weight: 800; }
    </style>
</head>
<body class="p-4 md:p-8">

<header class="glass rounded-custom p-8 mb-8 flex flex-col md:flex-row justify-between items-center border-b border-green-500/30">
        <div>
            <h1 id="main-title" class="heading-font text-3xl md:text-5xl uppercase tracking-tighter text-green-400"></h1>
            <p id="sub-title" class="mt-1 text-white/30 font-bold uppercase tracking-widest text-[10px]"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="window.setLang('ru')" id="btn-ru" class="lang-btn px-6 py-2 rounded-xl border border-white/20 text-xs font-bold transition-all">RU</button>
            <button onclick="window.setLang('kz')" id="btn-kz" class="lang-btn px-6 py-2 rounded-xl border border-white/20 text-xs font-bold transition-all">KZ</button>
            <button onclick="window.setLang('en')" id="btn-en" class="lang-btn px-6 py-2 rounded-xl border border-white/20 text-xs font-bold transition-all">EN</button>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
        <div class="lg:col-span-2 glass rounded-custom p-8 relative overflow-hidden min-h-[500px]">
            <h2 id="canvas-heading" class="heading-font text-xl text-green-200 uppercase mb-8 self-start"></h2>
            <canvas id="distCanvas" class="w-full h-full bg-black/40"></canvas>
            <div class="absolute top-1/2 left-8 -translate-y-1/2 flex flex-col gap-4">
                 <button onclick="setZone('equator')" class="px-4 py-1 glass rounded-full text-[10px] font-black hover:bg-green-500/20">EQUATOR</button>
                 <button onclick="setZone('temperate')" class="px-4 py-1 glass rounded-full text-[10px] font-black hover:bg-green-500/20">TEMPERATE</button>
                 <button onclick="setZone('polar')" class="px-4 py-1 glass rounded-full text-[10px] font-black hover:bg-green-500/20">POLAR</button>
            </div>
        </div>

        <div class="glass rounded-custom p-10 flex flex-col justify-center border-l-4 border-green-500">
            <h3 id="info-title" class="heading-font text-3xl mb-6 text-green-300"></h3>
            <div id="info-text" class="text-lg font-light leading-relaxed text-white/80 space-y-4"></div>
        </div>
    </main>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="glass rounded-custom p-8"><h4 id="card1-t" class="heading-font text-green-400 mb-2"></h4><p id="card1-d" class="text-xs text-white/50"></p></div>
        <div class="glass rounded-custom p-8"><h4 id="card2-t" class="heading-font text-green-400 mb-2"></h4><p id="card2-d" class="text-xs text-white/50"></p></div>
        <div class="glass rounded-custom p-8"><h4 id="card3-t" class="heading-font text-green-400 mb-2"></h4><p id="card3-d" class="text-xs text-white/50"></p></div>
    </section>

    <script>
        const translations = {
            ru: {
                title: "Карта Жизни", subtitle: "Распространение организмов на Земле",
                canvasHeading: "Биоразнообразие зон",
                zones: {
                    equator: { t: "Экваториальные леса", d: "Максимальное разнообразие. Постоянное тепло и влага создают идеальные условия. 50% всех видов Земли обитают здесь." },
                    temperate: { t: "Умеренный пояс", d: "Сезонность. Леса и степи. Организмы адаптированы к смене времен года и перепадам температур." },
                    polar: { t: "Полярные пустыни", d: "Экстремальный холод. Низкое биоразнообразие. Жизнь сосредоточена в основном в океане или прибрежных зонах." }
                },
                cards: [
                    { t: "Широтная зональность", d: "Изменение состава видов от экватора к полюсам вслед за климатом." },
                    { t: "Высотная поясность", d: "В горах жизнь меняется с высотой так же, как при движении на север." },
                    { t: "Адаптация", d: "Способность организмов приспосабливаться к условиям среды (спячка, окраска, форма листа)." }
                ]
            },
            kz: {
                title: "Тіршілік Картасы", subtitle: "Организмдердің Жер бетінде таралуы",
                canvasHeading: "Аймақтардың биоалуантүрлілігі",
                zones: {
                    equator: { t: "Экваторлық ормандар", d: "Максималды алуантүрлілік. Тұрақты жылу мен ылғал мінсіз жағдай жасайды. Жердегі барлық түрлердің 50%-ы осында." },
                    temperate: { t: "Қоңыржай белдеу", d: "Маусымдылық. Ормандар мен далалар. Организмдер жыл мезгілдерінің ауысуына бейімделген." },
                    polar: { t: "Полярлық шөлдер", d: "Экстремалды суық. Тіршілік негізінен мұхитта немесе жағалау аймақтарында шоғырланған." }
                },
                cards: [
                    { t: "Ендік зоналық", d: "Климатқа байланысты экватордан полюстерге қарай түрлер құрамының өзгеруі." },
                    { t: "Биіктік белдеулік", d: "Тауларда тіршілік биіктікке қарай, солтүстікке жылжығандағыдай өзгереді." },
                    { t: "Бейімделу", d: "Организмдердің орта жағдайларына бейімделу қабілеті." }
                ]
            },
            en: {
                title: "Map of Life", subtitle: "Distribution of Organisms on Earth",
                canvasHeading: "Zonal Biodiversity",
                zones: {
                    equator: { t: "Equatorial Forests", d: "Maximum diversity. Constant heat and moisture create ideal conditions. 50% of all Earth's species live here." },
                    temperate: { t: "Temperate Belt", d: "Seasonality. Forests and steppes. Organisms are adapted to changing seasons and temperature swings." },
                    polar: { t: "Polar Deserts", d: "Extreme cold. Low biodiversity. Life is concentrated mainly in the ocean or coastal zones." }
                },
                cards: [
                    { t: "Latitudinal Zonation", d: "Changes in species composition from equator to poles following climate patterns." },
                    { t: "Altitudinal Zonation", d: "In mountains, life changes with height similarly to moving north." },
                    { t: "Adaptation", d: "The ability of organisms to adjust to environmental conditions (hibernation, color, leaf shape)." }
                ]
            }
        };

        let currentLang = 'ru', activeZone = 'equator', canvas, ctx;

        window.setLang = function(l) { currentLang = l; updateUI(); }
        window.setZone = function(z) { activeZone = z; updateUI(); }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('sub-title').textContent = t.subtitle;
            document.getElementById('canvas-heading').textContent = t.canvasHeading;
            const z = t.zones[activeZone];
            document.getElementById('info-title').textContent = z.t;
            document.getElementById('info-text').textContent = z.d;
            document.getElementById('card1-t').textContent = t.cards[0].t; document.getElementById('card1-d').textContent = t.cards[0].d;
            document.getElementById('card2-t').textContent = t.cards[1].t; document.getElementById('card2-d').textContent = t.cards[1].d;
            document.getElementById('card3-t').textContent = t.cards[2].t; document.getElementById('card3-d').textContent = t.cards[2].d;
        }

        function draw() {
            if(!ctx) return;
            ctx.clearRect(0,0,canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;
            const time = Date.now() * 0.001;

            if (activeZone === 'equator') {
                ctx.fillStyle = '#065f46'; ctx.fillRect(0,0,w,h);
                // Abstract dense leaves
                for(let i=0; i<30; i++) {
                    ctx.fillStyle = `rgba(16, 185, 129, ${0.4 + Math.sin(time+i)*0.2})`;
                    ctx.beginPath(); ctx.arc((i*50)%w, (i*30)%h, 40, 0, Math.PI*2); ctx.fill();
                }
            } else if (activeZone === 'temperate') {
                ctx.fillStyle = '#166534'; ctx.fillRect(0,0,w,h);
                // Sparse trees
                for(let i=0; i<10; i++) {
                    ctx.fillStyle = '#3f6212';
                    ctx.fillRect(w*0.1 + i*100, h*0.5, 20, h*0.5);
                }
            } else {
                ctx.fillStyle = '#e2e8f0'; ctx.fillRect(0,0,w,h);
                // Snowflakes
                ctx.fillStyle = 'white';
                for(let i=0; i<50; i++) {
                   ctx.beginPath(); ctx.arc((i*100)%w, (time*100 + i*50)%h, 2, 0, Math.PI*2); ctx.fill();
                }
            }
            requestAnimationFrame(draw);
        }

        window.onload = function() {
            canvas = document.getElementById('distCanvas'); ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight;
            setLang('ru'); draw();
        };
    </script>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>









<style data-oi-map-overlay>
.oi-map-btn{
  position:fixed; right:16px; bottom:16px; z-index:9999;
  padding:10px 14px; border-radius:999px; border:1px solid rgba(0,0,0,.15);
  background:#fff; cursor:pointer; font:600 14px/1.1 system-ui,-apple-system,Segoe UI,Roboto,Arial;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}
.oi-table-btn{
  position:fixed; right:120px; bottom:16px; z-index:9999;
  padding:10px 14px; border-radius:999px; border:1px solid rgba(0,0,0,.15);
  background:#fff; cursor:pointer; font:600 14px/1.1 system-ui,-apple-system,Segoe UI,Roboto,Arial;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.oi-map-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:10000;
  display:none; align-items:center; justify-content:center; padding:18px;
}
.oi-map-backdrop[aria-hidden="false"]{ display:flex; }

.oi-map-modal{
  width:min(1200px, 100%); height:min(85vh, 900px);
  background:#111; border-radius:14px; overflow:hidden; position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.oi-map-close{
  position:absolute; top:10px; right:10px; z-index:3;
  width:40px; height:40px; border-radius:999px; border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.35); color:#fff; cursor:pointer; font-size:22px;
}

.oi-map-viewport{
  width:100%; height:100%; overflow:auto; -webkit-overflow-scrolling:touch;
  touch-action: pan-x pan-y;
  background:#000;
  padding-top:62px; /* место под тулбар */
}

.oi-map-img{
  display:block;
  transform-origin: 0 0;
  user-select:none; -webkit-user-drag:none;
}

.oi-map-toolbar{
  position:absolute; left:12px; top:12px; right:12px; z-index:2;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  pointer-events:none;
}

.oi-map-tabs{ display:flex; gap:8px; flex-wrap:wrap; pointer-events:auto; }

.oi-map-tab{
  min-width:36px; height:34px; padding:0 10px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(0,0,0,.35); color:#fff;
  cursor:pointer; font:600 14px system-ui,-apple-system,Segoe UI,Roboto,Arial;
}

.oi-map-tab.is-active{
  background:rgba(255,255,255,.12);
  border-color: rgba(255,255,255,.45);
}

.oi-map-hint{
  pointer-events:none;
  color:#fff; opacity:.85; font:12px/1.2 system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.18);
  padding:8px 10px; border-radius:10px;
}
</style>

<button class="oi-map-btn" type="button" data-oi-map-btn>🗺️ Карта</button>


<div class="oi-map-backdrop" aria-hidden="true" data-oi-map-backdrop>
  <div class="oi-map-modal" role="dialog" aria-modal="true" aria-label="Карта">
    <button class="oi-map-close" type="button" aria-label="Закрыть" data-oi-map-close>×</button>

    <div class="oi-map-toolbar">
      <div class="oi-map-tabs">
        <button type="button" class="oi-map-tab is-active" data-oi-map-tab="1">1</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="2">2</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="3">3</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="4">4</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="5">5</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="6">6</button>
<button type="button" class="oi-map-tab" data-oi-map-tab="7">7</button>
      </div>
      <div class="oi-map-hint">Колёсико/трекпад — зум • Esc — закрыть</div>
    </div>

    <div class="oi-map-viewport" data-oi-map-viewport>
      <img class="oi-map-img" data-oi-map-img data-map="1" src="../../assets/maps/karta_1.png" alt="map 1" style="display:block;">
<img class="oi-map-img" data-oi-map-img data-map="2" src="../../assets/maps/karta_2.png" alt="map 2" style="display:none;">
<img class="oi-map-img" data-oi-map-img data-map="3" src="../../assets/maps/karta_3.png" alt="map 3" style="display:none;">
<img class="oi-map-img" data-oi-map-img data-map="4" src="../../assets/maps/karta_4.png" alt="map 4" style="display:none;">
<img class="oi-map-img" data-oi-map-img data-map="5" src="../../assets/maps/karta_5.png" alt="map 5" style="display:none;">
<img class="oi-map-img" data-oi-map-img data-map="6" src="../../assets/maps/karta_6.png" alt="map 6" style="display:none;">
<img class="oi-map-img" data-oi-map-img data-map="7" src="../../assets/maps/karta_7.png" alt="map 7" style="display:none;">
    </div>
  </div>
</div>




<script data-oi-map-overlay>
(function(){
  // ====== MAPS ======
  const mapBtn = document.querySelector('[data-oi-map-btn]');
  const mapBackdrop = document.querySelector('[data-oi-map-backdrop]');
  const mapCloseBtn = document.querySelector('[data-oi-map-close]');
  const mapViewport = document.querySelector('[data-oi-map-viewport]');
  const mapTabs = Array.from(document.querySelectorAll('[data-oi-map-tab]'));
  const mapImgs = Array.from(document.querySelectorAll('[data-oi-map-img][data-map]'));

  // ====== MENDELEEV ======
  const tableBtn = document.querySelector('[data-oi-table-btn]');
  const tableBackdrop = document.querySelector('[data-oi-table-backdrop]');
  const tableCloseBtn = document.querySelector('[data-oi-table-close]');
  const tableViewport = document.querySelector('[data-oi-table-viewport]');
  const tableTabs = Array.from(document.querySelectorAll('[data-oi-table-tab]'));
  const tableImgs = Array.from(document.querySelectorAll('[data-oi-table-img][data-table]'));

  let scale = 1;

  function applyScale(){
    mapImgs.forEach(img => { img.style.transform = `scale(${scale})`; });
    tableImgs.forEach(img => { img.style.transform = `scale(${scale})`; });
  }

  function openBackdrop(backdrop){
    backdrop.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
  }
  function closeBackdrop(backdrop){
    backdrop.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
  }

  function showMap(n){
    mapImgs.forEach(img => {
      img.style.display = (img.getAttribute('data-map') === String(n)) ? 'block' : 'none';
    });
    mapTabs.forEach(t => t.classList.toggle('is-active', t.getAttribute('data-oi-map-tab') === String(n)));
    if(mapViewport){ mapViewport.scrollTop = 0; mapViewport.scrollLeft = 0; }
  }

  function showTable(n){
    tableImgs.forEach(img => {
      img.style.display = (img.getAttribute('data-table') === String(n)) ? 'block' : 'none';
    });
    tableTabs.forEach(t => t.classList.toggle('is-active', t.getAttribute('data-oi-table-tab') === String(n)));
    if(tableViewport){ tableViewport.scrollTop = 0; tableViewport.scrollLeft = 0; }
  }

  // MAP events
  if(mapBtn && mapBackdrop && mapCloseBtn && mapViewport && mapImgs.length){
    mapBtn.addEventListener('click', () => openBackdrop(mapBackdrop));
    mapCloseBtn.addEventListener('click', () => closeBackdrop(mapBackdrop));
    mapBackdrop.addEventListener('click', (e)=>{ if(e.target === mapBackdrop) closeBackdrop(mapBackdrop); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeBackdrop(mapBackdrop); });
    mapTabs.forEach(t => t.addEventListener('click', () => showMap(t.getAttribute('data-oi-map-tab'))));

    mapViewport.addEventListener('wheel', (e)=>{
      if(mapBackdrop.getAttribute('aria-hidden') !== 'false') return;
      e.preventDefault();
      const delta = -Math.sign(e.deltaY) * 0.1;
      scale = Math.min(4, Math.max(0.6, scale + delta));
      applyScale();
    }, {passive:false});

    showMap(1);
  }

  // TABLE events
  if(tableBtn && tableBackdrop && tableCloseBtn && tableViewport && tableImgs.length){
    tableBtn.addEventListener('click', () => openBackdrop(tableBackdrop));
    tableCloseBtn.addEventListener('click', () => closeBackdrop(tableBackdrop));
    tableBackdrop.addEventListener('click', (e)=>{ if(e.target === tableBackdrop) closeBackdrop(tableBackdrop); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeBackdrop(tableBackdrop); });
    tableTabs.forEach(t => t.addEventListener('click', () => showTable(t.getAttribute('data-oi-table-tab'))));

    tableViewport.addEventListener('wheel', (e)=>{
      if(tableBackdrop.getAttribute('aria-hidden') !== 'false') return;
      e.preventDefault();
      const delta = -Math.sign(e.deltaY) * 0.1;
      scale = Math.min(4, Math.max(0.6, scale + delta));
      applyScale();
    }, {passive:false});

    showTable(1);
  }

  applyScale();
})();
</script>
</body>
</html>
