<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Растворы</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #4a044e, #581c87, #0f172a);
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
        }
        .heading-font { font-family: 'Montserrat', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .rounded-custom { border-radius: 2.5rem; }
        .lang-btn { transition: all 0.2s; }
        .lang-btn.active { background: #e879f9; color: #0f172a; border-color: transparent; font-weight: 800; }
        .type-card { transition: all 0.3s; cursor: pointer; }
        .type-card.active { background: rgba(232, 121, 249, 0.18); border-color: #e879f9; transform: scale(1.02); }
        @keyframes bubble { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.05); } }
        .particle { animation: bubble 2s ease-in-out infinite; }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="glass rounded-custom p-8 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 id="main-title" class="heading-font text-3xl md:text-5xl uppercase tracking-tight text-fuchsia-400"></h1>
            <p id="sub-title" class="mt-2 text-white/60 font-light"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="setLang('ru')" id="btn-ru" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">RU</button>
            <button onclick="setLang('kz')" id="btn-kz" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">KZ</button>
            <button onclick="setLang('en')" id="btn-en" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">EN</button>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">
        <div class="lg:col-span-6 glass rounded-custom p-8">
            <h2 id="scheme-heading" class="heading-font text-xl mb-6 opacity-80 uppercase tracking-wider"></h2>

            <svg viewBox="0 0 500 280" class="w-full">
                <g>
                    <rect x="40" y="50" width="100" height="160" rx="10" fill="rgba(232,121,249,0.1)" stroke="#e879f9" stroke-width="2"/>
                    <circle class="particle" cx="70" cy="100" r="10" fill="#f0abfc"/>
                    <circle class="particle" cx="100" cy="130" r="10" fill="#f0abfc"/>
                    <circle class="particle" cx="115" cy="170" r="10" fill="#f0abfc"/>
                    <text id="svg-solute-name" x="90" y="240" text-anchor="middle" fill="#f0abfc" font-size="14" font-weight="bold"></text>
                </g>
                <text x="180" y="135" text-anchor="middle" fill="white" font-size="36" font-weight="bold">+</text>
                <g>
                    <rect x="220" y="50" width="100" height="160" rx="10" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="2"/>
                    <circle cx="245" cy="100" r="7" fill="#7dd3fc"/>
                    <circle cx="280" cy="115" r="7" fill="#7dd3fc"/>
                    <circle cx="270" cy="155" r="7" fill="#7dd3fc"/>
                    <circle cx="295" cy="180" r="7" fill="#7dd3fc"/>
                    <circle cx="250" cy="190" r="7" fill="#7dd3fc"/>
                    <text id="svg-solvent-name" x="270" y="240" text-anchor="middle" fill="#7dd3fc" font-size="14" font-weight="bold"></text>
                </g>
                <text x="360" y="135" text-anchor="middle" fill="white" font-size="36" font-weight="bold">=</text>
                <g>
                    <rect x="400" y="50" width="100" height="160" rx="10" fill="rgba(255,255,255,0.08)" stroke="#fff" stroke-width="2"/>
                    <circle cx="420" cy="80" r="5" fill="#f0abfc"/>
                    <circle cx="450" cy="100" r="5" fill="#f0abfc"/>
                    <circle cx="480" cy="120" r="5" fill="#f0abfc"/>
                    <circle cx="425" cy="140" r="5" fill="#f0abfc"/>
                    <circle cx="465" cy="160" r="5" fill="#f0abfc"/>
                    <circle cx="430" cy="190" r="5" fill="#f0abfc"/>
                    <circle cx="475" cy="195" r="5" fill="#f0abfc"/>
                    <circle cx="445" cy="175" r="4" fill="#7dd3fc"/>
                    <circle cx="460" cy="80" r="4" fill="#7dd3fc"/>
                    <circle cx="420" cy="115" r="4" fill="#7dd3fc"/>
                    <text id="svg-solution-name" x="450" y="240" text-anchor="middle" fill="white" font-size="14" font-weight="bold"></text>
                </g>
            </svg>

            <p id="scheme-caption" class="text-white/70 mt-4 text-center leading-relaxed"></p>
        </div>

        <div class="lg:col-span-6 glass rounded-custom p-8 border-l-4 border-fuchsia-500">
            <h2 id="types-heading" class="heading-font text-xl mb-4 text-fuchsia-300 uppercase tracking-wider"></h2>
            <div class="space-y-3 mb-5">
                <div onclick="setType('dilute')" id="type-dilute" class="type-card bg-white/5 rounded-2xl p-4 border border-white/10 flex items-center gap-4">
                    <div class="w-12 h-16 rounded-lg border-2 border-fuchsia-400/40 relative overflow-hidden flex-shrink-0">
                        <div class="absolute inset-x-0 bottom-0 bg-fuchsia-500/15 h-full"></div>
                        <div class="absolute w-1.5 h-1.5 bg-fuchsia-300 rounded-full top-1/3 left-1/4"></div>
                        <div class="absolute w-1.5 h-1.5 bg-fuchsia-300 rounded-full top-2/3 left-2/3"></div>
                    </div>
                    <div>
                        <h4 id="type1-title" class="font-bold text-fuchsia-300"></h4>
                        <p id="type1-desc" class="text-white/70 text-sm"></p>
                    </div>
                </div>
                <div onclick="setType('concentrated')" id="type-concentrated" class="type-card bg-white/5 rounded-2xl p-4 border border-white/10 flex items-center gap-4">
                    <div class="w-12 h-16 rounded-lg border-2 border-fuchsia-400/40 relative overflow-hidden flex-shrink-0">
                        <div class="absolute inset-x-0 bottom-0 bg-fuchsia-500/40 h-full"></div>
                    </div>
                    <div>
                        <h4 id="type2-title" class="font-bold text-fuchsia-300"></h4>
                        <p id="type2-desc" class="text-white/70 text-sm"></p>
                    </div>
                </div>
                <div onclick="setType('saturated')" id="type-saturated" class="type-card bg-white/5 rounded-2xl p-4 border border-white/10 flex items-center gap-4">
                    <div class="w-12 h-16 rounded-lg border-2 border-fuchsia-400/40 relative overflow-hidden flex-shrink-0">
                        <div class="absolute inset-x-0 bottom-0 bg-fuchsia-500/70 h-full"></div>
                        <div class="absolute bottom-1 left-2 w-2 h-1 bg-fuchsia-200 rounded-sm"></div>
                        <div class="absolute bottom-2 right-1 w-2 h-1 bg-fuchsia-200 rounded-sm"></div>
                    </div>
                    <div>
                        <h4 id="type3-title" class="font-bold text-fuchsia-300"></h4>
                        <p id="type3-desc" class="text-white/70 text-sm"></p>
                    </div>
                </div>
            </div>
            <div class="bg-black/30 rounded-2xl p-4 border border-fuchsia-500/20">
                <div id="example-label" class="text-xs text-fuchsia-300 uppercase tracking-widest mb-2"></div>
                <p id="example-text" class="text-white/80 leading-relaxed"></p>
            </div>
        </div>
    </main>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
        <div class="glass rounded-custom p-8 hover:bg-fuchsia-500/10 transition-colors">
            <div class="w-14 h-14 bg-fuchsia-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">💧</div>
            <h4 id="card1-title" class="heading-font text-2xl mb-3 text-fuchsia-300"></h4>
            <p id="card1-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-fuchsia-500/10 transition-colors">
            <div class="w-14 h-14 bg-fuchsia-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🧪</div>
            <h4 id="card2-title" class="heading-font text-2xl mb-3 text-fuchsia-300"></h4>
            <p id="card2-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-fuchsia-500/10 transition-colors">
            <div class="w-14 h-14 bg-fuchsia-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🌊</div>
            <h4 id="card3-title" class="heading-font text-2xl mb-3 text-fuchsia-300"></h4>
            <p id="card3-desc" class="text-white/70 leading-relaxed"></p>
        </div>
    </section>

    <footer class="glass rounded-custom p-10 text-center">
        <p id="quote-text" class="text-2xl md:text-3xl italic font-light leading-snug mb-4"></p>
        <cite id="quote-author" class="text-fuchsia-400 font-bold uppercase tracking-widest text-sm"></cite>
    </footer>

    <script>
        const translations = {
            ru: {
                title: "Растворы",
                subtitle: "Однородные смеси, без которых не работает живая клетка",
                schemeHeading: "Состав раствора",
                soluteName: "Растворённое вещество",
                solventName: "Растворитель",
                solutionName: "Раствор",
                schemeCaption: "Раствор — однородная (гомогенная) смесь, в которой частицы растворённого вещества равномерно распределены между молекулами растворителя.",
                typesHeading: "Типы растворов",
                types: {
                    dilute:       { title: "Разбавленный", desc: "Очень мало растворённого вещества" },
                    concentrated: { title: "Концентрированный", desc: "Много растворённого вещества" },
                    saturated:    { title: "Насыщенный", desc: "Больше уже не растворяется при данной температуре" }
                },
                examples: {
                    dilute:       "Подсоленная вода для отваривания макарон — раствор разбавленный, концентрация ниже предельной.",
                    concentrated: "Морская вода — концентрированный раствор солей: плотность выше, в нём легче плавать.",
                    saturated:    "Если в стакан воды насыпать сахар и долго мешать — наступит момент, когда сахар перестанет растворяться. Это насыщенный раствор."
                },
                exampleLabel: "Бытовой пример",
                cards: [
                    { title: "Универсальный растворитель", desc: "Вода растворяет почти всё благодаря своей полярности. На воде основаны кровь, сок растений, морская вода и почти все реакции в живой клетке." },
                    { title: "Другие растворители", desc: "Этанол, ацетон, бензин растворяют то, что не растворяет вода: жиры, лаки, краски. Используются в промышленности и медицине." },
                    { title: "Сплавы — твёрдые растворы", desc: "Сталь, бронза, латунь — это растворы металлов в металлах. Они твёрдые, но имеют ту же однородную структуру, что и жидкие растворы." }
                ],
                quote: "«Подобное растворяется в подобном»",
                author: "Принцип химии растворов"
            },
            kz: {
                title: "Ерітінділер",
                subtitle: "Тірі жасуша жұмыс істемейтін біртекті қоспалар",
                schemeHeading: "Ерітінді құрамы",
                soluteName: "Еріген зат",
                solventName: "Еріткіш",
                solutionName: "Ерітінді",
                schemeCaption: "Ерітінді — еріген зат бөлшектері еріткіш молекулаларының арасында біркелкі таралған біртекті (гомогенді) қоспа.",
                typesHeading: "Ерітінділер түрлері",
                types: {
                    dilute:       { title: "Сұйытылған", desc: "Еріген заты өте аз" },
                    concentrated: { title: "Концентрлі", desc: "Еріген заты көп" },
                    saturated:    { title: "Қаныққан", desc: "Берілген температурада артық ермейді" }
                },
                examples: {
                    dilute:       "Макарон қайнатуға арналған тұздалған су — сұйытылған ерітінді, концентрациясы шегі төмен.",
                    concentrated: "Теңіз суы — тұздардың концентрлі ерітіндісі: тығыздығы жоғары, онда жүзу жеңіл.",
                    saturated:    "Стақандағы суға қант салып, ұзақ араластырсаңыз — бір сәтте қант ерімей қалады. Бұл қаныққан ерітінді."
                },
                exampleLabel: "Тұрмыстық мысал",
                cards: [
                    { title: "Әмбебап еріткіш", desc: "Су полярлы болғандықтан барлық дерлік нәрсені ерітеді. Қан, өсімдік шырыны, теңіз суы — бәрі су ерітіндісі." },
                    { title: "Басқа еріткіштер", desc: "Этанол, ацетон, бензин су еріте алмайтын майлар мен бояуларды ерітеді. Өнеркәсіп пен медицинада қолданылады." },
                    { title: "Қорытпалар — қатты ерітінділер", desc: "Болат, қола, жез — металдардағы металдар ерітіндісі. Қатты болса да, сұйық ерітінді сияқты біртекті құрылымды." }
                ],
                quote: "«Ұқсас ұқсасында ериді»",
                author: "Ерітінділер химиясының қағидасы"
            },
            en: {
                title: "Solutions",
                subtitle: "Homogeneous mixtures without which no living cell works",
                schemeHeading: "Composition of a solution",
                soluteName: "Solute",
                solventName: "Solvent",
                solutionName: "Solution",
                schemeCaption: "A solution is a homogeneous mixture in which the particles of the solute are evenly distributed between the molecules of the solvent.",
                typesHeading: "Types of solutions",
                types: {
                    dilute:       { title: "Dilute", desc: "Very little solute" },
                    concentrated: { title: "Concentrated", desc: "A lot of solute" },
                    saturated:    { title: "Saturated", desc: "No more dissolves at this temperature" }
                },
                examples: {
                    dilute:       "Salted water for boiling pasta is a dilute solution — its concentration is below the maximum.",
                    concentrated: "Sea water is a concentrated salt solution — denser, so it is easier to float in it.",
                    saturated:    "If you keep adding sugar to a glass of water, eventually it stops dissolving. That is a saturated solution."
                },
                exampleLabel: "Everyday example",
                cards: [
                    { title: "Universal solvent", desc: "Water dissolves almost everything thanks to its polarity. Blood, plant sap, sea water — almost every living-cell reaction takes place in water." },
                    { title: "Other solvents", desc: "Ethanol, acetone, petrol dissolve fats, varnishes and paints that water cannot. Widely used in industry and medicine." },
                    { title: "Alloys — solid solutions", desc: "Steel, bronze, brass — solutions of metals in metals. Though solid, they have the same homogeneous structure as a liquid solution." }
                ],
                quote: "«Like dissolves like»",
                author: "Solution-chemistry principle"
            }
        };

        let currentLang = 'ru';
        let currentType = 'dilute';

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            try { localStorage.setItem('poster_lang', lang); } catch(e){}
            updateUI();
        }

        function setType(t) {
            currentType = t;
            document.querySelectorAll('.type-card').forEach(c => c.classList.remove('active'));
            document.getElementById('type-' + t).classList.add('active');
            const tr = translations[currentLang];
            document.getElementById('example-text').textContent = tr.examples[t];
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('sub-title').textContent = t.subtitle;
            document.getElementById('scheme-heading').textContent = t.schemeHeading;
            document.getElementById('svg-solute-name').textContent = t.soluteName;
            document.getElementById('svg-solvent-name').textContent = t.solventName;
            document.getElementById('svg-solution-name').textContent = t.solutionName;
            document.getElementById('scheme-caption').textContent = t.schemeCaption;
            document.getElementById('types-heading').textContent = t.typesHeading;
            document.getElementById('type1-title').textContent = t.types.dilute.title;
            document.getElementById('type1-desc').textContent = t.types.dilute.desc;
            document.getElementById('type2-title').textContent = t.types.concentrated.title;
            document.getElementById('type2-desc').textContent = t.types.concentrated.desc;
            document.getElementById('type3-title').textContent = t.types.saturated.title;
            document.getElementById('type3-desc').textContent = t.types.saturated.desc;
            document.getElementById('example-label').textContent = t.exampleLabel;
            document.getElementById('example-text').textContent = t.examples[currentType];
            for (let i = 0; i < 3; i++) {
                document.getElementById('card' + (i+1) + '-title').textContent = t.cards[i].title;
                document.getElementById('card' + (i+1) + '-desc').textContent = t.cards[i].desc;
            }
            document.getElementById('quote-text').textContent = t.quote;
            document.getElementById('quote-author').textContent = t.author;
        }

        window.onload = () => {
            let s = 'ru';
            try { s = localStorage.getItem('poster_lang') || 'ru'; } catch(e){}
            if (s === 'kk') s = 'kz';
            setType('dilute');
            setLang(s);
        };
    </script>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>

<style data-oi-map-overlay>

.oi-table-btn{position:fixed;right:120px;bottom:16px;z-index:9999;padding:10px 14px;border-radius:999px;border:1px solid rgba(0,0,0,.15);background:#fff;cursor:pointer;font:600 14px/1.1 system-ui,-apple-system,Segoe UI,Roboto,Arial;box-shadow:0 8px 20px rgba(0,0,0,.12);}

</style>

<div class="oi-map-backdrop" aria-hidden="true" data-oi-table-backdrop>
  <div class="oi-map-modal" role="dialog" aria-modal="true" aria-label="Таблица Менделеева">

<script data-oi-map-overlay>
(function(){
  const mapBtn=document.querySelector('[data-oi-map-btn]'),mapBackdrop=document.querySelector('[data-oi-map-backdrop]'),mapCloseBtn=document.querySelector('[data-oi-map-close]'),mapViewport=document.querySelector('[data-oi-map-viewport]'),mapTabs=Array.from(document.querySelectorAll('[data-oi-map-tab]')),mapImgs=Array.from(document.querySelectorAll('[data-oi-map-img][data-map]'));
  const tableBtn=document.querySelector('[data-oi-table-btn]'),tableBackdrop=document.querySelector('[data-oi-table-backdrop]'),tableCloseBtn=document.querySelector('[data-oi-table-close]'),tableViewport=document.querySelector('[data-oi-table-viewport]'),tableTabs=Array.from(document.querySelectorAll('[data-oi-table-tab]')),tableImgs=Array.from(document.querySelectorAll('[data-oi-table-img][data-table]'));
  let scale=1;
  function applyScale(){mapImgs.forEach(i=>i.style.transform=`scale(${scale})`);tableImgs.forEach(i=>i.style.transform=`scale(${scale})`);}
  function openBackdrop(b){b.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
  function closeBackdrop(b){b.setAttribute('aria-hidden','true');document.body.style.overflow='';}
  function showMap(n){mapImgs.forEach(i=>i.style.display=(i.getAttribute('data-map')===String(n))?'block':'none');mapTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-map-tab')===String(n)));if(mapViewport){mapViewport.scrollTop=0;mapViewport.scrollLeft=0;}}
  function showTable(n){tableImgs.forEach(i=>i.style.display=(i.getAttribute('data-table')===String(n))?'block':'none');tableTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-table-tab')===String(n)));if(tableViewport){tableViewport.scrollTop=0;tableViewport.scrollLeft=0;}}
  if(mapBtn&&mapBackdrop&&mapCloseBtn&&mapViewport&&mapImgs.length){mapBtn.addEventListener('click',()=>openBackdrop(mapBackdrop));mapCloseBtn.addEventListener('click',()=>closeBackdrop(mapBackdrop));mapBackdrop.addEventListener('click',e=>{if(e.target===mapBackdrop)closeBackdrop(mapBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(mapBackdrop);});mapTabs.forEach(t=>t.addEventListener('click',()=>showMap(t.getAttribute('data-oi-map-tab'))));mapViewport.addEventListener('wheel',e=>{if(mapBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showMap(1);}
  if(tableBtn&&tableBackdrop&&tableCloseBtn&&tableViewport&&tableImgs.length){tableBtn.addEventListener('click',()=>openBackdrop(tableBackdrop));tableCloseBtn.addEventListener('click',()=>closeBackdrop(tableBackdrop));tableBackdrop.addEventListener('click',e=>{if(e.target===tableBackdrop)closeBackdrop(tableBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(tableBackdrop);});tableTabs.forEach(t=>t.addEventListener('click',()=>showTable(t.getAttribute('data-oi-table-tab'))));tableViewport.addEventListener('wheel',e=>{if(tableBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showTable(1);}
  applyScale();
})();
</script>
