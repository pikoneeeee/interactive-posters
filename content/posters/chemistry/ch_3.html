<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry Poster - Physical Bodies & Substances</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at bottom left, #0f2027, #203a43, #2c5364);
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
        }
        .heading-font { font-family: 'Montserrat', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .rounded-custom { border-radius: 3rem; }
        canvas { cursor: pointer; }
        .lang-btn.active { background: #38bdf8; color: #0f172a; border-color: transparent; }
    </style>
</head>
<body class="p-4 md:p-10">

<!-- Header -->
    <header class="glass rounded-custom p-8 mb-8 flex flex-col md:flex-row justify-between items-center">
        <div>
            <h1 id="main-title" class="heading-font text-3xl md:text-5xl uppercase tracking-tighter text-sky-400"></h1>
            <p id="sub-title" class="mt-2 text-white/60 font-light italic"></p>
        </div>
        <div class="flex gap-3 mt-6 md:mt-0">
            <button onclick="setLang('ru')" id="btn-ru" class="lang-btn px-6 py-2 rounded-full border border-white/20 transition-all font-bold">RU</button>
            <button onclick="setLang('kz')" id="btn-kz" class="lang-btn px-6 py-2 rounded-full border border-white/20 transition-all font-bold">KZ</button>
            <button onclick="setLang('en')" id="btn-en" class="lang-btn px-6 py-2 rounded-full border border-white/20 transition-all font-bold">EN</button>
        </div>
    </header>

    <!-- Interactive Grid -->
    <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">
        <!-- Canvas Section -->
        <div class="lg:col-span-8 glass rounded-custom p-8 relative overflow-hidden flex flex-col">
            <h2 id="canvas-heading" class="heading-font text-xl mb-6 opacity-70 flex items-center gap-2">
                <span class="w-2 h-2 bg-sky-500 rounded-full animate-pulse"></span>
                <span></span>
            </h2>
            <div class="flex-grow flex items-center justify-center">
                <canvas id="atomCanvas" class="w-full h-[450px]"></canvas>
            </div>
            <p id="canvas-hint" class="mt-4 text-center text-sm text-white/40 tracking-widest uppercase"></p>
        </div>

        <!-- Info Side Panel -->
        <div class="lg:col-span-4 glass rounded-custom p-10 flex flex-col justify-center border-l-4 border-sky-500">
            <div id="info-content" class="transition-all duration-700">
                <div id="info-icon" class="text-5xl mb-6">💎</div>
                <h3 id="info-title" class="heading-font text-4xl mb-6 text-sky-300"></h3>
                <div id="info-text" class="text-lg leading-relaxed font-light text-white/80 space-y-4"></div>
            </div>
        </div>
    </main>

    <!-- Deep Dive Cards -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
        <div class="glass rounded-custom p-10 group hover:bg-sky-500/10 transition-colors">
            <h4 id="card1-title" class="heading-font text-2xl mb-4 text-sky-400 group-hover:translate-x-2 transition-transform"></h4>
            <p id="card1-desc" class="text-white/60 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-10 group hover:bg-sky-500/10 transition-colors">
            <h4 id="card2-title" class="heading-font text-2xl mb-4 text-sky-400 group-hover:translate-x-2 transition-transform"></h4>
            <p id="card2-desc" class="text-white/60 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-10 group hover:bg-sky-500/10 transition-colors">
            <h4 id="card3-title" class="heading-font text-2xl mb-4 text-sky-400 group-hover:translate-x-2 transition-transform"></h4>
            <p id="card3-desc" class="text-white/60 leading-relaxed"></p>
        </div>
    </section>

    <!-- Academic Footer -->
    <footer class="glass rounded-custom p-12 text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-sky-500 to-transparent"></div>
        <p id="quote-text" class="text-2xl md:text-4xl font-light mb-6 leading-tight italic"></p>
        <div id="quote-author" class="text-sky-400 font-bold tracking-[0.3em] uppercase text-sm"></div>
    </footer>

    <script>
        const translations = {
            ru: {
                title: "Материя и Форма",
                subtitle: "Физические тела и вещества в химии",
                canvasHeading: "Моделирование агрегатных состояний",
                canvasHint: "Кликните на колбу, чтобы изменить состояние вещества",
                defaultTitle: "Вещество",
                defaultText: "Вещество — это то, из чего состоят физические тела. Каждое вещество обладает уникальным набором свойств: плотностью, температурой кипения и агрегатным состоянием.",
                states: {
                    solid: { icon: "❄️", title: "Твердое тело", text: "Частицы расположены в строгом порядке, образуя кристаллическую решетку. Форма и объем сохраняются." },
                    liquid: { icon: "💧", title: "Жидкость", text: "Частицы расположены близко, но могут перемещаться. Объем сохраняется, форма — нет." },
                    gas: { icon: "☁️", title: "Газ", text: "Расстояния между частицами огромны. Вещество занимает весь предоставленный объем." }
                },
                cards: [
                    { title: "Физическое тело", desc: "Предмет, имеющий форму, объем и массу. Например: стакан, гвоздь, капля воды." },
                    { title: "Свойства веществ", desc: "Признаки, по которым вещества отличаются друг от друга или сходны между собой (цвет, запах, электропроводность)." },
                    { title: "Трансформация", desc: "Вещества могут переходить из одного состояния в другое при изменении температуры и давления (плавление, кипение)." }
                ],
                quote: "«Природа не терпит пустоты, и вся она соткана из незримых частиц материи»",
                author: "Аристотель"
            },
            kz: {
                title: "Материя және Пішін",
                subtitle: "Химиядағы физикалық денелер мен заттар",
                canvasHeading: "Агрегаттық күйлерді модельдеу",
                canvasHint: "Заттың күйін өзгерту үшін колбаны басыңыз",
                defaultTitle: "Зат",
                defaultText: "Зат — бұл физикалық денелерді құрайтын нәрсе. Әрбір заттың бірегей қасиеттері болады: тығыздығы, қайнау температурасы және агрегаттық күйі.",
                states: {
                    solid: { icon: "❄️", title: "Қатты дене", text: "Бөлшектер қатаң тәртіпте орналасып, кристалдық тор түзеді. Пішіні мен көлемі сақталады." },
                    liquid: { icon: "💧", title: "Сұйықтық", text: "Бөлшектер жақын орналасқан, бірақ қозғала алады. Көлемі сақталады, пішіні сақталмайды." },
                    gas: { icon: "☁️", title: "Газ", text: "Бөлшектер арасындағы қашықтық өте үлкен. Зат берілген бүкіл көлемді толтырады." }
                },
                cards: [
                    { title: "Физикалық дене", desc: "Пішіні, көлемі және массасы бар зат. Мысалы: стақан, шеге, су тамшысы." },
                    { title: "Заттардың қасиеттері", desc: "Заттардың бір-бірінен ерекшеленетін немесе ұқсас белгілері (түсі, иісі, электр өткізгіштігі)." },
                    { title: "Трансформация", desc: "Температура мен қысым өзгергенде заттар бір күйден екінші күйге ауыса алады (балку, қайнау)." }
                ],
                quote: "«Табиғат бос кеңістікті жек көреді, ол түгелдей көрінбейтін материя бөлшектерінен тұрады»",
                author: "Аристотель"
            },
            en: {
                title: "Matter & Form",
                subtitle: "Physical Bodies and Substances in Chemistry",
                canvasHeading: "Modeling States of Matter",
                canvasHint: "Click the flask to change the state of matter",
                defaultTitle: "Substance",
                defaultText: "A substance is what physical bodies are made of. Every substance has a unique set of properties: density, boiling point, and physical state.",
                states: {
                    solid: { icon: "❄️", title: "Solid", text: "Particles are arranged in a strict order, forming a crystal lattice. Shape and volume are preserved." },
                    liquid: { icon: "💧", title: "Liquid", text: "Particles are close but can move. Volume is preserved, shape is not." },
                    gas: { icon: "☁️", title: "Gas", text: "Distances between particles are huge. The substance occupies the entire provided volume." }
                },
                cards: [
                    { title: "Physical Body", desc: "An object that has shape, volume, and mass. For example: a glass, a nail, a drop of water." },
                    { title: "Properties", desc: "Signs by which substances differ from each other or are similar (color, smell, electrical conductivity)." },
                    { title: "Transformation", desc: "Substances can move from one state to another under changing temperature and pressure (melting, boiling)." }
                ],
                quote: "«Nature abhors a vacuum, and it is all woven from invisible particles of matter»",
                author: "Aristotle"
            }
        };

        let currentLang = 'ru';
        let currentStateIndex = 0;
        const states = ['solid', 'liquid', 'gas'];
        const canvas = document.getElementById('atomCanvas');
        const ctx = canvas.getContext('2d');
        let atoms = [];

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');
            updateUI();
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('sub-title').textContent = t.subtitle;
            document.getElementById('canvas-heading').querySelector('span:last-child').textContent = t.canvasHeading;
            document.getElementById('canvas-hint').textContent = t.canvasHint;
            
            const s = states[currentStateIndex];
            document.getElementById('info-icon').textContent = t.states[s].icon;
            document.getElementById('info-title').textContent = t.states[s].title;
            document.getElementById('info-text').textContent = t.states[s].text;

            document.getElementById('card1-title').textContent = t.cards[0].title;
            document.getElementById('card1-desc').textContent = t.cards[0].desc;
            document.getElementById('card2-title').textContent = t.cards[1].title;
            document.getElementById('card2-desc').textContent = t.cards[1].desc;
            document.getElementById('card3-title').textContent = t.cards[2].title;
            document.getElementById('card3-desc').textContent = t.cards[2].desc;

            document.getElementById('quote-text').textContent = t.quote;
            document.getElementById('quote-author').textContent = t.author;
        }

        function createAtoms() {
            atoms = [];
            const count = 60;
            for(let i=0; i<count; i++) {
                atoms.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    originalX: Math.random() * canvas.width,
                    originalY: Math.random() * canvas.height
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const state = states[currentStateIndex];
            
            atoms.forEach((atom, i) => {
                if(state === 'solid') {
                    // Lattice grid
                    const cols = 10;
                    const spacing = 40;
                    const targetX = (canvas.width/2 - 200) + (i % cols) * spacing;
                    const targetY = (canvas.height/2 - 120) + Math.floor(i / cols) * spacing;
                    atom.x += (targetX - atom.x) * 0.1;
                    atom.y += (targetY - atom.y) * 0.1;
                    // Jiggle
                    atom.x += (Math.random() - 0.5) * 1;
                    atom.y += (Math.random() - 0.5) * 1;
                } else if(state === 'liquid') {
                    // Move freely but stay at bottom
                    atom.x += atom.vx * 0.5;
                    atom.y += atom.vy * 0.5;
                    if(atom.x < 50 || atom.x > canvas.width - 50) atom.vx *= -1;
                    if(atom.y < canvas.height * 0.6 || atom.y > canvas.height - 50) atom.vy *= -1;
                } else {
                    // Gas: move everywhere
                    atom.x += atom.vx * 3;
                    atom.y += atom.vy * 3;
                    if(atom.x < 20 || atom.x > canvas.width - 20) atom.vx *= -1;
                    if(atom.y < 20 || atom.y > canvas.height - 20) atom.vy *= -1;
                }

                ctx.beginPath();
                ctx.arc(atom.x, atom.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = state === 'solid' ? '#38bdf8' : (state === 'liquid' ? '#60a5fa' : '#94a3b8');
                ctx.shadowBlur = 10;
                ctx.shadowColor = ctx.fillStyle;
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        canvas.addEventListener('click', () => {
            currentStateIndex = (currentStateIndex + 1) % states.length;
            const panel = document.getElementById('info-content');
            panel.style.opacity = '0';
            panel.style.transform = 'translateY(20px)';
            setTimeout(() => {
                updateUI();
                panel.style.opacity = '1';
                panel.style.transform = 'translateY(0)';
            }, 300);
        });

        window.onload = () => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            createAtoms();
            setLang((function(){try{return localStorage.getItem('poster_lang')||'ru'}catch(e){return 'ru'}})());
            animate();
        };

        window.addEventListener('resize', () => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            createAtoms();
        });
    </script>

<script data-oi-map-overlay>
(function(){
  // ====== MAPS ======
  const mapBtn = document.querySelector('[data-oi-map-btn]');
  const mapBackdrop = document.querySelector('[data-oi-map-backdrop]');
  const mapCloseBtn = document.querySelector('[data-oi-map-close]');
  const mapViewport = document.querySelector('[data-oi-map-viewport]');
  const mapTabs = Array.from(document.querySelectorAll('[data-oi-map-tab]'));
  const mapImgs = Array.from(document.querySelectorAll('[data-oi-map-img][data-map]'));

  // ====== MENDELEEV ======
  const tableBtn = document.querySelector('[data-oi-table-btn]');
  const tableBackdrop = document.querySelector('[data-oi-table-backdrop]');
  const tableCloseBtn = document.querySelector('[data-oi-table-close]');
  const tableViewport = document.querySelector('[data-oi-table-viewport]');
  const tableTabs = Array.from(document.querySelectorAll('[data-oi-table-tab]'));
  const tableImgs = Array.from(document.querySelectorAll('[data-oi-table-img][data-table]'));

  let scale = 1;

  function applyScale(){
    mapImgs.forEach(img => { img.style.transform = `scale(${scale})`; });
    tableImgs.forEach(img => { img.style.transform = `scale(${scale})`; });
  }

  function openBackdrop(backdrop){
    backdrop.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
  }
  function closeBackdrop(backdrop){
    backdrop.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
  }

  function showMap(n){
    mapImgs.forEach(img => {
      img.style.display = (img.getAttribute('data-map') === String(n)) ? 'block' : 'none';
    });
    mapTabs.forEach(t => t.classList.toggle('is-active', t.getAttribute('data-oi-map-tab') === String(n)));
    if(mapViewport){ mapViewport.scrollTop = 0; mapViewport.scrollLeft = 0; }
  }

  function showTable(n){
    tableImgs.forEach(img => {
      img.style.display = (img.getAttribute('data-table') === String(n)) ? 'block' : 'none';
    });
    tableTabs.forEach(t => t.classList.toggle('is-active', t.getAttribute('data-oi-table-tab') === String(n)));
    if(tableViewport){ tableViewport.scrollTop = 0; tableViewport.scrollLeft = 0; }
  }

  // MAP events
  if(mapBtn && mapBackdrop && mapCloseBtn && mapViewport && mapImgs.length){
    mapBtn.addEventListener('click', () => openBackdrop(mapBackdrop));
    mapCloseBtn.addEventListener('click', () => closeBackdrop(mapBackdrop));
    mapBackdrop.addEventListener('click', (e)=>{ if(e.target === mapBackdrop) closeBackdrop(mapBackdrop); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeBackdrop(mapBackdrop); });
    mapTabs.forEach(t => t.addEventListener('click', () => showMap(t.getAttribute('data-oi-map-tab'))));

    mapViewport.addEventListener('wheel', (e)=>{
      if(mapBackdrop.getAttribute('aria-hidden') !== 'false') return;
      e.preventDefault();
      const delta = -Math.sign(e.deltaY) * 0.1;
      scale = Math.min(4, Math.max(0.6, scale + delta));
      applyScale();
    }, {passive:false});

    showMap(1);
  }

  // TABLE events
  if(tableBtn && tableBackdrop && tableCloseBtn && tableViewport && tableImgs.length){
    tableBtn.addEventListener('click', () => openBackdrop(tableBackdrop));
    tableCloseBtn.addEventListener('click', () => closeBackdrop(tableBackdrop));
    tableBackdrop.addEventListener('click', (e)=>{ if(e.target === tableBackdrop) closeBackdrop(tableBackdrop); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeBackdrop(tableBackdrop); });
    tableTabs.forEach(t => t.addEventListener('click', () => showTable(t.getAttribute('data-oi-table-tab'))));

    tableViewport.addEventListener('wheel', (e)=>{
      if(tableBackdrop.getAttribute('aria-hidden') !== 'false') return;
      e.preventDefault();
      const delta = -Math.sign(e.deltaY) * 0.1;
      scale = Math.min(4, Math.max(0.6, scale + delta));
      applyScale();
    }, {passive:false});

    showTable(1);
  }

  applyScale();
})();
</script>
</body>
</html>
