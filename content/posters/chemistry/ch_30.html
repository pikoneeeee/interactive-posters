<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Водород: свойства и применение</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #422006, #713f12, #1c1917);
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
        }
        .heading-font { font-family: 'Montserrat', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .rounded-custom { border-radius: 2.5rem; }
        .lang-btn { transition: all 0.2s; }
        .lang-btn.active { background: #fcd34d; color: #1c1917; border-color: transparent; font-weight: 800; }
        .tab-btn { transition: all 0.2s; cursor: pointer; }
        .tab-btn.active { background: rgba(252, 211, 77, 0.2); border-color: #fcd34d; }
        .formula-style { font-family: 'Courier New', monospace; }
        @keyframes rise { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }
        .h-atom { animation: rise 2s ease-in-out infinite alternate; }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="glass rounded-custom p-8 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 id="main-title" class="heading-font text-3xl md:text-5xl uppercase tracking-tight text-yellow-300"></h1>
            <p id="sub-title" class="mt-2 text-white/60 font-light"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="setLang('ru')" id="btn-ru" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">RU</button>
            <button onclick="setLang('kz')" id="btn-kz" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">KZ</button>
            <button onclick="setLang('en')" id="btn-en" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">EN</button>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">
        <div class="lg:col-span-5 glass rounded-custom p-8 flex flex-col items-center">
            <h2 id="molecule-heading" class="heading-font text-xl mb-4 opacity-80 uppercase tracking-wider self-start"></h2>
            <svg viewBox="0 0 360 320" class="w-full max-w-[360px]">
                <line x1="135" y1="160" x2="225" y2="160" stroke="#fcd34d" stroke-width="6"/>
                <circle class="h-atom" cx="130" cy="160" r="50" fill="url(#hGrad)" stroke="#fef3c7" stroke-width="3"/>
                <circle class="h-atom" cx="230" cy="160" r="50" fill="url(#hGrad)" stroke="#fef3c7" stroke-width="3"/>
                <text x="130" y="170" text-anchor="middle" fill="#1c1917" font-size="36" font-weight="bold">H</text>
                <text x="230" y="170" text-anchor="middle" fill="#1c1917" font-size="36" font-weight="bold">H</text>
                <text id="svg-mol-name" x="180" y="270" text-anchor="middle" fill="#fde68a" font-size="18" font-weight="bold"></text>
                <text id="svg-mol-mass" x="180" y="295" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="13"></text>
                <defs>
                    <radialGradient id="hGrad"><stop offset="0%" stop-color="#fef9c3"/><stop offset="100%" stop-color="#ca8a04"/></radialGradient>
                </defs>
            </svg>
            <div class="grid grid-cols-2 gap-3 w-full mt-4">
                <div class="bg-white/5 rounded-xl p-3 border border-white/10">
                    <div class="text-xs text-white/50 uppercase tracking-wider" id="prop1-label"></div>
                    <div class="text-lg font-bold text-yellow-300">−253 °C</div>
                </div>
                <div class="bg-white/5 rounded-xl p-3 border border-white/10">
                    <div class="text-xs text-white/50 uppercase tracking-wider" id="prop2-label"></div>
                    <div class="text-lg font-bold text-yellow-300">−259 °C</div>
                </div>
                <div class="bg-white/5 rounded-xl p-3 border border-white/10">
                    <div class="text-xs text-white/50 uppercase tracking-wider" id="prop3-label"></div>
                    <div id="prop3-value" class="text-lg font-bold text-yellow-300"></div>
                </div>
                <div class="bg-white/5 rounded-xl p-3 border border-white/10">
                    <div class="text-xs text-white/50 uppercase tracking-wider" id="prop4-label"></div>
                    <div id="prop4-value" class="text-lg font-bold text-yellow-300"></div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-7 glass rounded-custom p-8 border-l-4 border-yellow-400">
            <div class="flex flex-wrap gap-2 mb-5">
                <button onclick="setTab('prep')" id="tab-prep" class="tab-btn glass px-4 py-2 rounded-full border border-white/15 text-sm font-bold" id-label="prep"></button>
                <button onclick="setTab('reactions')" id="tab-reactions" class="tab-btn glass px-4 py-2 rounded-full border border-white/15 text-sm font-bold"></button>
                <button onclick="setTab('uses')" id="tab-uses" class="tab-btn glass px-4 py-2 rounded-full border border-white/15 text-sm font-bold"></button>
            </div>

            <h3 id="tab-title" class="heading-font text-2xl mb-4 text-yellow-300"></h3>
            <div id="tab-body" class="space-y-3"></div>
        </div>
    </main>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
        <div class="glass rounded-custom p-8 hover:bg-yellow-500/10 transition-colors">
            <div class="w-14 h-14 bg-yellow-400/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">⭐</div>
            <h4 id="card1-title" class="heading-font text-2xl mb-3 text-yellow-300"></h4>
            <p id="card1-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-yellow-500/10 transition-colors">
            <div class="w-14 h-14 bg-yellow-400/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🚀</div>
            <h4 id="card2-title" class="heading-font text-2xl mb-3 text-yellow-300"></h4>
            <p id="card2-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-yellow-500/10 transition-colors">
            <div class="w-14 h-14 bg-yellow-400/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🌍</div>
            <h4 id="card3-title" class="heading-font text-2xl mb-3 text-yellow-300"></h4>
            <p id="card3-desc" class="text-white/70 leading-relaxed"></p>
        </div>
    </section>

    <footer class="glass rounded-custom p-10 text-center">
        <p id="quote-text" class="text-2xl md:text-3xl italic font-light leading-snug mb-4"></p>
        <cite id="quote-author" class="text-yellow-400 font-bold uppercase tracking-widest text-sm"></cite>
    </footer>

    <script>
        const translations = {
            ru: {
                title: "Водород: H₂",
                subtitle: "Самый лёгкий и распространённый элемент Вселенной",
                moleculeHeading: "Молекула H₂",

                molMass: "Mᵣ = 2 • газ • в 14,5 раз легче воздуха",

                prop2: "Т. плавления",
                prop3: "Цвет",
                prop3val: "Бесцветен",
                prop4: "Запах",
                prop4val: "Без запаха",
                tabs: { prep: "Получение", reactions: "Реакции", uses: "Применение" },
                content: {
                    prep: {

                            { eq: "CH₄ + H₂O → CO + 3 H₂", desc: "Конверсия метана с водяным паром — основной промышленный способ." }

                        items: [

                            { eq: "H₂ + Cl₂ → 2 HCl", desc: "С галогенами образует кислоты. На свету реакция идёт со взрывом." },
                            { eq: "CuO + H₂ → Cu + H₂O", desc: "Восстанавливает металлы из оксидов — используется в металлургии." }

                cards: [
                    { title: "Положение в таблице", desc: "Элемент №1 в таблице Менделеева. Один протон в ядре, один электрон. Изотопы: протий, дейтерий, тритий." },

                    { title: "Зелёный водород", desc: "Получаемый электролизом на солнечных и ветровых станциях — ключ к декарбонизации энергетики и промышленности." }
                ],

                author: "Жюль Верн"
            },

                title: "Сутегі: H₂",
                subtitle: "Әлемдегі ең жеңіл әрі көп таралған элемент",
                moleculeHeading: "H₂ молекуласы",
                molName: "Сутегі, H₂",
                molMass: "Mᵣ = 2 • газ • ауадан 14,5 есе жеңіл",
                prop1: "Қайнау т-сы",
                prop2: "Балқу т-сы",
                prop3: "Түсі",
                prop3val: "Түссіз",
                prop4: "Иісі",
                prop4val: "Иіссіз",
                tabs: { prep: "Алу", reactions: "Реакциялар", uses: "Қолданылуы" },
                content: {
                    prep: {
                        title: "Сутегіні алу",
                        items: [
                            { eq: "Zn + 2 HCl → ZnCl₂ + H₂↑", desc: "Зертханада — белсенді металдарға қышқыл әсер ету (Zn, Fe, Mg)." },
                            { eq: "2 H₂O → 2 H₂↑ + O₂↑", desc: "Суды электролиздеу — экологиялық таза өнеркәсіптік әдіс." },
                            { eq: "CH₄ + H₂O → CO + 3 H₂", desc: "Метанды су буымен айналдыру — негізгі өнеркәсіптік әдіс." }
                        ]

                        title: "Химиялық қасиеттер",
                        items: [
                            { eq: "2 H₂ + O₂ → 2 H₂O", desc: "Жанғанда су түзіледі — өте көп жылу бөлінеді." },
                            { eq: "H₂ + Cl₂ → 2 HCl", desc: "Галогендермен қышқыл түзеді. Жарықта жарылыс жасайды." },
                            { eq: "CuO + H₂ → Cu + H₂O", desc: "Металдарды оксидтерінен қалпына келтіреді — металлургияда қолданылады." }

                    },

                        title: "Қолданылуы",

                            { eq: "⚡ Сутегі энергетикасы", desc: "Отын элементтері H₂-ні электрге айналдырады — таза көліктің болашағы." }

                    }

                molMass: "Mᵣ = 2 • gas • 14.5× lighter than air",
                prop1: "Boiling point",
                prop2: "Melting point",
                prop3: "Colour",
                prop3val: "Colourless",
                prop4: "Smell",
                prop4val: "Odourless",
                tabs: { prep: "Preparation", reactions: "Reactions", uses: "Uses" },
                content: {
                    prep: {
                        title: "Preparation of hydrogen",
                        items: [
                            { eq: "Zn + 2 HCl → ZnCl₂ + H₂↑", desc: "Lab method — acids acting on active metals (Zn, Fe, Mg)." },
                            { eq: "2 H₂O → 2 H₂↑ + O₂↑", desc: "Electrolysis of water — a clean industrial process." },
                            { eq: "CH₄ + H₂O → CO + 3 H₂", desc: "Steam reforming of methane — the main industrial route." }
                        ]
                    },
                    reactions: {
                        title: "Chemical properties",
                        items: [
                            { eq: "2 H₂ + O₂ → 2 H₂O", desc: "Burning gives water and releases huge amounts of heat." },
                            { eq: "H₂ + Cl₂ → 2 HCl", desc: "Reacts with halogens to give acids. In light the reaction explodes." },
                            { eq: "CuO + H₂ → Cu + H₂O", desc: "Reduces metals from their oxides — used in metallurgy." }
                        ]
                    },
                    uses: {
                        title: "Applications",
                        items: [
                            { eq: "🚀 Rocket fuel", desc: "Liquid H₂ is the most energetic chemical fuel in spaceflight (Saturn V, Space Shuttle engines)." },

                            { eq: "⚡ Hydrogen energy", desc: "Fuel cells turn H₂ into electricity — the future of clean transport." }
                        ]
                    }
                },
                cards: [
                    { title: "Place in the table", desc: "Element #1 in Mendeleev's table. One proton, one electron. Isotopes: protium, deuterium, tritium." },
                    { title: "Hydrogen in the Universe", desc: "Stars and interstellar gas — about 75% of the Universe's mass. On Earth it is rarely found in pure form." },
                    { title: "Green hydrogen", desc: "Made by electrolysis using solar and wind power — the key to decarbonising energy and industry." }
                ],
                quote: "«Hydrogen is the fuel of the 21st century: light, clean and inexhaustible»",
                author: "Jules Verne"
            }
        };

        let currentLang = 'ru';
        let currentTab = 'prep';

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            try { localStorage.setItem('poster_lang', lang); } catch(e){}
            updateUI();
        }

        function setTab(t) {
            currentTab = t;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + t).classList.add('active');
            renderTab();
        }

        function renderTab() {
            const t = translations[currentLang];
            const content = t.content[currentTab];
            document.getElementById('tab-title').textContent = content.title;
            const body = document.getElementById('tab-body');
            body.innerHTML = content.items.map(it => `
                <div class="bg-white/5 rounded-2xl p-4 border border-white/10">
                    <div class="formula-style text-yellow-300 font-bold mb-1">${it.eq}</div>
                    <div class="text-white/70 text-sm leading-relaxed">${it.desc}</div>
                </div>
            `).join('');
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('sub-title').textContent = t.subtitle;
            document.getElementById('molecule-heading').textContent = t.moleculeHeading;
            document.getElementById('svg-mol-name').textContent = t.molName;
            document.getElementById('svg-mol-mass').textContent = t.molMass;
            document.getElementById('prop1-label').textContent = t.prop1;
            document.getElementById('prop2-label').textContent = t.prop2;
            document.getElementById('prop3-label').textContent = t.prop3;
            document.getElementById('prop3-value').textContent = t.prop3val;
            document.getElementById('prop4-label').textContent = t.prop4;
            document.getElementById('prop4-value').textContent = t.prop4val;
            document.getElementById('tab-prep').textContent = t.tabs.prep;
            document.getElementById('tab-reactions').textContent = t.tabs.reactions;
            document.getElementById('tab-uses').textContent = t.tabs.uses;
            renderTab();
            for (let i = 0; i < 3; i++) {
                document.getElementById('card' + (i+1) + '-title').textContent = t.cards[i].title;
                document.getElementById('card' + (i+1) + '-desc').textContent = t.cards[i].desc;
            }
            document.getElementById('quote-text').textContent = t.quote;
            document.getElementById('quote-author').textContent = t.author;
        }

        window.onload = () => {
            let s = 'ru';
            try { s = localStorage.getItem('poster_lang') || 'ru'; } catch(e){}
            if (s === 'kk') s = 'kz';
            setTab('prep');
            setLang(s);
        };
    </script>

<div class="oi-map-backdrop" aria-hidden="true" data-oi-table-backdrop>
  <div class="oi-map-modal" role="dialog" aria-modal="true" aria-label="Таблица Менделеева">
    <button class="oi-map-close" type="button" aria-label="Закрыть" data-oi-table-close>×</button>

<script data-oi-map-overlay>
(function(){
  const mapBtn=document.querySelector('[data-oi-map-btn]'),mapBackdrop=document.querySelector('[data-oi-map-backdrop]'),mapCloseBtn=document.querySelector('[data-oi-map-close]'),mapViewport=document.querySelector('[data-oi-map-viewport]'),mapTabs=Array.from(document.querySelectorAll('[data-oi-map-tab]')),mapImgs=Array.from(document.querySelectorAll('[data-oi-map-img][data-map]'));
  const tableBtn=document.querySelector('[data-oi-table-btn]'),tableBackdrop=document.querySelector('[data-oi-table-backdrop]'),tableCloseBtn=document.querySelector('[data-oi-table-close]'),tableViewport=document.querySelector('[data-oi-table-viewport]'),tableTabs=Array.from(document.querySelectorAll('[data-oi-table-tab]')),tableImgs=Array.from(document.querySelectorAll('[data-oi-table-img][data-table]'));
  let scale=1;
  function applyScale(){mapImgs.forEach(i=>i.style.transform=`scale(${scale})`);tableImgs.forEach(i=>i.style.transform=`scale(${scale})`);}
  function openBackdrop(b){b.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
  function closeBackdrop(b){b.setAttribute('aria-hidden','true');document.body.style.overflow='';}
  function showMap(n){mapImgs.forEach(i=>i.style.display=(i.getAttribute('data-map')===String(n))?'block':'none');mapTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-map-tab')===String(n)));if(mapViewport){mapViewport.scrollTop=0;mapViewport.scrollLeft=0;}}
  function showTable(n){tableImgs.forEach(i=>i.style.display=(i.getAttribute('data-table')===String(n))?'block':'none');tableTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-table-tab')===String(n)));if(tableViewport){tableViewport.scrollTop=0;tableViewport.scrollLeft=0;}}
  if(mapBtn&&mapBackdrop&&mapCloseBtn&&mapViewport&&mapImgs.length){mapBtn.addEventListener('click',()=>openBackdrop(mapBackdrop));mapCloseBtn.addEventListener('click',()=>closeBackdrop(mapBackdrop));mapBackdrop.addEventListener('click',e=>{if(e.target===mapBackdrop)closeBackdrop(mapBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(mapBackdrop);});mapTabs.forEach(t=>t.addEventListener('click',()=>showMap(t.getAttribute('data-oi-map-tab'))));mapViewport.addEventListener('wheel',e=>{if(mapBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showMap(1);}
  if(tableBtn&&tableBackdrop&&tableCloseBtn&&tableViewport&&tableImgs.length){tableBtn.addEventListener('click',()=>openBackdrop(tableBackdrop));tableCloseBtn.addEventListener('click',()=>closeBackdrop(tableBackdrop));tableBackdrop.addEventListener('click',e=>{if(e.target===tableBackdrop)closeBackdrop(tableBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(tableBackdrop);});tableTabs.forEach(t=>t.addEventListener('click',()=>showTable(t.getAttribute('data-oi-table-tab'))));tableViewport.addEventListener('wheel',e=>{if(tableBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showTable(1);}
  applyScale();
})();
</script>
