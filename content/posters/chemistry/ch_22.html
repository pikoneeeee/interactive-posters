<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчёты по химическим уравнениям</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #064e3b, #065f46, #022c22);
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
        }
        .heading-font { font-family: 'Montserrat', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .rounded-custom { border-radius: 2.5rem; }
        .lang-btn { transition: all 0.2s; }
        .lang-btn.active { background: #10b981; color: #022c22; border-color: transparent; font-weight: 800; }
        .step-card { transition: all 0.3s; }
        .step-card.active { background: rgba(16, 185, 129, 0.15); border-color: #10b981; transform: scale(1.02); }
        .formula-style { font-family: 'Courier New', monospace; }
        .arrow-anim { animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="glass rounded-custom p-8 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 id="main-title" class="heading-font text-3xl md:text-5xl uppercase tracking-tight text-emerald-400"></h1>
            <p id="sub-title" class="mt-2 text-white/60 font-light"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="setLang('ru')" id="btn-ru" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">RU</button>
            <button onclick="setLang('kz')" id="btn-kz" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">KZ</button>
            <button onclick="setLang('en')" id="btn-en" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">EN</button>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">
        <div class="lg:col-span-8 glass rounded-custom p-8">
            <h2 id="reaction-heading" class="heading-font text-xl mb-4 opacity-80 uppercase tracking-wider"></h2>

            <div class="bg-black/30 rounded-2xl p-8 mb-6 border border-emerald-500/20">
                <div class="text-center text-3xl md:text-4xl formula-style text-emerald-300 mb-4">
                    2 H₂ + O₂ → 2 H₂O
                </div>
                <div id="reaction-name" class="text-center text-white/60"></div>
            </div>

            <h3 id="task-heading" class="heading-font text-lg mb-3 text-emerald-300"></h3>
            <p id="task-text" class="text-white/80 leading-relaxed mb-6 bg-white/5 rounded-2xl p-5 border border-white/10"></p>

            <h3 id="steps-heading" class="heading-font text-lg mb-4 text-emerald-300"></h3>
            <div class="space-y-3">
                <div onclick="setStep(1)" id="step-1" class="step-card cursor-pointer bg-white/5 rounded-2xl p-5 border border-white/10 flex gap-4 items-start">
                    <div class="w-10 h-10 rounded-full bg-emerald-500 text-emerald-950 font-extrabold text-xl flex items-center justify-center flex-shrink-0">1</div>
                    <div>
                        <h4 id="step1-title" class="font-bold text-emerald-300"></h4>
                        <p id="step1-text" class="text-white/70 text-sm leading-relaxed mt-1"></p>
                    </div>
                </div>
                <div onclick="setStep(2)" id="step-2" class="step-card cursor-pointer bg-white/5 rounded-2xl p-5 border border-white/10 flex gap-4 items-start">
                    <div class="w-10 h-10 rounded-full bg-emerald-500 text-emerald-950 font-extrabold text-xl flex items-center justify-center flex-shrink-0">2</div>
                    <div>
                        <h4 id="step2-title" class="font-bold text-emerald-300"></h4>
                        <p id="step2-text" class="text-white/70 text-sm leading-relaxed mt-1"></p>
                    </div>
                </div>
                <div onclick="setStep(3)" id="step-3" class="step-card cursor-pointer bg-white/5 rounded-2xl p-5 border border-white/10 flex gap-4 items-start">
                    <div class="w-10 h-10 rounded-full bg-emerald-500 text-emerald-950 font-extrabold text-xl flex items-center justify-center flex-shrink-0">3</div>
                    <div>
                        <h4 id="step3-title" class="font-bold text-emerald-300"></h4>
                        <p id="step3-text" class="text-white/70 text-sm leading-relaxed mt-1"></p>
                    </div>
                </div>
                <div onclick="setStep(4)" id="step-4" class="step-card cursor-pointer bg-white/5 rounded-2xl p-5 border border-white/10 flex gap-4 items-start">
                    <div class="w-10 h-10 rounded-full bg-emerald-500 text-emerald-950 font-extrabold text-xl flex items-center justify-center flex-shrink-0">4</div>
                    <div>
                        <h4 id="step4-title" class="font-bold text-emerald-300"></h4>
                        <p id="step4-text" class="text-white/70 text-sm leading-relaxed mt-1"></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-4 glass rounded-custom p-8 flex flex-col border-l-4 border-emerald-500">
            <div class="text-5xl mb-4">🧮</div>
            <h3 id="formula-title" class="heading-font text-2xl mb-4 text-emerald-300"></h3>

            <div class="bg-black/30 rounded-2xl p-5 mb-4 border border-emerald-500/20 text-center formula-style">
                <div class="text-xl text-emerald-300">n = m / M</div>
                <div id="formula-1-desc" class="text-xs text-white/60 mt-2"></div>
            </div>
            <div class="bg-black/30 rounded-2xl p-5 mb-4 border border-emerald-500/20 text-center formula-style">
                <div class="text-xl text-emerald-300">V = n · Vₘ</div>
                <div id="formula-2-desc" class="text-xs text-white/60 mt-2"></div>
            </div>
            <div class="bg-black/30 rounded-2xl p-5 border border-emerald-500/20 text-center formula-style">
                <div class="text-xl text-emerald-300">N = n · Nₐ</div>
                <div id="formula-3-desc" class="text-xs text-white/60 mt-2"></div>
            </div>

            <div class="mt-6 bg-emerald-500/10 rounded-2xl p-4 border border-emerald-500/30">
                <div id="answer-label" class="text-xs text-emerald-300 uppercase tracking-widest mb-2"></div>
                <div id="answer-value" class="text-2xl font-bold text-white formula-style"></div>
            </div>
        </div>
    </main>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
        <div class="glass rounded-custom p-8 hover:bg-emerald-500/10 transition-colors">
            <div class="w-14 h-14 bg-emerald-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">⚖️</div>
            <h4 id="card1-title" class="heading-font text-2xl mb-3 text-emerald-300"></h4>
            <p id="card1-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-emerald-500/10 transition-colors">
            <div class="w-14 h-14 bg-emerald-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🔄</div>
            <h4 id="card2-title" class="heading-font text-2xl mb-3 text-emerald-300"></h4>
            <p id="card2-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-emerald-500/10 transition-colors">
            <div class="w-14 h-14 bg-emerald-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🏭</div>
            <h4 id="card3-title" class="heading-font text-2xl mb-3 text-emerald-300"></h4>
            <p id="card3-desc" class="text-white/70 leading-relaxed"></p>
        </div>
    </section>

    <footer class="glass rounded-custom p-10 text-center">
        <p id="quote-text" class="text-2xl md:text-3xl italic font-light leading-snug mb-4"></p>
        <cite id="quote-author" class="text-emerald-400 font-bold uppercase tracking-widest text-sm"></cite>
    </footer>

    <script>
        const translations = {
            ru: {
                title: "Расчёты по уравнениям",
                subtitle: "Стехиометрия: количество ↔ масса ↔ объём",
                reactionHeading: "Уравнение реакции",
                reactionName: "Горение водорода: образование воды",
                taskHeading: "Задача",
                taskText: "Сколько граммов воды получится при сгорании 4 г водорода в избытке кислорода?",
                stepsHeading: "Шаги решения",
                steps: [
                    { title: "Записать уравнение", text: "2 H₂ + O₂ → 2 H₂O. Коэффициенты уже расставлены — баланс по атомам соблюдён." },
                    { title: "Найти n(H₂)", text: "n(H₂) = m / M = 4 / 2 = 2 моль водорода." },
                    { title: "Пропорция по уравнению", text: "По уравнению: 2 моль H₂ → 2 моль H₂O. Значит, n(H₂O) = 2 моль." },
                    { title: "Найти массу воды", text: "m(H₂O) = n · M = 2 · 18 = 36 г. Ответ: 36 граммов воды." }
                ],
                formulaTitle: "Главные формулы",
                formula1desc: "Количество вещества через массу",
                formula2desc: "Объём газа (Vₘ = 22,4 л/моль при н.у.)",
                formula3desc: "Число частиц (Nₐ = 6,02·10²³)",
                answerLabel: "Ответ",
                answerValue: "m(H₂O) = 36 г",
                cards: [
                    { title: "Что такое стехиометрия", desc: "Раздел химии, изучающий количественные соотношения между реагентами и продуктами реакции. Основа всех химических расчётов." },
                    { title: "Закон сохранения массы", desc: "Масса веществ до реакции равна массе после. Поэтому коэффициенты в уравнении не выбираются произвольно — они уравнивают атомы." },
                    { title: "Где применяется", desc: "Производство удобрений, лекарств, металлов. Без стехиометрии невозможно посчитать, сколько сырья нужно для тонны продукта." }
                ],
                quote: "«Ничто не возникает из ничего и ничто не исчезает бесследно — лишь меняет форму»",
                author: "Михаил Ломоносов"
            },
            kz: {
                title: "Теңдеу бойынша есептеу",
                subtitle: "Стехиометрия: мөлшер ↔ масса ↔ көлем",
                reactionHeading: "Реакция теңдеуі",
                reactionName: "Сутегінің жануы: су түзілуі",
                taskHeading: "Есеп",
                taskText: "4 г сутегі артық оттегіде толық жанғанда қанша грамм су түзіледі?",
                stepsHeading: "Шешу қадамдары",
                steps: [
                    { title: "Теңдеу жазу", text: "2 H₂ + O₂ → 2 H₂O. Коэффициенттер қойылған — атомдар бойынша баланс сақталған." },
                    { title: "n(H₂) табу", text: "n(H₂) = m / M = 4 / 2 = 2 моль сутегі." },
                    { title: "Теңдеу бойынша қатынас", text: "Теңдеу бойынша: 2 моль H₂ → 2 моль H₂O. Демек, n(H₂O) = 2 моль." },
                    { title: "Су массасын табу", text: "m(H₂O) = n · M = 2 · 18 = 36 г. Жауабы: 36 грамм су." }
                ],
                formulaTitle: "Негізгі формулалар",
                formula1desc: "Зат мөлшерін масса арқылы",
                formula2desc: "Газ көлемі (Vₘ = 22,4 л/моль қ.ж.)",
                formula3desc: "Бөлшектер саны (Nₐ = 6,02·10²³)",
                answerLabel: "Жауап",
                answerValue: "m(H₂O) = 36 г",
                cards: [
                    { title: "Стехиометрия дегеніміз не", desc: "Реакция реагенттері мен өнімдерінің сандық қатынасын зерттейтін химия бөлімі. Барлық химиялық есептеулердің негізі." },
                    { title: "Масса сақталу заңы", desc: "Реакцияға дейінгі заттардың массасы одан кейінгіге тең. Сондықтан теңдеудегі коэффициенттер атомдарды теңестіреді." },
                    { title: "Қайда қолданылады", desc: "Тыңайтқыш, дәрі, металл өндірісі. Стехиометриясыз бір тонна өнімге қанша шикізат керегін есептеу мүмкін емес." }
                ],
                quote: "«Ештеңе жоқтан пайда болмайды және ізсіз жоғалмайды — тек пішінін өзгертеді»",
                author: "Михаил Ломоносов"
            },
            en: {
                title: "Calculations on equations",
                subtitle: "Stoichiometry: moles ↔ mass ↔ volume",
                reactionHeading: "Reaction equation",
                reactionName: "Hydrogen combustion: formation of water",
                taskHeading: "Problem",
                taskText: "How many grams of water are produced when 4 g of hydrogen burns in excess oxygen?",
                stepsHeading: "Solution steps",
                steps: [
                    { title: "Write the equation", text: "2 H₂ + O₂ → 2 H₂O. Coefficients are set — atoms are balanced." },
                    { title: "Find n(H₂)", text: "n(H₂) = m / M = 4 / 2 = 2 mol of hydrogen." },
                    { title: "Ratio from equation", text: "From the equation: 2 mol H₂ → 2 mol H₂O. So n(H₂O) = 2 mol." },
                    { title: "Find water mass", text: "m(H₂O) = n · M = 2 · 18 = 36 g. Answer: 36 grams of water." }
                ],
                formulaTitle: "Key formulas",
                formula1desc: "Amount of substance from mass",
                formula2desc: "Gas volume (Vₘ = 22.4 L/mol at STP)",
                formula3desc: "Number of particles (Nₐ = 6.02·10²³)",
                answerLabel: "Answer",
                answerValue: "m(H₂O) = 36 g",
                cards: [
                    { title: "What is stoichiometry", desc: "A branch of chemistry that studies the quantitative relations between reactants and products. The foundation of all chemical calculations." },
                    { title: "Conservation of mass", desc: "Mass before a reaction equals mass after. That is why equation coefficients balance the atoms on both sides." },
                    { title: "Where it is used", desc: "Production of fertilisers, medicines, metals. Without stoichiometry you cannot calculate how much raw material is needed per tonne of product." }
                ],
                quote: "«Nothing comes from nothing and nothing disappears without a trace — only its form changes»",
                author: "Mikhail Lomonosov"
            }
        };

        let currentLang = 'ru';
        let currentStep = 1;

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            try { localStorage.setItem('poster_lang', lang); } catch(e){}
            updateUI();
        }

        function setStep(n) {
            currentStep = n;
            document.querySelectorAll('.step-card').forEach(c => c.classList.remove('active'));
            document.getElementById('step-' + n).classList.add('active');
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('sub-title').textContent = t.subtitle;
            document.getElementById('reaction-heading').textContent = t.reactionHeading;
            document.getElementById('reaction-name').textContent = t.reactionName;
            document.getElementById('task-heading').textContent = t.taskHeading;
            document.getElementById('task-text').textContent = t.taskText;
            document.getElementById('steps-heading').textContent = t.stepsHeading;

            for (let i = 0; i < 4; i++) {
                document.getElementById('step' + (i+1) + '-title').textContent = t.steps[i].title;
                document.getElementById('step' + (i+1) + '-text').textContent = t.steps[i].text;
            }

            document.getElementById('formula-title').textContent = t.formulaTitle;
            document.getElementById('formula-1-desc').textContent = t.formula1desc;
            document.getElementById('formula-2-desc').textContent = t.formula2desc;
            document.getElementById('formula-3-desc').textContent = t.formula3desc;
            document.getElementById('answer-label').textContent = t.answerLabel;
            document.getElementById('answer-value').textContent = t.answerValue;

            for (let i = 0; i < 3; i++) {
                document.getElementById('card' + (i+1) + '-title').textContent = t.cards[i].title;
                document.getElementById('card' + (i+1) + '-desc').textContent = t.cards[i].desc;
            }
            document.getElementById('quote-text').textContent = t.quote;
            document.getElementById('quote-author').textContent = t.author;
        }

        window.onload = () => {
            let s = 'ru';
            try { s = localStorage.getItem('poster_lang') || 'ru'; } catch(e){}
            if (s === 'kk') s = 'kz';
            setStep(1);
            setLang(s);
        };
    </script>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>

<script data-oi-map-overlay>
(function(){
  const mapBtn=document.querySelector('[data-oi-map-btn]'),mapBackdrop=document.querySelector('[data-oi-map-backdrop]'),mapCloseBtn=document.querySelector('[data-oi-map-close]'),mapViewport=document.querySelector('[data-oi-map-viewport]'),mapTabs=Array.from(document.querySelectorAll('[data-oi-map-tab]')),mapImgs=Array.from(document.querySelectorAll('[data-oi-map-img][data-map]'));
  const tableBtn=document.querySelector('[data-oi-table-btn]'),tableBackdrop=document.querySelector('[data-oi-table-backdrop]'),tableCloseBtn=document.querySelector('[data-oi-table-close]'),tableViewport=document.querySelector('[data-oi-table-viewport]'),tableTabs=Array.from(document.querySelectorAll('[data-oi-table-tab]')),tableImgs=Array.from(document.querySelectorAll('[data-oi-table-img][data-table]'));
  let scale=1;
  function applyScale(){mapImgs.forEach(i=>i.style.transform=`scale(${scale})`);tableImgs.forEach(i=>i.style.transform=`scale(${scale})`);}
  function openBackdrop(b){b.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
  function closeBackdrop(b){b.setAttribute('aria-hidden','true');document.body.style.overflow='';}
  function showMap(n){mapImgs.forEach(i=>i.style.display=(i.getAttribute('data-map')===String(n))?'block':'none');mapTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-map-tab')===String(n)));if(mapViewport){mapViewport.scrollTop=0;mapViewport.scrollLeft=0;}}
  function showTable(n){tableImgs.forEach(i=>i.style.display=(i.getAttribute('data-table')===String(n))?'block':'none');tableTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-table-tab')===String(n)));if(tableViewport){tableViewport.scrollTop=0;tableViewport.scrollLeft=0;}}
  if(mapBtn&&mapBackdrop&&mapCloseBtn&&mapViewport&&mapImgs.length){mapBtn.addEventListener('click',()=>openBackdrop(mapBackdrop));mapCloseBtn.addEventListener('click',()=>closeBackdrop(mapBackdrop));mapBackdrop.addEventListener('click',e=>{if(e.target===mapBackdrop)closeBackdrop(mapBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(mapBackdrop);});mapTabs.forEach(t=>t.addEventListener('click',()=>showMap(t.getAttribute('data-oi-map-tab'))));mapViewport.addEventListener('wheel',e=>{if(mapBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showMap(1);}
  if(tableBtn&&tableBackdrop&&tableCloseBtn&&tableViewport&&tableImgs.length){tableBtn.addEventListener('click',()=>openBackdrop(tableBackdrop));tableCloseBtn.addEventListener('click',()=>closeBackdrop(tableBackdrop));tableBackdrop.addEventListener('click',e=>{if(e.target===tableBackdrop)closeBackdrop(tableBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(tableBackdrop);});tableTabs.forEach(t=>t.addEventListener('click',()=>showTable(t.getAttribute('data-oi-table-tab'))));tableViewport.addEventListener('wheel',e=>{if(tableBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showTable(1);}
  applyScale();
})();
</script>
