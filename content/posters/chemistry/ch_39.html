<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приготовление растворов</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #312e81, #4338ca, #0f172a);
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
        }
        .heading-font { font-family: 'Montserrat', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .rounded-custom { border-radius: 2.5rem; }
        .lang-btn { transition: all 0.2s; }
        .lang-btn.active { background: #818cf8; color: #1e1b4b; border-color: transparent; font-weight: 800; }
        .step-card { transition: all 0.3s; cursor: pointer; }
        .step-card.active { background: rgba(129, 140, 248, 0.18); border-color: #818cf8; transform: scale(1.02); }
        .formula-style { font-family: 'Courier New', monospace; }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="glass rounded-custom p-8 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 id="main-title" class="heading-font text-3xl md:text-5xl uppercase tracking-tight text-indigo-300"></h1>
            <p id="sub-title" class="mt-2 text-white/60 font-light"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="setLang('ru')" id="btn-ru" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">RU</button>
            <button onclick="setLang('kz')" id="btn-kz" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">KZ</button>
            <button onclick="setLang('en')" id="btn-en" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">EN</button>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">
        <div class="lg:col-span-5 glass rounded-custom p-8 flex flex-col items-center">
            <h2 id="lab-heading" class="heading-font text-xl mb-4 opacity-80 uppercase tracking-wider self-start"></h2>
            <svg viewBox="0 0 300 360" class="w-full max-w-[300px]">
                <line x1="150" y1="30" x2="150" y2="80" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
                <rect x="120" y="70" width="60" height="10" fill="rgba(255,255,255,0.2)" rx="2"/>
                <path d="M 95 90 L 95 220 Q 95 250 125 250 L 175 250 Q 205 250 205 220 L 205 90 Z" fill="rgba(129,140,248,0.1)" stroke="#818cf8" stroke-width="2"/>
                <path d="M 95 200 L 205 200 Q 195 240 150 240 Q 105 240 95 200 Z" fill="rgba(129,140,248,0.4)"/>
                <circle cx="125" cy="225" r="5" fill="#a5b4fc"/>
                <circle cx="155" cy="220" r="5" fill="#a5b4fc"/>
                <circle cx="180" cy="230" r="5" fill="#a5b4fc"/>
                <line x1="80" y1="90" x2="90" y2="90" stroke="rgba(255,255,255,0.5)"/>
                <line x1="80" y1="130" x2="90" y2="130" stroke="rgba(255,255,255,0.5)"/>
                <line x1="80" y1="170" x2="90" y2="170" stroke="rgba(255,255,255,0.5)"/>
                <line x1="80" y1="210" x2="90" y2="210" stroke="rgba(255,255,255,0.5)"/>
                <text x="75" y="93" text-anchor="end" fill="rgba(255,255,255,0.6)" font-size="10">100</text>
                <text x="75" y="133" text-anchor="end" fill="rgba(255,255,255,0.6)" font-size="10">75</text>
                <text x="75" y="173" text-anchor="end" fill="rgba(255,255,255,0.6)" font-size="10">50</text>
                <text x="75" y="213" text-anchor="end" fill="rgba(255,255,255,0.6)" font-size="10">25</text>
                <text x="150" y="290" text-anchor="middle" fill="#a5b4fc" font-size="13" id="svg-flask-label" font-weight="bold"></text>
                <text x="150" y="310" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="11" id="svg-flask-volume"></text>
                <text x="150" y="335" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="11" id="svg-flask-result"></text>
            </svg>
        </div>

        <div class="lg:col-span-7 glass rounded-custom p-8 border-l-4 border-indigo-400">
            <h2 id="steps-heading" class="heading-font text-xl mb-4 text-indigo-300 uppercase tracking-wider"></h2>
            <p id="task-text" class="text-white/80 leading-relaxed mb-5 bg-black/30 rounded-2xl p-4 border border-indigo-400/20"></p>

            <div class="space-y-3">
                <div onclick="setStep(1)" id="step-1" class="step-card bg-white/5 rounded-2xl p-4 border border-white/10 flex gap-4 items-start">
                    <div class="w-10 h-10 rounded-full bg-indigo-400 text-indigo-950 font-extrabold text-xl flex items-center justify-center flex-shrink-0">1</div>
                    <div>
                        <h4 id="step1-title" class="font-bold text-indigo-300"></h4>
                        <p id="step1-text" class="text-white/70 text-sm leading-relaxed mt-1"></p>
                    </div>
                </div>
                <div onclick="setStep(2)" id="step-2" class="step-card bg-white/5 rounded-2xl p-4 border border-white/10 flex gap-4 items-start">
                    <div class="w-10 h-10 rounded-full bg-indigo-400 text-indigo-950 font-extrabold text-xl flex items-center justify-center flex-shrink-0">2</div>
                    <div>
                        <h4 id="step2-title" class="font-bold text-indigo-300"></h4>
                        <p id="step2-text" class="text-white/70 text-sm leading-relaxed mt-1"></p>
                    </div>
                </div>
                <div onclick="setStep(3)" id="step-3" class="step-card bg-white/5 rounded-2xl p-4 border border-white/10 flex gap-4 items-start">
                    <div class="w-10 h-10 rounded-full bg-indigo-400 text-indigo-950 font-extrabold text-xl flex items-center justify-center flex-shrink-0">3</div>
                    <div>
                        <h4 id="step3-title" class="font-bold text-indigo-300"></h4>
                        <p id="step3-text" class="text-white/70 text-sm leading-relaxed mt-1"></p>
                    </div>
                </div>
                <div onclick="setStep(4)" id="step-4" class="step-card bg-white/5 rounded-2xl p-4 border border-white/10 flex gap-4 items-start">
                    <div class="w-10 h-10 rounded-full bg-indigo-400 text-indigo-950 font-extrabold text-xl flex items-center justify-center flex-shrink-0">4</div>
                    <div>
                        <h4 id="step4-title" class="font-bold text-indigo-300"></h4>
                        <p id="step4-text" class="text-white/70 text-sm leading-relaxed mt-1"></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
        <div class="glass rounded-custom p-8 hover:bg-indigo-500/10 transition-colors">
            <div class="w-14 h-14 bg-indigo-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">📐</div>
            <h4 id="card1-title" class="heading-font text-2xl mb-3 text-indigo-300"></h4>
            <p id="card1-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-indigo-500/10 transition-colors">
            <div class="w-14 h-14 bg-indigo-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">⚠️</div>
            <h4 id="card2-title" class="heading-font text-2xl mb-3 text-indigo-300"></h4>
            <p id="card2-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-indigo-500/10 transition-colors">
            <div class="w-14 h-14 bg-indigo-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🔬</div>
            <h4 id="card3-title" class="heading-font text-2xl mb-3 text-indigo-300"></h4>
            <p id="card3-desc" class="text-white/70 leading-relaxed"></p>
        </div>
    </section>

    <footer class="glass rounded-custom p-10 text-center">
        <p id="quote-text" class="text-2xl md:text-3xl italic font-light leading-snug mb-4"></p>
        <cite id="quote-author" class="text-indigo-400 font-bold uppercase tracking-widest text-sm"></cite>
    </footer>

    <script>
        const translations = {
            ru: {
                title: "Приготовление растворов",
                subtitle: "Как сделать раствор заданной концентрации",
                labHeading: "Мерная колба",
                flaskLabel: "Раствор готов",
                flaskVolume: "Объём: 250 мл",
                flaskResult: "ω(NaCl) = 5%",
                stepsHeading: "Последовательность действий",
                taskText: "Задача: приготовить 250 г раствора поваренной соли с массовой долей 5%.",
                steps: [
                    { title: "Рассчитать массы", text: "m(NaCl) = ω · m(р-ра) = 0,05 · 250 = 12,5 г. m(H₂O) = 250 − 12,5 = 237,5 г." },
                    { title: "Взвесить вещество", text: "На электронных весах отвесить 12,5 г соли, насыпать в чистый сухой стакан." },
                    { title: "Отмерить воду", text: "Мерным цилиндром отмерить 237,5 мл воды (плотность воды ≈ 1 г/мл)." },
                    { title: "Перемешать", text: "Воду влить к соли, перемешать стеклянной палочкой до полного растворения. Раствор готов." }
                ],
                cards: [
                    { title: "Главное правило", desc: "m(раствора) = m(вещества) + m(растворителя). Поэтому массу воды находят как разность массы раствора и массы вещества." },
                    { title: "Точность важна", desc: "Точно отмеряй массу вещества и объём растворителя. Маленькая ошибка в массе → большая ошибка в концентрации." },
                    { title: "Посуда", desc: "Используют электронные весы, мерный цилиндр или мерную колбу, стеклянную палочку и стакан. Колбу заполняют до риски." }
                ],
                quote: "«Хороший раствор начинается с точного взвешивания»",
                author: "Аналитическая химия"
            },
            kz: {
                title: "Ерітінділерді дайындау",
                subtitle: "Берілген концентрациялы ерітінді қалай жасалады",
                labHeading: "Өлшегіш колба",
                flaskLabel: "Ерітінді дайын",
                flaskVolume: "Көлемі: 250 мл",
                flaskResult: "ω(NaCl) = 5%",
                stepsHeading: "Әрекеттер тізбегі",
                taskText: "Тапсырма: массалық үлесі 5% болатын 250 г ас тұзы ерітіндісін дайындау.",
                steps: [
                    { title: "Массаларды есептеу", text: "m(NaCl) = ω · m(ер.) = 0,05 · 250 = 12,5 г. m(H₂O) = 250 − 12,5 = 237,5 г." },
                    { title: "Затты өлшеу", text: "Электронды таразыда 12,5 г тұзды өлшеп, таза құрғақ стақанға салу." },
                    { title: "Суды өлшеу", text: "Өлшегіш цилиндрмен 237,5 мл су алу (су тығыздығы ≈ 1 г/мл)." },
                    { title: "Араластыру", text: "Суды тұзға құйып, шыны таяқшамен толық еріп бітпегенше араластыру. Ерітінді дайын." }
                ],
                cards: [
                    { title: "Басты ереже", desc: "m(ерітінді) = m(зат) + m(еріткіш). Сондықтан су массасын ерітінді массасы мен зат массасының айырмасынан табады." },
                    { title: "Дәлдік маңызды", desc: "Зат массасы мен еріткіш көлемін дәл өлшеңіз. Кіші қате → үлкен концентрация қатесі." },
                    { title: "Ыдыстар", desc: "Электронды таразы, өлшегіш цилиндр немесе колба, шыны таяқша, стақан қолданылады. Колба белгіге дейін толтырылады." }
                ],
                quote: "«Жақсы ерітінді дәл өлшеуден басталады»",
                author: "Аналитикалық химия"
            },
            en: {
                title: "Preparing solutions",
                subtitle: "How to make a solution of a required concentration",
                labHeading: "Volumetric flask",
                flaskLabel: "Solution ready",
                flaskVolume: "Volume: 250 mL",
                flaskResult: "ω(NaCl) = 5%",
                stepsHeading: "Sequence of steps",
                taskText: "Task: prepare 250 g of a table-salt solution with mass fraction 5%.",
                steps: [
                    { title: "Calculate masses", text: "m(NaCl) = ω · m(sol.) = 0.05 · 250 = 12.5 g. m(H₂O) = 250 − 12.5 = 237.5 g." },
                    { title: "Weigh the substance", text: "Weigh 12.5 g of salt on an electronic balance and put it in a clean, dry beaker." },
                    { title: "Measure the water", text: "Measure 237.5 mL of water with a graduated cylinder (water density ≈ 1 g/mL)." },
                    { title: "Mix", text: "Pour the water onto the salt and stir with a glass rod until everything dissolves. The solution is ready." }
                ],
                cards: [
                    { title: "Main rule", desc: "m(solution) = m(solute) + m(solvent). The water mass is the difference between the solution mass and the solute mass." },
                    { title: "Accuracy matters", desc: "Measure mass and volume precisely. A small mass error → a large concentration error." },
                    { title: "Glassware", desc: "Use an electronic balance, a graduated cylinder or volumetric flask, a glass rod and a beaker. Fill the flask to the mark." }
                ],
                quote: "«A good solution begins with an accurate weighing»",
                author: "Analytical chemistry"
            }
        };

        let currentLang = 'ru';
        let currentStep = 1;

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            try { localStorage.setItem('poster_lang', lang); } catch(e){}
            updateUI();
        }

        function setStep(n) {
            currentStep = n;
            document.querySelectorAll('.step-card').forEach(c => c.classList.remove('active'));
            document.getElementById('step-' + n).classList.add('active');
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('sub-title').textContent = t.subtitle;
            document.getElementById('lab-heading').textContent = t.labHeading;
            document.getElementById('svg-flask-label').textContent = t.flaskLabel;
            document.getElementById('svg-flask-volume').textContent = t.flaskVolume;
            document.getElementById('svg-flask-result').textContent = t.flaskResult;
            document.getElementById('steps-heading').textContent = t.stepsHeading;
            document.getElementById('task-text').textContent = t.taskText;
            for (let i = 0; i < 4; i++) {
                document.getElementById('step' + (i+1) + '-title').textContent = t.steps[i].title;
                document.getElementById('step' + (i+1) + '-text').textContent = t.steps[i].text;
            }
            for (let i = 0; i < 3; i++) {
                document.getElementById('card' + (i+1) + '-title').textContent = t.cards[i].title;
                document.getElementById('card' + (i+1) + '-desc').textContent = t.cards[i].desc;
            }
            document.getElementById('quote-text').textContent = t.quote;
            document.getElementById('quote-author').textContent = t.author;
        }

        window.onload = () => {
            let s = 'ru';
            try { s = localStorage.getItem('poster_lang') || 'ru'; } catch(e){}
            if (s === 'kk') s = 'kz';
            setStep(1);
            setLang(s);
        };
    </script>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>

<script data-oi-map-overlay>
(function(){
  const mapBtn=document.querySelector('[data-oi-map-btn]'),mapBackdrop=document.querySelector('[data-oi-map-backdrop]'),mapCloseBtn=document.querySelector('[data-oi-map-close]'),mapViewport=document.querySelector('[data-oi-map-viewport]'),mapTabs=Array.from(document.querySelectorAll('[data-oi-map-tab]')),mapImgs=Array.from(document.querySelectorAll('[data-oi-map-img][data-map]'));
  const tableBtn=document.querySelector('[data-oi-table-btn]'),tableBackdrop=document.querySelector('[data-oi-table-backdrop]'),tableCloseBtn=document.querySelector('[data-oi-table-close]'),tableViewport=document.querySelector('[data-oi-table-viewport]'),tableTabs=Array.from(document.querySelectorAll('[data-oi-table-tab]')),tableImgs=Array.from(document.querySelectorAll('[data-oi-table-img][data-table]'));
  let scale=1;
  function applyScale(){mapImgs.forEach(i=>i.style.transform=`scale(${scale})`);tableImgs.forEach(i=>i.style.transform=`scale(${scale})`);}
  function openBackdrop(b){b.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
  function closeBackdrop(b){b.setAttribute('aria-hidden','true');document.body.style.overflow='';}
  function showMap(n){mapImgs.forEach(i=>i.style.display=(i.getAttribute('data-map')===String(n))?'block':'none');mapTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-map-tab')===String(n)));if(mapViewport){mapViewport.scrollTop=0;mapViewport.scrollLeft=0;}}
  function showTable(n){tableImgs.forEach(i=>i.style.display=(i.getAttribute('data-table')===String(n))?'block':'none');tableTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-table-tab')===String(n)));if(tableViewport){tableViewport.scrollTop=0;tableViewport.scrollLeft=0;}}
  if(mapBtn&&mapBackdrop&&mapCloseBtn&&mapViewport&&mapImgs.length){mapBtn.addEventListener('click',()=>openBackdrop(mapBackdrop));mapCloseBtn.addEventListener('click',()=>closeBackdrop(mapBackdrop));mapBackdrop.addEventListener('click',e=>{if(e.target===mapBackdrop)closeBackdrop(mapBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(mapBackdrop);});mapTabs.forEach(t=>t.addEventListener('click',()=>showMap(t.getAttribute('data-oi-map-tab'))));mapViewport.addEventListener('wheel',e=>{if(mapBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showMap(1);}
  if(tableBtn&&tableBackdrop&&tableCloseBtn&&tableViewport&&tableImgs.length){tableBtn.addEventListener('click',()=>openBackdrop(tableBackdrop));tableCloseBtn.addEventListener('click',()=>closeBackdrop(tableBackdrop));tableBackdrop.addEventListener('click',e=>{if(e.target===tableBackdrop)closeBackdrop(tableBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(tableBackdrop);});tableTabs.forEach(t=>t.addEventListener('click',()=>showTable(t.getAttribute('data-oi-table-tab'))));tableViewport.addEventListener('wheel',e=>{if(tableBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showTable(1);}
  applyScale();
})();
