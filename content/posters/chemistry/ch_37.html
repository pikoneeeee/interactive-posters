<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Растворимость веществ</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #831843, #9d174d, #0f172a);
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
        }
        .heading-font { font-family: 'Montserrat', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .rounded-custom { border-radius: 2.5rem; }
        .lang-btn { transition: all 0.2s; }
        .lang-btn.active { background: #f472b6; color: #1f2937; border-color: transparent; font-weight: 800; }
        .subst-btn { transition: all 0.2s; cursor: pointer; }
        .subst-btn.active { background: rgba(244, 114, 182, 0.2); border-color: #f472b6; }
        .formula-style { font-family: 'Courier New', monospace; }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="glass rounded-custom p-8 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 id="main-title" class="heading-font text-3xl md:text-5xl uppercase tracking-tight text-pink-400"></h1>
            <p id="sub-title" class="mt-2 text-white/60 font-light"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="setLang('ru')" id="btn-ru" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">RU</button>
            <button onclick="setLang('kz')" id="btn-kz" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">KZ</button>
            <button onclick="setLang('en')" id="btn-en" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">EN</button>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">
        <div class="lg:col-span-7 glass rounded-custom p-8">
            <h2 id="curve-heading" class="heading-font text-xl mb-4 opacity-80 uppercase tracking-wider"></h2>

            <svg viewBox="0 0 500 320" class="w-full">
                <line x1="60" y1="40" x2="60" y2="280" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
                <line x1="60" y1="280" x2="460" y2="280" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
                <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
                    <line x1="60" y1="220" x2="460" y2="220"/>
                    <line x1="60" y1="160" x2="460" y2="160"/>
                    <line x1="60" y1="100" x2="460" y2="100"/>
                    <line x1="60" y1="40" x2="460" y2="40"/>
                </g>
                <g fill="rgba(255,255,255,0.5)" font-size="11" text-anchor="end">
                    <text x="55" y="285">0</text>
                    <text x="55" y="225">50</text>
                    <text x="55" y="165">100</text>
                    <text x="55" y="105">150</text>
                    <text x="55" y="45">200</text>
                </g>
                <g fill="rgba(255,255,255,0.5)" font-size="11" text-anchor="middle">
                    <text x="60" y="298">0</text>
                    <text x="160" y="298">20</text>
                    <text x="260" y="298">40</text>
                    <text x="360" y="298">60</text>
                    <text x="460" y="298">100 °C</text>
                </g>
                <text id="svg-y-label" x="20" y="160" text-anchor="middle" fill="#fbcfe8" font-size="12" font-weight="bold" transform="rotate(-90 20 160)"></text>
                <text id="svg-x-label" x="260" y="318" text-anchor="middle" fill="#fbcfe8" font-size="12" font-weight="bold"></text>
                <path id="curve-KNO3" d="" fill="none" stroke="#fb7185" stroke-width="3"/>
                <path id="curve-NaCl" d="" fill="none" stroke="#fbbf24" stroke-width="3"/>
                <path id="curve-Ca" d="" fill="none" stroke="#60a5fa" stroke-width="3"/>
                <g id="curve-labels"></g>
            </svg>

            <div class="grid grid-cols-3 gap-3 mt-4">
                <div class="bg-white/5 rounded-xl p-3 border border-white/10 flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full" style="background:#fb7185"></div>
                    <div>
                        <div class="text-sm font-bold formula-style">KNO₃</div>
                        <div id="lab-KNO3" class="text-xs text-white/60"></div>
                    </div>
                </div>
                <div class="bg-white/5 rounded-xl p-3 border border-white/10 flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full" style="background:#fbbf24"></div>
                    <div>
                        <div class="text-sm font-bold formula-style">NaCl</div>
                        <div id="lab-NaCl" class="text-xs text-white/60"></div>
                    </div>
                </div>
                <div class="bg-white/5 rounded-xl p-3 border border-white/10 flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full" style="background:#60a5fa"></div>
                    <div>
                        <div class="text-sm font-bold formula-style">Ca(OH)₂</div>
                        <div id="lab-Ca" class="text-xs text-white/60"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-5 glass rounded-custom p-8 border-l-4 border-pink-500">
            <h3 id="types-heading" class="heading-font text-xl mb-4 text-pink-300 uppercase tracking-wider"></h3>
            <div class="space-y-3 mb-5">
                <div onclick="setType('soluble')" id="type-soluble" class="subst-btn bg-white/5 rounded-2xl p-4 border border-white/10">
                    <div class="flex items-center gap-3 mb-1">
                        <div class="text-2xl">✅</div>
                        <h4 id="type1-title" class="font-bold text-pink-300"></h4>
                    </div>
                    <p id="type1-desc" class="text-white/70 text-sm leading-relaxed"></p>
                </div>
                <div onclick="setType('low')" id="type-low" class="subst-btn bg-white/5 rounded-2xl p-4 border border-white/10">
                    <div class="flex items-center gap-3 mb-1">
                        <div class="text-2xl">⚠️</div>
                        <h4 id="type2-title" class="font-bold text-pink-300"></h4>
                    </div>
                    <p id="type2-desc" class="text-white/70 text-sm leading-relaxed"></p>
                </div>
                <div onclick="setType('insoluble')" id="type-insoluble" class="subst-btn bg-white/5 rounded-2xl p-4 border border-white/10">
                    <div class="flex items-center gap-3 mb-1">
                        <div class="text-2xl">❌</div>
                        <h4 id="type3-title" class="font-bold text-pink-300"></h4>
                    </div>
                    <p id="type3-desc" class="text-white/70 text-sm leading-relaxed"></p>
                </div>
            </div>
            <div class="bg-black/30 rounded-2xl p-4 border border-pink-500/20">
                <div id="examples-label" class="text-xs text-pink-300 uppercase tracking-widest mb-2"></div>
                <div id="examples-text" class="text-white/85 leading-relaxed formula-style"></div>
            </div>
        </div>
    </main>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
        <div class="glass rounded-custom p-8 hover:bg-pink-500/10 transition-colors">
            <div class="w-14 h-14 bg-pink-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🌡️</div>
            <h4 id="card1-title" class="heading-font text-2xl mb-3 text-pink-300"></h4>
            <p id="card1-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-pink-500/10 transition-colors">
            <div class="w-14 h-14 bg-pink-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">💨</div>
            <h4 id="card2-title" class="heading-font text-2xl mb-3 text-pink-300"></h4>
            <p id="card2-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-pink-500/10 transition-colors">
            <div class="w-14 h-14 bg-pink-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🧬</div>
            <h4 id="card3-title" class="heading-font text-2xl mb-3 text-pink-300"></h4>
            <p id="card3-desc" class="text-white/70 leading-relaxed"></p>
        </div>
    </section>

    <footer class="glass rounded-custom p-10 text-center">
        <p id="quote-text" class="text-2xl md:text-3xl italic font-light leading-snug mb-4"></p>
        <cite id="quote-author" class="text-pink-400 font-bold uppercase tracking-widest text-sm"></cite>
    </footer>

    <script>
        const translations = {
            ru: {
                title: "Растворимость веществ",
                subtitle: "Сколько вещества можно растворить в воде",
                curveHeading: "Кривые растворимости",
                yLabel: "г вещества на 100 г воды",
                xLabel: "Температура",
                labels: {
                    KNO3: "Растёт сильно с T",
                    NaCl: "Почти не меняется",
                    Ca:   "Уменьшается с T"
                },
                typesHeading: "Классификация по растворимости",
                types: {
                    soluble:    { title: "Растворимые", desc: "Более 1 г растворяется в 100 г воды." },
                    low:        { title: "Малорастворимые", desc: "От 0,01 до 1 г в 100 г воды." },
                    insoluble:  { title: "Практически нерастворимые", desc: "Менее 0,01 г в 100 г воды." }
                },
                examplesLabel: "Примеры",
                examples: {
                    soluble:    "NaCl, KNO₃, NaOH, HCl, H₂SO₄, сахар, спирт",
                    low:        "Ca(OH)₂, CaSO₄, PbCl₂, Ag₂SO₄",
                    insoluble:  "AgCl, BaSO₄, CaCO₃, Cu(OH)₂, Fe₂S₃"
                },
                cards: [
                    { title: "Влияние температуры", desc: "Для большинства твёрдых веществ растворимость растёт с температурой (KNO₃). Но для гидроксида кальция и сульфата лития — уменьшается." },
                    { title: "Газы и давление", desc: "Растворимость газов уменьшается при нагревании и растёт с давлением. Поэтому при открытии бутылки с газировкой выходит CO₂." },
                    { title: "Биология", desc: "Кислород плохо растворим в воде, но именно растворённый O₂ используют рыбы для дыхания. В тёплой воде O₂ меньше — рыба «задыхается»." }
                ],
                quote: "«Хороший растворитель — это лучший детектив химика»",
                author: "Принцип лабораторной практики"
            },
            kz: {
                title: "Заттардың ерігіштігі",
                subtitle: "Суда заттың қанша мөлшері еритіні",
                curveHeading: "Ерігіштік қисықтары",
                yLabel: "100 г судағы заттың грамы",
                xLabel: "Температура",
                labels: {
                    KNO3: "T-мен күрт өседі",
                    NaCl: "Дерлік өзгермейді",
                    Ca:   "T-мен азаяды"
                },
                typesHeading: "Ерігіштік бойынша жіктеу",
                types: {
                    soluble:    { title: "Еритін", desc: "100 г суда 1 г-нан көп ериді." },
                    low:        { title: "Аз еритін", desc: "100 г суда 0,01–1 г ериді." },
                    insoluble:  { title: "Іс жүзінде ерімейтін", desc: "100 г суда 0,01 г-нан аз ериді." }
                },
                examplesLabel: "Мысалдар",
                examples: {
                    soluble:    "NaCl, KNO₃, NaOH, HCl, H₂SO₄, қант, спирт",
                    low:        "Ca(OH)₂, CaSO₄, PbCl₂, Ag₂SO₄",
                    insoluble:  "AgCl, BaSO₄, CaCO₃, Cu(OH)₂, Fe₂S₃"
                },
                cards: [
                    { title: "Температураның әсері", desc: "Қатты заттардың көпшілігінде ерігіштік температурамен өседі (KNO₃). Бірақ кальций гидроксиді мен литий сульфаты үшін — азаяды." },
                    { title: "Газдар мен қысым", desc: "Газдардың ерігіштігі қыздырғанда азаяды, қысыммен өседі. Сондықтан газдалған суы бар бөтелкені ашқанда CO₂ шығады." },
                    { title: "Биология", desc: "Оттегі суда нашар ериді, бірақ балық тыныс алу үшін дәл еріген O₂-ні пайдаланады. Жылы суда O₂ аз — балық «тұншығады»." }
                ],
                quote: "«Жақсы еріткіш — химиктің ең жақсы детективі»",
                author: "Зертханалық тәжірибе қағидасы"
            },
            en: {
                title: "Solubility of substances",
                subtitle: "How much of a substance dissolves in water",
                curveHeading: "Solubility curves",
                yLabel: "g per 100 g of water",
                xLabel: "Temperature",
                labels: {
                    KNO3: "Rises sharply with T",
                    NaCl: "Almost unchanged",
                    Ca:   "Decreases with T"
                },
                typesHeading: "Classification by solubility",
                types: {
                    soluble:    { title: "Soluble", desc: "More than 1 g dissolves in 100 g of water." },
                    low:        { title: "Slightly soluble", desc: "From 0.01 to 1 g in 100 g of water." },
                    insoluble:  { title: "Practically insoluble", desc: "Less than 0.01 g in 100 g of water." }
                },
                examplesLabel: "Examples",
                examples: {
                    soluble:    "NaCl, KNO₃, NaOH, HCl, H₂SO₄, sugar, alcohol",
                    low:        "Ca(OH)₂, CaSO₄, PbCl₂, Ag₂SO₄",
                    insoluble:  "AgCl, BaSO₄, CaCO₃, Cu(OH)₂, Fe₂S₃"
                },
                cards: [
                    { title: "Effect of temperature", desc: "For most solids, solubility grows with temperature (KNO₃). But calcium hydroxide and lithium sulfate behave the opposite way." },
                    { title: "Gases and pressure", desc: "Gas solubility falls as temperature rises and grows with pressure. That is why opening a fizzy drink releases CO₂." },
                    { title: "Biology", desc: "Oxygen is poorly soluble in water, yet dissolved O₂ is exactly what fish breathe. In warm water there is less O₂ — fish suffocate." }
                ],
                quote: "«A good solvent is the chemist's best detective»",
                author: "Lab-practice principle"
            }
        };

        let currentLang = 'ru';
        let currentType = 'soluble';

        function curvePath(values) {
            const pts = values.map(([x,y]) => {
                const px = 60 + (x/100) * 400;
                const py = 280 - (y/200) * 240;
                return `${px},${Math.max(40, py)}`;
            });
            return 'M ' + pts.join(' L ');
        }

        function drawCurves() {
            document.getElementById('curve-KNO3').setAttribute('d', curvePath([[0,13],[20,32],[40,64],[60,109],[80,168],[100,246]]));
            document.getElementById('curve-NaCl').setAttribute('d', curvePath([[0,36],[20,36],[40,36.5],[60,37],[80,38],[100,39.2]]));
            document.getElementById('curve-Ca').setAttribute('d', curvePath([[0,1.85],[20,1.7],[40,1.4],[60,1.2],[80,0.95],[100,0.77]]));
        }

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            try { localStorage.setItem('poster_lang', lang); } catch(e){}
            updateUI();
        }

        function setType(t) {
            currentType = t;
            document.querySelectorAll('.subst-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('type-' + t).classList.add('active');
            const tr = translations[currentLang];
            document.getElementById('examples-text').textContent = tr.examples[t];
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('sub-title').textContent = t.subtitle;
            document.getElementById('curve-heading').textContent = t.curveHeading;
            document.getElementById('svg-y-label').textContent = t.yLabel;
            document.getElementById('svg-x-label').textContent = t.xLabel;
            document.getElementById('lab-KNO3').textContent = t.labels.KNO3;
            document.getElementById('lab-NaCl').textContent = t.labels.NaCl;
            document.getElementById('lab-Ca').textContent = t.labels.Ca;
            document.getElementById('types-heading').textContent = t.typesHeading;
            document.getElementById('type1-title').textContent = t.types.soluble.title;
            document.getElementById('type1-desc').textContent = t.types.soluble.desc;
            document.getElementById('type2-title').textContent = t.types.low.title;
            document.getElementById('type2-desc').textContent = t.types.low.desc;
            document.getElementById('type3-title').textContent = t.types.insoluble.title;
            document.getElementById('type3-desc').textContent = t.types.insoluble.desc;
            document.getElementById('examples-label').textContent = t.examplesLabel;
            document.getElementById('examples-text').textContent = t.examples[currentType];
            for (let i = 0; i < 3; i++) {
                document.getElementById('card' + (i+1) + '-title').textContent = t.cards[i].title;
                document.getElementById('card' + (i+1) + '-desc').textContent = t.cards[i].desc;
            }
            document.getElementById('quote-text').textContent = t.quote;
            document.getElementById('quote-author').textContent = t.author;
        }

        window.onload = () => {
            drawCurves();
            let s = 'ru';
            try { s = localStorage.getItem('poster_lang') || 'ru'; } catch(e){}
            if (s === 'kk') s = 'kz';
            setType('soluble');
            setLang(s);
        };
    </script>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>

<script data-oi-map-overlay>
(function(){
  const mapBtn=document.querySelector('[data-oi-map-btn]'),mapBackdrop=document.querySelector('[data-oi-map-backdrop]'),mapCloseBtn=document.querySelector('[data-oi-map-close]'),mapViewport=document.querySelector('[data-oi-map-viewport]'),mapTabs=Array.from(document.querySelectorAll('[data-oi-map-tab]')),mapImgs=Array.from(document.querySelectorAll('[data-oi-map-img][data-map]'));
  const tableBtn=document.querySelector('[data-oi-table-btn]'),tableBackdrop=document.querySelector('[data-oi-table-backdrop]'),tableCloseBtn=document.querySelector('[data-oi-table-close]'),tableViewport=document.querySelector('[data-oi-table-viewport]'),tableTabs=Array.from(document.querySelectorAll('[data-oi-table-tab]')),tableImgs=Array.from(document.querySelectorAll('[data-oi-table-img][data-table]'));
  let scale=1;
  function applyScale(){mapImgs.forEach(i=>i.style.transform=`scale(${scale})`);tableImgs.forEach(i=>i.style.transform=`scale(${scale})`);}
  function openBackdrop(b){b.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
  function closeBackdrop(b){b.setAttribute('aria-hidden','true');document.body.style.overflow='';}
  function showMap(n){mapImgs.forEach(i=>i.style.display=(i.getAttribute('data-map')===String(n))?'block':'none');mapTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-map-tab')===String(n)));if(mapViewport){mapViewport.scrollTop=0;mapViewport.scrollLeft=0;}}
  function showTable(n){tableImgs.forEach(i=>i.style.display=(i.getAttribute('data-table')===String(n))?'block':'none');tableTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-table-tab')===String(n)));if(tableViewport){tableViewport.scrollTop=0;tableViewport.scrollLeft=0;}}
  if(mapBtn&&mapBackdrop&&mapCloseBtn&&mapViewport&&mapImgs.length){mapBtn.addEventListener('click',()=>openBackdrop(mapBackdrop));mapCloseBtn.addEventListener('click',()=>closeBackdrop(mapBackdrop));mapBackdrop.addEventListener('click',e=>{if(e.target===mapBackdrop)closeBackdrop(mapBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(mapBackdrop);});mapTabs.forEach(t=>t.addEventListener('click',()=>showMap(t.getAttribute('data-oi-map-tab'))));mapViewport.addEventListener('wheel',e=>{if(mapBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showMap(1);}
  if(tableBtn&&tableBackdrop&&tableCloseBtn&&tableViewport&&tableImgs.length){tableBtn.addEventListener('click',()=>openBackdrop(tableBackdrop));tableCloseBtn.addEventListener('click',()=>closeBackdrop(tableBackdrop));tableBackdrop.addEventListener('click',e=>{if(e.target===tableBackdrop)closeBackdrop(tableBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(tableBackdrop);});tableTabs.forEach(t=>t.addEventListener('click',()=>showTable(t.getAttribute('data-oi-table-tab'))));tableViewport.addEventListener('wheel',e=>{if(tableBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showTable(1);}
  applyScale();
})();
</script>
</body>
</html>
