<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Соли: состав и свойства</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #7c2d12, #c2410c, #1c1917);
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
        }
        .heading-font { font-family: 'Montserrat', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .rounded-custom { border-radius: 2.5rem; }
        .lang-btn { transition: all 0.2s; }
        .lang-btn.active { background: #fb923c; color: #1c1917; border-color: transparent; font-weight: 800; }
        .salt-btn { transition: all 0.2s; cursor: pointer; }
        .salt-btn:hover { transform: translateY(-3px); }
        .salt-btn.active { background: rgba(251, 146, 60, 0.2); border-color: #fb923c; }
        .formula-style { font-family: 'Courier New', monospace; }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="glass rounded-custom p-8 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 id="main-title" class="heading-font text-3xl md:text-5xl uppercase tracking-tight text-orange-400"></h1>
            <p id="sub-title" class="mt-2 text-white/60 font-light"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="setLang('ru')" id="btn-ru" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">RU</button>
            <button onclick="setLang('kz')" id="btn-kz" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">KZ</button>
            <button onclick="setLang('en')" id="btn-en" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">EN</button>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">
        <div class="lg:col-span-5 glass rounded-custom p-8 flex flex-col items-center">
            <h2 id="lattice-heading" class="heading-font text-xl mb-4 opacity-80 uppercase tracking-wider self-start"></h2>

            <svg viewBox="0 0 320 280" class="w-full max-w-[320px]">
                <g>
                    <circle cx="80"  cy="70"  r="22" fill="#fb923c" stroke="#1c1917" stroke-width="2"/>
                    <circle cx="160" cy="70"  r="18" fill="#22d3ee" stroke="#1c1917" stroke-width="2"/>
                    <circle cx="240" cy="70"  r="22" fill="#fb923c" stroke="#1c1917" stroke-width="2"/>
                    <circle cx="80"  cy="150" r="18" fill="#22d3ee" stroke="#1c1917" stroke-width="2"/>
                    <circle cx="160" cy="150" r="22" fill="#fb923c" stroke="#1c1917" stroke-width="2"/>
                    <circle cx="240" cy="150" r="18" fill="#22d3ee" stroke="#1c1917" stroke-width="2"/>
                    <circle cx="80"  cy="230" r="22" fill="#fb923c" stroke="#1c1917" stroke-width="2"/>
                    <circle cx="160" cy="230" r="18" fill="#22d3ee" stroke="#1c1917" stroke-width="2"/>
                    <circle cx="240" cy="230" r="22" fill="#fb923c" stroke="#1c1917" stroke-width="2"/>
                    <text x="80" y="76" text-anchor="middle" fill="white" font-weight="bold" font-size="14">Na⁺</text>
                    <text x="160" y="74" text-anchor="middle" fill="white" font-weight="bold" font-size="12">Cl⁻</text>
                    <text x="240" y="76" text-anchor="middle" fill="white" font-weight="bold" font-size="14">Na⁺</text>
                    <text x="80" y="154" text-anchor="middle" fill="white" font-weight="bold" font-size="12">Cl⁻</text>
                    <text x="160" y="156" text-anchor="middle" fill="white" font-weight="bold" font-size="14">Na⁺</text>
                    <text x="240" y="154" text-anchor="middle" fill="white" font-weight="bold" font-size="12">Cl⁻</text>
                    <text x="80" y="236" text-anchor="middle" fill="white" font-weight="bold" font-size="14">Na⁺</text>
                    <text x="160" y="234" text-anchor="middle" fill="white" font-weight="bold" font-size="12">Cl⁻</text>
                    <text x="240" y="236" text-anchor="middle" fill="white" font-weight="bold" font-size="14">Na⁺</text>
                </g>
            </svg>
            <div id="lattice-caption" class="text-center text-white/70 mt-3 leading-relaxed"></div>

            <div class="bg-black/30 rounded-2xl p-5 mt-5 border border-orange-500/20 text-center w-full">
                <div id="general-label" class="text-xs text-orange-300 uppercase tracking-widest mb-2"></div>
                <div class="text-3xl formula-style text-orange-300 font-bold">M ⋅ Acid-Residue</div>
                <div id="general-legend" class="text-xs text-white/60 mt-2"></div>
            </div>
        </div>

        <div class="lg:col-span-7 glass rounded-custom p-8 border-l-4 border-orange-400">
            <h2 id="examples-heading" class="heading-font text-xl mb-4 text-orange-300 uppercase tracking-wider"></h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                <div onclick="selectSalt('NaCl')" id="salt-NaCl" class="salt-btn glass rounded-2xl p-4 text-center border border-white/10">
                    <div class="text-xl font-bold formula-style text-orange-300">NaCl</div>
                    <div id="salt-NaCl-name" class="text-xs text-white/60 mt-1"></div>
                </div>
                <div onclick="selectSalt('CaCO3')" id="salt-CaCO3" class="salt-btn glass rounded-2xl p-4 text-center border border-white/10">
                    <div class="text-xl font-bold formula-style text-orange-300">CaCO₃</div>
                    <div id="salt-CaCO3-name" class="text-xs text-white/60 mt-1"></div>
                </div>
                <div onclick="selectSalt('CuSO4')" id="salt-CuSO4" class="salt-btn glass rounded-2xl p-4 text-center border border-white/10">
                    <div class="text-xl font-bold formula-style text-orange-300">CuSO₄</div>
                    <div id="salt-CuSO4-name" class="text-xs text-white/60 mt-1"></div>
                </div>
                <div onclick="selectSalt('NaHCO3')" id="salt-NaHCO3" class="salt-btn glass rounded-2xl p-4 text-center border border-white/10">
                    <div class="text-xl font-bold formula-style text-orange-300">NaHCO₃</div>
                    <div id="salt-NaHCO3-name" class="text-xs text-white/60 mt-1"></div>
                </div>
            </div>

            <h3 id="salt-title" class="heading-font text-2xl mb-3 text-orange-300"></h3>
            <p id="salt-text" class="text-white/85 leading-relaxed mb-4"></p>

            <h4 id="reactions-label" class="text-orange-300 text-sm uppercase tracking-widest mb-2"></h4>
            <div id="reactions-box" class="space-y-2"></div>
        </div>
    </main>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
        <div class="glass rounded-custom p-8 hover:bg-orange-500/10 transition-colors">
            <div class="w-14 h-14 bg-orange-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🧬</div>
            <h4 id="card1-title" class="heading-font text-2xl mb-3 text-orange-300"></h4>
            <p id="card1-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-orange-500/10 transition-colors">
            <div class="w-14 h-14 bg-orange-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🧪</div>
            <h4 id="card2-title" class="heading-font text-2xl mb-3 text-orange-300"></h4>
            <p id="card2-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-orange-500/10 transition-colors">
            <div class="w-14 h-14 bg-orange-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🌾</div>
            <h4 id="card3-title" class="heading-font text-2xl mb-3 text-orange-300"></h4>
            <p id="card3-desc" class="text-white/70 leading-relaxed"></p>
        </div>
    </section>

    <footer class="glass rounded-custom p-10 text-center">
        <p id="quote-text" class="text-2xl md:text-3xl italic font-light leading-snug mb-4"></p>
        <cite id="quote-author" class="text-orange-400 font-bold uppercase tracking-widest text-sm"></cite>
    </footer>

    <script>
        const translations = {
            ru: {
                title: "Соли: состав и свойства",
                subtitle: "Кристаллы, которые делают мир солёным, цветным и питательным",
                latticeHeading: "Ионная решётка",
                latticeCaption: "Соль — это упорядоченная решётка из катионов металла (Na⁺) и анионов кислотного остатка (Cl⁻).",
                generalLabel: "Состав соли",
                generalLegend: "Соль = металл (катион) + кислотный остаток (анион)",
                examplesHeading: "Знакомые соли",
                salts: {
                    NaCl:   { name: "Поваренная соль", title: "Хлорид натрия NaCl", text: "Главная соль на нашей кухне и в организме. Регулирует давление крови, передаёт нервные импульсы. Добывают из морской воды или соляных шахт.", reactions: ["NaOH + HCl → NaCl + H₂O", "2 NaCl → 2 Na + Cl₂ (электролиз расплава)"] },
                    CaCO3:  { name: "Карбонат кальция", title: "Карбонат кальция CaCO₃", text: "Мел, мрамор, известняк, скорлупа яиц — всё это CaCO₃. Из него строят дома, делают цемент и зубную пасту.", reactions: ["CaCO₃ → CaO + CO₂↑ (обжиг)", "CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂↑"] },
                    CuSO4:  { name: "Медный купорос", title: "Сульфат меди(II) CuSO₄", text: "Ярко-синие кристаллы CuSO₄·5H₂O. Применяется в сельском хозяйстве как фунгицид и в гальванопластике.", reactions: ["CuSO₄ + Fe → FeSO₄ + Cu (вытеснение)", "CuSO₄ + 2 NaOH → Cu(OH)₂↓ + Na₂SO₄"] },
                    NaHCO3: { name: "Пищевая сода", title: "Гидрокарбонат натрия NaHCO₃", text: "Кислая соль, белый порошок. Используется в выпечке (разрыхлитель), от изжоги и для тушения пожаров.", reactions: ["2 NaHCO₃ → Na₂CO₃ + H₂O + CO₂↑ (нагрев)", "NaHCO₃ + HCl → NaCl + H₂O + CO₂↑"] }
                },
                reactionsLabel: "Характерные реакции",
                cards: [
                    { title: "Виды солей", desc: "Средние (NaCl), кислые (NaHCO₃ — есть атом H), основные (CuOHCl — есть группа OH), двойные (KAl(SO₄)₂) и комплексные (K₄[Fe(CN)₆])." },
                    { title: "Главные свойства", desc: "Реагируют с кислотами, щелочами и другими солями. Растворимые — диссоциируют на ионы. Многие при нагревании разлагаются на оксид и кислотный оксид." },
                    { title: "Где встречаются", desc: "Соли — это и наша еда (NaCl), и удобрения (KNO₃, NH₄NO₃), и стройматериалы (CaSO₄ — гипс), и физраствор в больнице. Без них нет цивилизации." }
                ],
                quote: "«Соль земли — это не только метафора, но и точный химический факт»",
                author: "Народная мудрость"
            },
            kz: {
                title: "Тұздар: құрамы және қасиеттері",
                subtitle: "Әлемді тұзды, түрлі-түсті әрі қоректі қылатын кристалдар",
                latticeHeading: "Ион тор",
                latticeCaption: "Тұз — метал катиондары (Na⁺) мен қышқыл қалдық аниондарының (Cl⁻) ретімен орналасқан торы.",
                generalLabel: "Тұз құрамы",
                generalLegend: "Тұз = метал (катион) + қышқыл қалдық (анион)",
                examplesHeading: "Таныс тұздар",
                salts: {
                    NaCl:   { name: "Ас тұзы", title: "Натрий хлориді NaCl", text: "Біздің асүй мен ағзамыздағы басты тұз. Қан қысымын реттейді, нерв импульстерін жеткізеді. Теңіз суынан немесе тұз шахталарынан алынады.", reactions: ["NaOH + HCl → NaCl + H₂O", "2 NaCl → 2 Na + Cl₂ (балқыма электролизі)"] },
                    CaCO3:  { name: "Кальций карбонаты", title: "Кальций карбонаты CaCO₃", text: "Бор, мәрмәр, әктас, жұмыртқа қабығы — бәрі CaCO₃. Одан үй салады, цемент пен тіс пастасын жасайды.", reactions: ["CaCO₃ → CaO + CO₂↑ (күйдіру)", "CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂↑"] },
                    CuSO4:  { name: "Мыс купоросы", title: "Мыс(II) сульфаты CuSO₄", text: "Ашық көк кристалдар CuSO₄·5H₂O. Ауыл шаруашылығында фунгицид ретінде, гальваникада қолданылады.", reactions: ["CuSO₄ + Fe → FeSO₄ + Cu (ығыстыру)", "CuSO₄ + 2 NaOH → Cu(OH)₂↓ + Na₂SO₄"] },
                    NaHCO3: { name: "Ас содасы", title: "Натрий гидрокарбонаты NaHCO₃", text: "Қышқыл тұз, ақ ұнтақ. Тоқашта (борпылдатқыш), асқазан ауыруы кезінде, өрт сөндіруде қолданылады.", reactions: ["2 NaHCO₃ → Na₂CO₃ + H₂O + CO₂↑ (қыздыру)", "NaHCO₃ + HCl → NaCl + H₂O + CO₂↑"] }
                },
                reactionsLabel: "Тән реакциялар",
                cards: [
                    { title: "Тұз түрлері", desc: "Орташа (NaCl), қышқыл (NaHCO₃ — H атомы бар), негіздік (CuOHCl — OH тобы бар), қос (KAl(SO₄)₂) және кешен (K₄[Fe(CN)₆])." },
                    { title: "Негізгі қасиеттері", desc: "Қышқыл, сілті, басқа тұздармен әрекеттеседі. Еритіндері — иондарға диссоциацияланады. Көбі қыздырғанда оксидке және қышқылдық оксидке ыдырайды." },
                    { title: "Қайда кездеседі", desc: "Тұздар — біздің тағамымыз (NaCl), тыңайтқыш (KNO₃, NH₄NO₃), құрылыс материалы (CaSO₄ — гипс), ауруханадағы физраствор. Олардың арқасында өркениет бар." }
                ],
                quote: "«Жердің тұзы — тек метафора емес, дәл химиялық факт»",
                author: "Халық даналығы"
            },
            en: {
                title: "Salts: composition and properties",
                subtitle: "Crystals that make our world salty, colourful and nourishing",
                latticeHeading: "Ionic lattice",
                latticeCaption: "A salt is an ordered lattice of metal cations (Na⁺) and acid-residue anions (Cl⁻).",
                generalLabel: "Composition",
                generalLegend: "Salt = metal (cation) + acid residue (anion)",
                examplesHeading: "Familiar salts",
                salts: {
                    NaCl:   { name: "Table salt", title: "Sodium chloride NaCl", text: "The main salt in our kitchen and bodies. Regulates blood pressure and nerve impulses. Mined from sea water or salt mines.", reactions: ["NaOH + HCl → NaCl + H₂O", "2 NaCl → 2 Na + Cl₂ (electrolysis of melt)"] },
                    CaCO3:  { name: "Calcium carbonate", title: "Calcium carbonate CaCO₃", text: "Chalk, marble, limestone and eggshell are all CaCO₃. Used for buildings, cement and toothpaste.", reactions: ["CaCO₃ → CaO + CO₂↑ (calcination)", "CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂↑"] },
                    CuSO4:  { name: "Copper sulfate", title: "Copper(II) sulfate CuSO₄", text: "Bright-blue crystals CuSO₄·5H₂O. Used in agriculture as a fungicide and in electroplating.", reactions: ["CuSO₄ + Fe → FeSO₄ + Cu (displacement)", "CuSO₄ + 2 NaOH → Cu(OH)₂↓ + Na₂SO₄"] },
                    NaHCO3: { name: "Baking soda", title: "Sodium bicarbonate NaHCO₃", text: "An acidic salt, white powder. Used in baking (leavening), as an antacid and in fire extinguishers.", reactions: ["2 NaHCO₃ → Na₂CO₃ + H₂O + CO₂↑ (heating)", "NaHCO₃ + HCl → NaCl + H₂O + CO₂↑"] }
                },
                reactionsLabel: "Typical reactions",
                cards: [
                    { title: "Kinds of salts", desc: "Neutral (NaCl), acidic (NaHCO₃ — has an H atom), basic (CuOHCl — has an OH group), double (KAl(SO₄)₂) and complex (K₄[Fe(CN)₆])." },
                    { title: "Main properties", desc: "React with acids, alkalis and other salts. Soluble salts dissociate into ions. Many decompose on heating into oxide + acid oxide." },
                    { title: "Where they occur", desc: "Salts are our food (NaCl), fertilisers (KNO₃, NH₄NO₃), building materials (CaSO₄ gypsum) and hospital saline. Civilisation rests on them." }
                ],
                quote: "«The salt of the earth is not just a metaphor — it is an exact chemical fact»",
                author: "Folk wisdom"
            }
        };

        let currentLang = 'ru';
        let currentSalt = 'NaCl';

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            try { localStorage.setItem('poster_lang', lang); } catch(e){}
            updateUI();
        }

        function selectSalt(s) {
            currentSalt = s;
            document.querySelectorAll('.salt-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('salt-' + s).classList.add('active');
            renderSalt();
        }

        function renderSalt() {
            const t = translations[currentLang];
            const s = t.salts[currentSalt];
            document.getElementById('salt-title').textContent = s.title;
            document.getElementById('salt-text').textContent = s.text;
            document.getElementById('reactions-box').innerHTML = s.reactions.map(r =>
                `<div class="bg-white/5 rounded-xl p-3 border border-white/10 formula-style text-white/90">${r}</div>`
            ).join('');
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('sub-title').textContent = t.subtitle;
            document.getElementById('lattice-heading').textContent = t.latticeHeading;
            document.getElementById('lattice-caption').textContent = t.latticeCaption;
            document.getElementById('general-label').textContent = t.generalLabel;
            document.getElementById('general-legend').textContent = t.generalLegend;
            document.getElementById('examples-heading').textContent = t.examplesHeading;
            ['NaCl','CaCO3','CuSO4','NaHCO3'].forEach(s => {
                document.getElementById('salt-' + s + '-name').textContent = t.salts[s].name;
            });
            document.getElementById('reactions-label').textContent = t.reactionsLabel;
            renderSalt();
            for (let i = 0; i < 3; i++) {
                document.getElementById('card' + (i+1) + '-title').textContent = t.cards[i].title;
                document.getElementById('card' + (i+1) + '-desc').textContent = t.cards[i].desc;
            }
            document.getElementById('quote-text').textContent = t.quote;
            document.getElementById('quote-author').textContent = t.author;
        }

        window.onload = () => {
            let s = 'ru';
            try { s = localStorage.getItem('poster_lang') || 'ru'; } catch(e){}
            if (s === 'kk') s = 'kz';
            selectSalt('NaCl');
            setLang(s);
        };
    </script>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>

.oi-map-tab{min-width:36px;height:34px;padding:0 10px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.35);color:#fff;cursor:pointer;font:600 14px system-ui,-apple-system,Segoe UI,Roboto,Arial;}
.oi-map-tab.is-active{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.45);}
.oi-map-hint{pointer-events:none;color:#fff;opacity:.85;font:12px/1.2 system-ui,-apple-system,Segoe UI,Roboto,Arial;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);padding:8px 10px;border-radius:10px;}
</style>

<button class="oi-map-btn" style="display:none" type="button" data-oi-map-btn>🗺️ Карта</button>
<button class="oi-table-btn" type="button" data-oi-table-btn>🧪 Таблица</button>

<div class="oi-map-backdrop" aria-hidden="true" data-oi-map-backdrop>
  <div class="oi-map-modal" role="dialog" aria-modal="true" aria-label="Карта">
    <button class="oi-map-close" type="button" aria-label="Закрыть" data-oi-map-close>×</button>
    <div class="oi-map-toolbar"><div class="oi-map-tabs"><button type="button" class="oi-map-tab is-active" data-oi-map-tab="1">1</button></div><div class="oi-map-hint">Колёсико/трекпад — зум • Esc — закрыть</div></div>
    <div class="oi-map-viewport" data-oi-map-viewport><img class="oi-map-img" data-oi-map-img data-map="1" src="../../assets/maps/mendeleev_1.png" alt="map 1" style="display:block;"></div>
  </div>
</div>

<div class="oi-map-backdrop" aria-hidden="true" data-oi-table-backdrop>
  <div class="oi-map-modal" role="dialog" aria-modal="true" aria-label="Таблица Менделеева">
    <button class="oi-map-close" type="button" aria-label="Закрыть" data-oi-table-close>×</button>
    <div class="oi-map-toolbar"><div class="oi-map-tabs"><button type="button" class="oi-map-tab is-active" data-oi-table-tab="1">1</button><button type="button" class="oi-map-tab" data-oi-table-tab="2">2</button></div><div class="oi-map-hint">Таблица Менделеева • Esc — закрыть</div></div>
    <div class="oi-map-viewport" data-oi-table-viewport><img class="oi-map-img" data-oi-table-img data-table="1" src="../../assets/maps/mendeleev_1.png" alt="table 1" style="display:block;"><img class="oi-map-img" data-oi-table-img data-table="2" src="../../assets/maps/mendeleev_2.png" alt="table 2" style="display:none;"></div>
  </div>
</div>

<script data-oi-map-overlay>
(function(){
  const mapBtn=document.querySelector('[data-oi-map-btn]'),mapBackdrop=document.querySelector('[data-oi-map-backdrop]'),mapCloseBtn=document.querySelector('[data-oi-map-close]'),mapViewport=document.querySelector('[data-oi-map-viewport]'),mapTabs=Array.from(document.querySelectorAll('[data-oi-map-tab]')),mapImgs=Array.from(document.querySelectorAll('[data-oi-map-img][data-map]'));
  const tableBtn=document.querySelector('[data-oi-table-btn]'),tableBackdrop=document.querySelector('[data-oi-table-backdrop]'),tableCloseBtn=document.querySelector('[data-oi-table-close]'),tableViewport=document.querySelector('[data-oi-table-viewport]'),tableTabs=Array.from(document.querySelectorAll('[data-oi-table-tab]')),tableImgs=Array.from(document.querySelectorAll('[data-oi-table-img][data-table]'));
  let scale=1;
  function applyScale(){mapImgs.forEach(i=>i.style.transform=`scale(${scale})`);tableImgs.forEach(i=>i.style.transform=`scale(${scale})`);}
  function openBackdrop(b){b.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
  function closeBackdrop(b){b.setAttribute('aria-hidden','true');document.body.style.overflow='';}
  function showMap(n){mapImgs.forEach(i=>i.style.display=(i.getAttribute('data-map')===String(n))?'block':'none');mapTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-map-tab')===String(n)));if(mapViewport){mapViewport.scrollTop=0;mapViewport.scrollLeft=0;}}
  function showTable(n){tableImgs.forEach(i=>i.style.display=(i.getAttribute('data-table')===String(n))?'block':'none');tableTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-table-tab')===String(n)));if(tableViewport){tableViewport.scrollTop=0;tableViewport.scrollLeft=0;}}
  if(mapBtn&&mapBackdrop&&mapCloseBtn&&mapViewport&&mapImgs.length){mapBtn.addEventListener('click',()=>openBackdrop(mapBackdrop));mapCloseBtn.addEventListener('click',()=>closeBackdrop(mapBackdrop));mapBackdrop.addEventListener('click',e=>{if(e.target===mapBackdrop)closeBackdrop(mapBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(mapBackdrop);});mapTabs.forEach(t=>t.addEventListener('click',()=>showMap(t.getAttribute('data-oi-map-tab'))));mapViewport.addEventListener('wheel',e=>{if(mapBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showMap(1);}
  if(tableBtn&&tableBackdrop&&tableCloseBtn&&tableViewport&&tableImgs.length){tableBtn.addEventListener('click',()=>openBackdrop(tableBackdrop));tableCloseBtn.addEventListener('click',()=>closeBackdrop(tableBackdrop));tableBackdrop.addEventListener('click',e=>{if(e.target===tableBackdrop)closeBackdrop(tableBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(tableBackdrop);});tableTabs.forEach(t=>t.addEventListener('click',()=>showTable(t.getAttribute('data-oi-table-tab'))));tableViewport.addEventListener('wheel',e=>{if(tableBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showTable(1);}
  applyScale();
})();
</script>
</body>
</html>
