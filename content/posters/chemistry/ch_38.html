<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Массовая доля вещества в растворе</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #134e4a, #0f766e, #042f2e);
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
        }
        .heading-font { font-family: 'Montserrat', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .rounded-custom { border-radius: 2.5rem; }
        .lang-btn { transition: all 0.2s; }
        .lang-btn.active { background: #2dd4bf; color: #042f2e; border-color: transparent; font-weight: 800; }
        .formula-style { font-family: 'Courier New', monospace; }
        input[type="range"] { accent-color: #2dd4bf; }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="glass rounded-custom p-8 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 id="main-title" class="heading-font text-3xl md:text-5xl uppercase tracking-tight text-teal-300"></h1>
            <p id="sub-title" class="mt-2 text-white/60 font-light"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="setLang('ru')" id="btn-ru" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">RU</button>
            <button onclick="setLang('kz')" id="btn-kz" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">KZ</button>
            <button onclick="setLang('en')" id="btn-en" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">EN</button>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">
        <div class="lg:col-span-7 glass rounded-custom p-8">
            <h2 id="formula-heading" class="heading-font text-xl mb-6 opacity-80 uppercase tracking-wider"></h2>

            <div class="bg-black/30 rounded-2xl p-8 mb-6 border border-teal-500/20 text-center">
                <div id="formula-name" class="text-teal-300 text-sm uppercase tracking-widest mb-3"></div>
                <div class="flex items-center justify-center gap-3 text-3xl md:text-4xl formula-style">
                    <div class="text-white/60">ω =</div>
                    <div class="flex flex-col items-center text-teal-300">
                        <div class="text-xl border-b border-teal-300 pb-1 px-3" id="formula-num"></div>
                        <div class="text-xl pt-1 px-3" id="formula-den"></div>
                    </div>
                    <div class="text-white/60">× 100%</div>
                </div>
                <div id="formula-legend" class="text-sm text-white/60 mt-4"></div>
            </div>

            <h3 id="calc-heading" class="heading-font text-lg mb-4 text-teal-300"></h3>
            <div class="space-y-4">
                <div>
                    <label class="flex justify-between text-sm text-white/70">
                        <span id="slider1-label"></span>
                        <span id="slider1-value" class="font-bold text-teal-300">20 г</span>
                    </label>
                    <input type="range" id="slider1" min="0" max="100" value="20" oninput="recalc()" class="w-full mt-2">
                </div>
                <div>
                    <label class="flex justify-between text-sm text-white/70">
                        <span id="slider2-label"></span>
                        <span id="slider2-value" class="font-bold text-teal-300">180 г</span>
                    </label>
                    <input type="range" id="slider2" min="10" max="500" value="180" oninput="recalc()" class="w-full mt-2">
                </div>

                <div class="bg-teal-500/10 rounded-2xl p-5 border border-teal-500/30 mt-4">
                    <div id="result-label" class="text-xs text-teal-300 uppercase tracking-widest mb-2"></div>
                    <div id="result-value" class="text-3xl font-bold formula-style"></div>
                    <div id="result-explain" class="text-sm text-white/70 mt-2"></div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-5 glass rounded-custom p-8 border-l-4 border-teal-400">
            <div class="text-5xl mb-4">⚗️</div>
            <h3 id="example-title" class="heading-font text-2xl mb-4 text-teal-300"></h3>
            <p id="example-text" class="text-white/80 leading-relaxed mb-6"></p>

            <div class="space-y-3">
                <div class="bg-white/5 rounded-2xl p-4 border border-white/10">
                    <div id="ex-step1-label" class="text-xs text-teal-300 uppercase tracking-widest mb-1"></div>
                    <div id="ex-step1-text" class="text-white/90 formula-style"></div>
                </div>
                <div class="bg-white/5 rounded-2xl p-4 border border-white/10">
                    <div id="ex-step2-label" class="text-xs text-teal-300 uppercase tracking-widest mb-1"></div>
                    <div id="ex-step2-text" class="text-white/90 formula-style"></div>
                </div>
                <div class="bg-white/5 rounded-2xl p-4 border border-white/10">
                    <div id="ex-step3-label" class="text-xs text-teal-300 uppercase tracking-widest mb-1"></div>
                    <div id="ex-step3-text" class="text-white/90 formula-style font-bold text-teal-200"></div>
                </div>
            </div>
        </div>
    </main>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
        <div class="glass rounded-custom p-8 hover:bg-teal-500/10 transition-colors">
            <div class="w-14 h-14 bg-teal-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">⚖️</div>
            <h4 id="card1-title" class="heading-font text-2xl mb-3 text-teal-300"></h4>
            <p id="card1-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-teal-500/10 transition-colors">
            <div class="w-14 h-14 bg-teal-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🏥</div>
            <h4 id="card2-title" class="heading-font text-2xl mb-3 text-teal-300"></h4>
            <p id="card2-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-teal-500/10 transition-colors">
            <div class="w-14 h-14 bg-teal-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">📊</div>
            <h4 id="card3-title" class="heading-font text-2xl mb-3 text-teal-300"></h4>
            <p id="card3-desc" class="text-white/70 leading-relaxed"></p>
        </div>
    </section>

    <footer class="glass rounded-custom p-10 text-center">
        <p id="quote-text" class="text-2xl md:text-3xl italic font-light leading-snug mb-4"></p>
        <cite id="quote-author" class="text-teal-400 font-bold uppercase tracking-widest text-sm"></cite>
    </footer>

    <script>
        const translations = {
            ru: {
                title: "Массовая доля в растворе",
                subtitle: "Насколько концентрированный получился раствор",
                formulaHeading: "Главная формула",
                formulaName: "Массовая доля растворённого вещества",
                formulaNum: "m (растворённого вещества)",
                formulaDen: "m (раствора)",
                formulaLegend: "m(раствора) = m(вещества) + m(растворителя)",
                calcHeading: "Интерактивный калькулятор",
                slider1: "Масса вещества (г)",
                slider2: "Масса растворителя (г)",
                resultLabel: "Массовая доля ω",
                exampleTitle: "Задача-пример",
                exampleText: "В 180 г воды растворили 20 г поваренной соли. Найдите массовую долю соли в растворе.",
                exStep1Label: "Шаг 1: масса раствора",
                exStep1Text: "m(р-ра) = 20 + 180 = 200 г",
                exStep2Label: "Шаг 2: расчёт по формуле",
                exStep2Text: "ω = 20 / 200 · 100%",
                exStep3Label: "Ответ",
                exStep3Text: "ω = 10%",
                cards: [
                    { title: "Когда применяется", desc: "На этикетках лекарств, моющих средств, удобрений всегда указана массовая доля действующего вещества — это и есть ω." },
                    { title: "Медицина", desc: "Физраствор содержит ω(NaCl) = 0,9%. Перекись водорода в аптеке — 3%. Концентрация рассчитывается именно по этой формуле." },
                    { title: "Связь с другими величинами", desc: "Через ω легко перейти к молярной концентрации, если известна плотность раствора. Это базовая величина в количественной химии." }
                ],
                quote: "«Без точной концентрации нет точной химии — и нет точной медицины»",
                author: "Принцип фармакологии"
            },
            kz: {
                title: "Ерітіндідегі массалық үлес",
                subtitle: "Ерітінді қаншалықты концентрлі болды",
                formulaHeading: "Негізгі формула",
                formulaName: "Еріген заттың массалық үлесі",
                formulaNum: "m (еріген зат)",
                formulaDen: "m (ерітінді)",
                formulaLegend: "m(ерітінді) = m(зат) + m(еріткіш)",
                calcHeading: "Интерактивті калькулятор",
                slider1: "Зат массасы (г)",
                slider2: "Еріткіш массасы (г)",
                resultLabel: "Массалық үлес ω",
                exampleTitle: "Үлгі есеп",
                exampleText: "180 г суда 20 г ас тұзы ерітілді. Тұздың ерітіндідегі массалық үлесін табыңыз.",
                exStep1Label: "1-қадам: ерітінді массасы",
                exStep1Text: "m(ер.) = 20 + 180 = 200 г",
                exStep2Label: "2-қадам: формула бойынша",
                exStep2Text: "ω = 20 / 200 · 100%",
                exStep3Label: "Жауап",
                exStep3Text: "ω = 10%",
                cards: [
                    { title: "Қайда қолданылады", desc: "Дәрі-дәрмек, тазалағыш құрал, тыңайтқыш заттарының жапсырмаларында әсер етуші заттың массалық үлесі әрқашан көрсетіледі — бұл ω." },
                    { title: "Медицина", desc: "Физраствордағы ω(NaCl) = 0,9%. Дәріханалық сутегі пероксиді — 3%. Концентрация дәл осы формула бойынша есептеледі." },
                    { title: "Басқа шамалармен байланысы", desc: "ω арқылы ерітіндінің тығыздығын біле отырып, молярлық концентрацияға өту оңай. Бұл — сандық химияның базалық шамасы." }
                ],
                quote: "«Дәл концентрациясыз дәл химия да, дәл медицина да жоқ»",
                author: "Фармакология қағидасы"
            },
            en: {
                title: "Mass fraction in solution",
                subtitle: "How concentrated is the solution you made",
                formulaHeading: "Key formula",
                formulaName: "Mass fraction of solute",
                formulaNum: "m (solute)",
                formulaDen: "m (solution)",
                formulaLegend: "m(solution) = m(solute) + m(solvent)",
                calcHeading: "Interactive calculator",
                slider1: "Mass of solute (g)",
                slider2: "Mass of solvent (g)",
                resultLabel: "Mass fraction ω",
                exampleTitle: "Sample problem",
                exampleText: "20 g of table salt was dissolved in 180 g of water. Find the mass fraction of salt in the solution.",
                exStep1Label: "Step 1: mass of the solution",
                exStep1Text: "m(sol.) = 20 + 180 = 200 g",
                exStep2Label: "Step 2: apply the formula",
                exStep2Text: "ω = 20 / 200 · 100%",
                exStep3Label: "Answer",
                exStep3Text: "ω = 10%",
                cards: [
                    { title: "Where it is used", desc: "Labels of medicines, detergents and fertilisers always state the mass fraction of the active substance — that's exactly ω." },
                    { title: "Medicine", desc: "Saline contains ω(NaCl) = 0.9%. Pharmacy hydrogen peroxide is 3%. The concentration is calculated by this very formula." },
                    { title: "Link to other quantities", desc: "From ω plus solution density you can switch to molar concentration. It is a foundational quantity of quantitative chemistry." }
                ],
                quote: "«Without an exact concentration there is no exact chemistry — and no exact medicine»",
                author: "Pharmacology principle"
            }
        };

        let currentLang = 'ru';

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            try { localStorage.setItem('poster_lang', lang); } catch(e){}
            updateUI();
        }

        function recalc() {
            const mSub = parseFloat(document.getElementById('slider1').value);
            const mSol = parseFloat(document.getElementById('slider2').value);
            const total = mSub + mSol;
            const omega = total > 0 ? (mSub / total * 100) : 0;
            const u = currentLang === 'ru' ? 'г' : currentLang === 'kz' ? 'г' : 'g';
            document.getElementById('slider1-value').textContent = mSub + ' ' + u;
            document.getElementById('slider2-value').textContent = mSol + ' ' + u;
            document.getElementById('result-value').textContent = 'ω = ' + omega.toFixed(2) + '%';
            const expl = currentLang === 'ru' ? `${mSub} / ${total} · 100%` :
                         currentLang === 'kz' ? `${mSub} / ${total} · 100%` :
                         `${mSub} / ${total} · 100%`;
            document.getElementById('result-explain').textContent = expl;
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('sub-title').textContent = t.subtitle;
            document.getElementById('formula-heading').textContent = t.formulaHeading;
            document.getElementById('formula-name').textContent = t.formulaName;
            document.getElementById('formula-num').textContent = t.formulaNum;
            document.getElementById('formula-den').textContent = t.formulaDen;
            document.getElementById('formula-legend').textContent = t.formulaLegend;
            document.getElementById('calc-heading').textContent = t.calcHeading;
            document.getElementById('slider1-label').textContent = t.slider1;
            document.getElementById('slider2-label').textContent = t.slider2;
            document.getElementById('result-label').textContent = t.resultLabel;
            document.getElementById('example-title').textContent = t.exampleTitle;
            document.getElementById('example-text').textContent = t.exampleText;
            document.getElementById('ex-step1-label').textContent = t.exStep1Label;
            document.getElementById('ex-step1-text').textContent = t.exStep1Text;
            document.getElementById('ex-step2-label').textContent = t.exStep2Label;
            document.getElementById('ex-step2-text').textContent = t.exStep2Text;
            document.getElementById('ex-step3-label').textContent = t.exStep3Label;
            document.getElementById('ex-step3-text').textContent = t.exStep3Text;
            for (let i = 0; i < 3; i++) {
                document.getElementById('card' + (i+1) + '-title').textContent = t.cards[i].title;
                document.getElementById('card' + (i+1) + '-desc').textContent = t.cards[i].desc;
            }
            document.getElementById('quote-text').textContent = t.quote;
            document.getElementById('quote-author').textContent = t.author;
            recalc();
        }

        window.onload = () => {
            let s = 'ru';
            try { s = localStorage.getItem('poster_lang') || 'ru'; } catch(e){}
            if (s === 'kk') s = 'kz';
            setLang(s);
        };
    </script>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>

  function applyScale(){mapImgs.forEach(i=>i.style.transform=`scale(${scale})`);tableImgs.forEach(i=>i.style.transform=`scale(${scale})`);}
  function openBackdrop(b){b.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
  function closeBackdrop(b){b.setAttribute('aria-hidden','true');document.body.style.overflow='';}
  function showMap(n){mapImgs.forEach(i=>i.style.display=(i.getAttribute('data-map')===String(n))?'block':'none');mapTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-map-tab')===String(n)));if(mapViewport){mapViewport.scrollTop=0;mapViewport.scrollLeft=0;}}
  function showTable(n){tableImgs.forEach(i=>i.style.display=(i.getAttribute('data-table')===String(n))?'block':'none');tableTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-table-tab')===String(n)));if(tableViewport){tableViewport.scrollTop=0;tableViewport.scrollLeft=0;}}
  if(mapBtn&&mapBackdrop&&mapCloseBtn&&mapViewport&&mapImgs.length){mapBtn.addEventListener('click',()=>openBackdrop(mapBackdrop));mapCloseBtn.addEventListener('click',()=>closeBackdrop(mapBackdrop));mapBackdrop.addEventListener('click',e=>{if(e.target===mapBackdrop)closeBackdrop(mapBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(mapBackdrop);});mapTabs.forEach(t=>t.addEventListener('click',()=>showMap(t.getAttribute('data-oi-map-tab'))));mapViewport.addEventListener('wheel',e=>{if(mapBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showMap(1);}
  if(tableBtn&&tableBackdrop&&tableCloseBtn&&tableViewport&&tableImgs.length){tableBtn.addEventListener('click',()=>openBackdrop(tableBackdrop));tableCloseBtn.addEventListener('click',()=>closeBackdrop(tableBackdrop));tableBackdrop.addEventListener('click',e=>{if(e.target===tableBackdrop)closeBackdrop(tableBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(tableBackdrop);});tableTabs.forEach(t=>t.addEventListener('click',()=>showTable(t.getAttribute('data-oi-table-tab'))));tableViewport.addEventListener('wheel',e=>{if(tableBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showTable(1);}
  applyScale();
})();
