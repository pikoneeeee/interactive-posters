<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Основные классы неорганических соединений</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #4c1d95, #6d28d9, #0f172a);
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
        }
        .heading-font { font-family: 'Montserrat', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .rounded-custom { border-radius: 2.5rem; }
        .lang-btn { transition: all 0.2s; }
        .lang-btn.active { background: #a78bfa; color: #1e1b4b; border-color: transparent; font-weight: 800; }
        .class-btn { transition: all 0.2s; cursor: pointer; }
        .class-btn:hover { transform: translateY(-4px); }
        .class-btn.active { transform: translateY(-4px) scale(1.03); }
        .formula-style { font-family: 'Courier New', monospace; }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="glass rounded-custom p-8 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 id="main-title" class="heading-font text-3xl md:text-5xl uppercase tracking-tight text-violet-300"></h1>
            <p id="sub-title" class="mt-2 text-white/60 font-light"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="setLang('ru')" id="btn-ru" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">RU</button>
            <button onclick="setLang('kz')" id="btn-kz" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">KZ</button>
            <button onclick="setLang('en')" id="btn-en" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">EN</button>
        </div>
    </header>

    <section class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div onclick="selectClass('oxides')" id="cls-oxides" class="class-btn glass rounded-custom p-6 text-center border border-white/10" style="--accent:#fb7185">
            <div class="text-4xl mb-2">🔥</div>
            <div class="formula-style font-bold text-xl text-rose-400">M_xO_y</div>
            <div id="cls-oxides-name" class="text-sm text-white/70 mt-1"></div>
        </div>
        <div onclick="selectClass('acids')" id="cls-acids" class="class-btn glass rounded-custom p-6 text-center border border-white/10">
            <div class="text-4xl mb-2">🍋</div>
            <div class="formula-style font-bold text-xl text-amber-300">H_xА</div>
            <div id="cls-acids-name" class="text-sm text-white/70 mt-1"></div>
        </div>
        <div onclick="selectClass('bases')" id="cls-bases" class="class-btn glass rounded-custom p-6 text-center border border-white/10">
            <div class="text-4xl mb-2">🧼</div>
            <div class="formula-style font-bold text-xl text-emerald-300">M(OH)_n</div>
            <div id="cls-bases-name" class="text-sm text-white/70 mt-1"></div>
        </div>
        <div onclick="selectClass('salts')" id="cls-salts" class="class-btn glass rounded-custom p-6 text-center border border-white/10">
            <div class="text-4xl mb-2">🧂</div>
            <div class="formula-style font-bold text-xl text-sky-300">M_xА_y</div>
            <div id="cls-salts-name" class="text-sm text-white/70 mt-1"></div>
        </div>
    </section>

    <main class="glass rounded-custom p-8 mb-8 border-l-4 border-violet-400">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
                <div id="info-icon" class="text-5xl mb-3">🔥</div>
                <h2 id="info-title" class="heading-font text-3xl mb-4 text-violet-300"></h2>
                <p id="info-text" class="text-lg leading-relaxed text-white/85 mb-5"></p>

                <h3 id="examples-label" class="text-violet-300 text-sm uppercase tracking-widest mb-2"></h3>
                <div id="examples-list" class="space-y-2 mb-5"></div>
            </div>
            <div>
                <h3 id="props-label" class="text-violet-300 text-sm uppercase tracking-widest mb-3"></h3>
                <div id="props-list" class="space-y-2 mb-5"></div>

                <h3 id="usage-label" class="text-violet-300 text-sm uppercase tracking-widest mb-3"></h3>
                <p id="usage-text" class="text-white/80 leading-relaxed bg-black/30 rounded-2xl p-5 border border-violet-400/20"></p>
            </div>
        </div>
    </main>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
        <div class="glass rounded-custom p-8 hover:bg-violet-500/10 transition-colors">
            <div class="w-14 h-14 bg-violet-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🌐</div>
            <h4 id="card1-title" class="heading-font text-2xl mb-3 text-violet-300"></h4>
            <p id="card1-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-violet-500/10 transition-colors">
            <div class="w-14 h-14 bg-violet-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🔄</div>
            <h4 id="card2-title" class="heading-font text-2xl mb-3 text-violet-300"></h4>
            <p id="card2-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-violet-500/10 transition-colors">
            <div class="w-14 h-14 bg-violet-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🧪</div>
            <h4 id="card3-title" class="heading-font text-2xl mb-3 text-violet-300"></h4>
            <p id="card3-desc" class="text-white/70 leading-relaxed"></p>
        </div>
    </section>

    <footer class="glass rounded-custom p-10 text-center">
        <p id="quote-text" class="text-2xl md:text-3xl italic font-light leading-snug mb-4"></p>
        <cite id="quote-author" class="text-violet-300 font-bold uppercase tracking-widest text-sm"></cite>
    </footer>

    <script>
        const translations = {
            ru: {
                title: "Основные классы неорг. соединений",
                subtitle: "Четыре фундаментальных класса веществ",
                names: { oxides: "Оксиды", acids: "Кислоты", bases: "Основания", salts: "Соли" },
                classes: {

                        examples: ["CO₂ — углекислый газ", "Fe₂O₃ — оксид железа (ржавчина)", "SiO₂ — кварц, песок", "H₂O — вода (тоже оксид!)"],

                    acids: {

                        title: "Кислоты",
                        text: "Вещества, состоящие из атомов водорода (способных замещаться металлом) и кислотного остатка. В воде диссоциируют с образованием H⁺ — отсюда кислый вкус.",
                        examples: ["HCl — соляная кислота", "H₂SO₄ — серная кислота", "HNO₃ — азотная кислота", "CH₃COOH — уксусная кислота"],
                        props: ["Кислый вкус, окрашивают лакмус в красный", "Реагируют с металлами с выделением H₂", "Реагируют с основаниями и солями"],

                        props: ["Мыльные на ощупь, лакмус — синий", "Реагируют с кислотами (нейтрализация)", "Щёлочи — едкие, разъедают кожу"],
                        usage: "NaOH — производство мыла, бумаги. Ca(OH)₂ — побелка деревьев, нейтрализация кислых почв. Mg(OH)₂ — антацид от изжоги."
                    },
                    salts: {
                        icon: "🧂",
                        title: "Соли",
                        text: "Продукты замещения водорода в кислоте на металл. Состоят из катиона металла и аниона кислотного остатка. Самый разнообразный класс.",
                        examples: ["NaCl — поваренная соль", "CaCO₃ — мел, известняк", "CuSO₄ — медный купорос", "NaHCO₃ — пищевая сода"],

                },
                examplesLabel: "Примеры",

                usageLabel: "Применение",
                cards: [
                    { title: "Связь между классами", desc: "Оксиды → кислоты или основания → соли. Так с помощью реакций можно перейти от одного класса к другому — это «генетическая связь» неорганики." },
                    { title: "Реакция нейтрализации", desc: "Кислота + основание = соль + вода. Это типичная реакция, лежащая в основе многих биологических и промышленных процессов." },
                    { title: "Качественные реакции", desc: "Каждый класс имеет «свои» индикаторы: лакмус, фенолфталеин, метилоранж. Они меняют цвет в зависимости от среды." }
                ],
                quote: "«Четыре класса — четыре стороны мира неорганической химии»",
                author: "Дмитрий Менделеев"

                classes: {

                        icon: "🔥",
                        title: "Оксидтер",
                        text: "Екі элементтен тұратын күрделі заттар, оның бірі — −2 тотығу дәрежесіндегі оттегі. Негіздік (Na₂O, CaO), қышқылдық (CO₂, SO₃), амфотерлік (Al₂O₃, ZnO) және тұз түзбейтін (CO, NO) болып бөлінеді.",
                        examples: ["CO₂ — көмірқышқыл газы", "Fe₂O₃ — темір оксиді (тат)", "SiO₂ — кварц, құм", "H₂O — су (бұл да оксид!)"],
                        props: ["Көбіне қатты, кейбірі газ", "Қышқыл мен сілтілермен әрекеттеседі", "Көпшілігі суда ерімейді"],
                        usage: "Әк (CaO) — әктеу мен құрылыс үшін, кварц құмы (SiO₂) — әйнек пен микроэлектроника, темір оксиді — пигмент."
                    },
                    acids: {
                        icon: "🍋",
                        title: "Қышқылдар",

                        examples: ["HCl — тұз қышқылы", "H₂SO₄ — күкірт қышқылы", "HNO₃ — азот қышқылы", "CH₃COOH — сірке қышқылы"],
                        props: ["Қышқыл дәмді, лакмусты қызартады", "Металдармен әрекеттесіп H₂ бөледі", "Негіздермен, тұздармен әрекеттеседі"],
                        usage: "Күкірт қышқылы — өнеркәсіптің ең көп қолданылатын заты (тыңайтқыш, аккумулятор). Тұз қышқылы — асқазанда. Сірке қышқылы — тамақ өнеркәсібінде."
                    },
                    bases: {
                        icon: "🧼",
                        title: "Негіздер",
                        text: "Металдың гидроксотоп OH-мен қосылысы. Суда еритіндері сілтілер деп аталады. Олар саусақта сабындай, кейбірі күйдіргіш.",
                        examples: ["NaOH — күйдіргіш натр", "KOH — күйдіргіш калий", "Ca(OH)₂ — сөнген әк", "NH₄OH — нашатыр спирті"],
                        props: ["Саусақта сабынды, лакмусты көк түске бояйды", "Қышқылдармен әрекеттеседі (бейтараптау)", "Сілтілер күйдіргіш, теріні зақымдайды"],
                        usage: "NaOH — сабын, қағаз өндіру. Ca(OH)₂ — ағаш әктеу, қышқыл топырақты бейтараптау. Mg(OH)₂ — асқазан ауыруына қарсы дәрі."
                    },
                    salts: {
                        icon: "🧂",
                        title: "Тұздар",
                        text: "Қышқылдағы сутегін металмен алмастырудан түзілген заттар. Метал катионы мен қышқыл қалдық анионынан тұрады. Ең әр түрлі класс.",
                        examples: ["NaCl — ас тұзы", "CaCO₃ — бор, әктас", "CuSO₄ — мыс купоросы", "NaHCO₃ — ас содасы"],
                        props: ["Қатты, кристалл түрінде", "Көпшілігі суда ериді", "Ион тор құрылымы"],
                        usage: "Тұздар тамақ, медицина, тыңайтқышта қолданылады. NaCl — дәмдеуіш, KNO₃ — тыңайтқыш, CaSO₄·2H₂O — гипс."

                },

                propsLabel: "Қасиеттері",
                usageLabel: "Қолданылуы",
                cards: [
                    { title: "Кластар арасындағы байланыс", desc: "Оксидтер → қышқыл немесе негіз → тұз. Реакциялар арқылы бір кластан екіншісіне өтуге болады — бейорганикалық химияның «генетикалық байланысы»." },
                    { title: "Бейтараптау реакциясы", desc: "Қышқыл + негіз = тұз + су. Көптеген биологиялық және өнеркәсіптік процестердің негізі." },
                    { title: "Сапалық реакциялар", desc: "Әр кластың өз индикаторлары: лакмус, фенолфталеин, метилоранж. Олар орта түрін көрсетеді." }
                ],
                quote: "«Төрт класс — бейорганикалық химия әлемінің төрт қыры»",
                author: "Дмитрий Менделеев"
            },
            en: {
                title: "Main classes of inorganic compounds",
                subtitle: "Four fundamental classes of substances",
                names: { oxides: "Oxides", acids: "Acids", bases: "Bases", salts: "Salts" },
                classes: {
                    oxides: {
                        icon: "🔥",
                        title: "Oxides",
                        text: "Compounds of two elements, one of which is oxygen with oxidation state −2. They split into basic (Na₂O, CaO), acidic (CO₂, SO₃), amphoteric (Al₂O₃, ZnO) and non-salt-forming (CO, NO).",

                        props: ["Often solid, sometimes gases", "React with acids and alkalis", "Most are insoluble in water"],

                    acids: {
                        icon: "🍋",
                        title: "Acids",

                        props: ["Sour, turn litmus red", "React with metals releasing H₂", "React with bases and salts"],
                        usage: "Sulfuric acid is the world's largest-scale industrial chemical. Hydrochloric acid is in the human stomach. Acetic acid is used in food."
                    },
                    bases: {
                        icon: "🧼",
                        title: "Bases",
                        text: "Compounds of a metal with the hydroxide group OH. Those that dissolve in water are called alkalis — slippery and caustic.",
                        examples: ["NaOH — caustic soda", "KOH — caustic potash", "Ca(OH)₂ — slaked lime", "NH₄OH — ammonia water"],
                        props: ["Slippery, litmus turns blue", "React with acids (neutralisation)", "Alkalis are caustic to skin"],
                        usage: "NaOH — soap and paper making. Ca(OH)₂ — whitewashing, neutralising acid soils. Mg(OH)₂ — antacid against heartburn."

                    salts: {
                        icon: "🧂",
                        title: "Salts",
                        text: "Products of replacing hydrogen in an acid with a metal. Consist of a metal cation and an acid-residue anion. The most diverse class.",
                        examples: ["NaCl — table salt", "CaCO₃ — chalk, limestone", "CuSO₄ — copper sulfate", "NaHCO₃ — baking soda"],
                        props: ["Solid, crystalline", "Many are water-soluble", "Have ionic lattices"],
                        usage: "Salts are used in cooking, medicine and fertilisers. NaCl — seasoning, KNO₃ — fertiliser, CaSO₄·2H₂O — gypsum."

                propsLabel: "Properties",
                usageLabel: "Applications",

                    { title: "Links between classes", desc: "Oxide → acid or base → salt. Reactions let you travel between classes — the genetic link of inorganic chemistry." },

                author: "Dmitri Mendeleev"
            }

        let currentLang = 'ru';
        let currentClass = 'oxides';

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            try { localStorage.setItem('poster_lang', lang); } catch(e){}
            updateUI();
        }

        function selectClass(c) {
            currentClass = c;
            document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('cls-' + c).classList.add('active');
            renderInfo();
        }

        function renderInfo() {
            const t = translations[currentLang];
            const c = t.classes[currentClass];
            document.getElementById('info-icon').textContent = c.icon;
            document.getElementById('info-title').textContent = c.title;
            document.getElementById('info-text').textContent = c.text;
            document.getElementById('examples-list').innerHTML = c.examples.map(e =>
                `<div class="bg-white/5 rounded-xl p-3 border border-white/10 formula-style text-white/90">${e}</div>`
            ).join('');
            document.getElementById('props-list').innerHTML = c.props.map(p =>
                `<div class="bg-white/5 rounded-xl p-3 border border-white/10 text-white/85 flex gap-2"><span class="text-violet-300">▸</span>${p}</div>`
            ).join('');
            document.getElementById('usage-text').textContent = c.usage;
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('sub-title').textContent = t.subtitle;
            ['oxides','acids','bases','salts'].forEach(c => {
                document.getElementById('cls-' + c + '-name').textContent = t.names[c];
            });
            document.getElementById('examples-label').textContent = t.examplesLabel;
            document.getElementById('props-label').textContent = t.propsLabel;
            document.getElementById('usage-label').textContent = t.usageLabel;
            renderInfo();
            for (let i = 0; i < 3; i++) {
                document.getElementById('card' + (i+1) + '-title').textContent = t.cards[i].title;
                document.getElementById('card' + (i+1) + '-desc').textContent = t.cards[i].desc;
            }
            document.getElementById('quote-text').textContent = t.quote;
            document.getElementById('quote-author').textContent = t.author;
        }

        window.onload = () => {
            let s = 'ru';
            try { s = localStorage.getItem('poster_lang') || 'ru'; } catch(e){}
