<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Классификация веществ</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #881337, #be123c, #1f2937);
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
        }
        .heading-font { font-family: 'Montserrat', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .rounded-custom { border-radius: 2.5rem; }
        .lang-btn { transition: all 0.2s; }
        .lang-btn.active { background: #fb7185; color: #1f2937; border-color: transparent; font-weight: 800; }
        .tree-node { transition: all 0.3s; cursor: pointer; }
        .tree-node:hover { background: rgba(251, 113, 133, 0.15); }
        .tree-node.active { background: rgba(251, 113, 133, 0.22); border-color: #fb7185; }
        .formula-style { font-family: 'Courier New', monospace; }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="glass rounded-custom p-8 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 id="main-title" class="heading-font text-3xl md:text-5xl uppercase tracking-tight text-rose-400"></h1>
            <p id="sub-title" class="mt-2 text-white/60 font-light"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="setLang('ru')" id="btn-ru" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">RU</button>
            <button onclick="setLang('kz')" id="btn-kz" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">KZ</button>
            <button onclick="setLang('en')" id="btn-en" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">EN</button>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">
        <div class="lg:col-span-7 glass rounded-custom p-8">
            <h2 id="tree-heading" class="heading-font text-xl mb-6 opacity-80 uppercase tracking-wider"></h2>

            <div class="flex flex-col items-center">
                <div onclick="selectNode('all')" id="node-all" class="tree-node bg-rose-500/20 border-2 border-rose-400 rounded-2xl p-4 mb-4 w-full max-w-xs text-center">
                    <div id="node-all-title" class="font-bold text-lg"></div>
                </div>

                <div class="flex gap-4 mb-4 flex-wrap justify-center">
                    <div onclick="selectNode('simple')" id="node-simple" class="tree-node bg-white/5 border border-white/15 rounded-2xl p-4 w-44 text-center">
                        <div id="node-simple-title" class="font-bold text-rose-300"></div>
                        <div id="node-simple-sub" class="text-xs text-white/60 mt-1"></div>
                    </div>
                    <div onclick="selectNode('complex')" id="node-complex" class="tree-node bg-white/5 border border-white/15 rounded-2xl p-4 w-44 text-center">
                        <div id="node-complex-title" class="font-bold text-rose-300"></div>
                        <div id="node-complex-sub" class="text-xs text-white/60 mt-1"></div>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 w-full">
                    <div onclick="selectNode('metals')" id="node-metals" class="tree-node bg-white/5 border border-white/10 rounded-xl p-3 text-center">
                        <div id="node-metals-title" class="text-sm font-bold"></div>
                        <div class="text-xs text-rose-300 formula-style mt-1">Na, Fe, Cu</div>
                    </div>
                    <div onclick="selectNode('nonmetals')" id="node-nonmetals" class="tree-node bg-white/5 border border-white/10 rounded-xl p-3 text-center">
                        <div id="node-nonmetals-title" class="text-sm font-bold"></div>
                        <div class="text-xs text-rose-300 formula-style mt-1">O₂, N₂, S</div>
                    </div>
                    <div onclick="selectNode('organic')" id="node-organic" class="tree-node bg-white/5 border border-white/10 rounded-xl p-3 text-center">
                        <div id="node-organic-title" class="text-sm font-bold"></div>
                        <div class="text-xs text-rose-300 formula-style mt-1">CH₄, C₆H₆</div>
                    </div>
                    <div onclick="selectNode('inorganic')" id="node-inorganic" class="tree-node bg-white/5 border border-white/10 rounded-xl p-3 text-center">
                        <div id="node-inorganic-title" class="text-sm font-bold"></div>
                        <div class="text-xs text-rose-300 formula-style mt-1">H₂O, NaCl</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-5 glass rounded-custom p-8 border-l-4 border-rose-400">
            <div id="info-icon" class="text-5xl mb-4">🌐</div>
            <h3 id="info-title" class="heading-font text-3xl mb-4 text-rose-300"></h3>
            <p id="info-text" class="text-lg leading-relaxed text-white/85 mb-5"></p>

            <h4 id="examples-label" class="text-rose-300 text-sm uppercase tracking-widest mb-2"></h4>
            <div id="examples-box" class="bg-white/5 rounded-2xl p-4 border border-white/10 leading-relaxed text-white/85 formula-style"></div>

            <h4 id="features-label" class="text-rose-300 text-sm uppercase tracking-widest mt-5 mb-2"></h4>
            <div id="features-box" class="bg-black/30 rounded-2xl p-4 border border-rose-400/20 text-white/80 leading-relaxed"></div>
        </div>
    </main>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
        <div class="glass rounded-custom p-8 hover:bg-rose-500/10 transition-colors">
            <div class="w-14 h-14 bg-rose-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">⚛️</div>
            <h4 id="card1-title" class="heading-font text-2xl mb-3 text-rose-300"></h4>
            <p id="card1-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-rose-500/10 transition-colors">
            <div class="w-14 h-14 bg-rose-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🧬</div>
            <h4 id="card2-title" class="heading-font text-2xl mb-3 text-rose-300"></h4>
            <p id="card2-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-rose-500/10 transition-colors">
            <div class="w-14 h-14 bg-rose-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🔍</div>
            <h4 id="card3-title" class="heading-font text-2xl mb-3 text-rose-300"></h4>
            <p id="card3-desc" class="text-white/70 leading-relaxed"></p>
        </div>
    </section>

    <footer class="glass rounded-custom p-10 text-center">
        <p id="quote-text" class="text-2xl md:text-3xl italic font-light leading-snug mb-4"></p>
        <cite id="quote-author" class="text-rose-400 font-bold uppercase tracking-widest text-sm"></cite>
    </footer>

    <script>
        const translations = {

                    simple:    { icon: "⚛️", title: "Жай заттар", text: "Бірдей элемент атомдарынан тұрады. Металдар мен бейметалдарға бөлінеді. Кейбір элементтер бірнеше жай зат түзеді — аллотропия.", examples: "O₂, O₃, S, P, Fe, Cu, алмаз, графит — бұл жай заттар.", features: "Химиялық жолмен қарапайымдау заттарға айналмайды." },
                    complex:   { icon: "🧪", title: "Күрделі заттар", text: "Екі және одан көп элемент атомдарынан тұрады. Органикалық (көміртекті) және бейорганикалықтарға бөлінеді. Табиғатта басым көпшілігі осындай.", examples: "H₂O, NaCl, CO₂, CaCO₃, C₆H₁₂O₆ — бәрі күрделі.", features: "Химиялық реакциялармен жай заттарға айналдыруға болады." },
                    metals:    { icon: "🔩", title: "Металдар", text: "Метал жылтыры, жылу-электр өткізгіштігі бар жай заттар. Менделеев кестесінің сол жағын алып жатыр.", examples: "Na, Fe, Cu, Al, Au, Ag, Zn, Pb", features: "Соғымтал, иілгіш, судан ауыр (Li-ден басқа). Реакцияларда электрон береді." },
                    nonmetals: { icon: "💎", title: "Бейметалдар", text: "Метал жылтыры жоқ жай заттар. Көбіне газ немесе морт қатты. Электр өткізбейді (графиттен басқа).", examples: "O₂, N₂, S, P, Cl₂, C (алмаз, графит)", features: "Қаттыларда морт, жылу мен электрді нашар өткізеді. Электрон қабылдайды." },
                    organic:   { icon: "🌱", title: "Органикалық заттар", text: "Көміртек қосылыстары (CO, CO₂, карбонаттардан басқа). Тіршіліктің негізі. Көмірсутектер, спирттер, қышқылдар, белоктар, майлар, көмірсулар.", examples: "CH₄ (метан), C₂H₅OH (этанол), C₆H₁₂O₆ (глюкоза), белоктар", features: "C–C, C–H байланыстары бар. Жанғанда CO₂ мен H₂O түзіледі." },
                    inorganic: { icon: "🧂", title: "Бейорганикалық заттар", text: "Органикалықтардан басқа барлық заттар. Оксидтер, қышқылдар, негіздер, тұздар кіреді. Бейорганикалық химия зерттейді.", examples: "H₂O, NaCl, H₂SO₄, NaOH, CaCO₃, Fe₂O₃", features: "Көпшілігі ұшқыш емес, көбі суда ериді, ион немесе полюсті ковалент байланыстары бар." }
                },

                ],
                quote: "«Табиғат тәртіпті ұнатады — сондықтан химия да өзінің шексіз әлемін кластарға бөледі»",
                author: "Лайнус Полинг"

            en: {
                title: "Classification of substances",
                subtitle: "A map of everything the material world is made of",
                treeHeading: "Classification tree",
                nodes: {
                    all:       { title: "All substances", sub: "" },
                    simple:    { title: "Simple", sub: "Single element" },
                    complex:   { title: "Compound", sub: "Two or more elements" },

                    nonmetals: { title: "Non-metals", sub: "" },
                    organic:   { title: "Organic", sub: "" },
                    inorganic: { title: "Inorganic", sub: "" }
                },
                examplesLabel: "Examples",
                featuresLabel: "Key features",
                content: {
                    all:       { icon: "🌐", title: "Substances — the basis of everything", text: "Every kind of matter in nature is a substance. We classify them by composition, structure and properties to make them easier to study and predict.", examples: "Air, water, metal, glass, blood — all of these are substances or their mixtures.", features: "They have a fixed composition and definite physical and chemical properties." },
                    simple:    { icon: "⚛️", title: "Simple substances", text: "Made from atoms of one element. Split into metals and non-metals. Some elements form several simple substances — allotropy.", examples: "O₂, O₃, S, P, Fe, Cu, diamond, graphite are all simple substances.", features: "Cannot be broken down chemically into simpler substances." },
                    complex:   { icon: "🧪", title: "Compound substances", text: "Made from atoms of two or more different elements. Split into organic (carbon-based) and inorganic. The vast majority of substances are compounds.", examples: "H₂O, NaCl, CO₂, CaCO₃, C₆H₁₂O₆ are all compounds.", features: "Can be decomposed into simpler substances by chemical reactions." },
                    metals:    { icon: "🔩", title: "Metals", text: "Simple substances with metallic lustre, heat- and electrical conductivity. They occupy most of the periodic table (left and middle).", examples: "Na, Fe, Cu, Al, Au, Ag, Zn, Pb", features: "Malleable, ductile, denser than water (except Li). They donate electrons in reactions." },
                    nonmetals: { icon: "💎", title: "Non-metals", text: "Simple substances without metallic lustre. Often gases or brittle solids. Do not conduct electricity (except graphite).", examples: "O₂, N₂, S, P, Cl₂, C (diamond, graphite)", features: "Brittle as solids, poor conductors of heat and electricity. They accept electrons." },
                    organic:   { icon: "🌱", title: "Organic substances", text: "Compounds of carbon (apart from CO, CO₂ and carbonates). The basis of all life. Includes hydrocarbons, alcohols, acids, proteins, fats and carbohydrates.", examples: "CH₄ (methane), C₂H₅OH (ethanol), C₆H₁₂O₆ (glucose), proteins", features: "Contain C–C, C–H bonds. Burn to CO₂ and H₂O." },

                },
                cards: [
                    { title: "Why classify", desc: "There are too many substances to study individually. Classification reveals shared patterns and lets us predict properties." },
                    { title: "Organic vs inorganic", desc: "Until the 19th century people thought only living things could create organic compounds. Now we synthesise them in the lab — but the divide remains useful." },

        let currentLang = 'ru';
        let currentNode = 'all';

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            try { localStorage.setItem('poster_lang', lang); } catch(e){}
            updateUI();
        }

        function selectNode(n) {
            currentNode = n;
            document.querySelectorAll('.tree-node').forEach(c => c.classList.remove('active'));
            document.getElementById('node-' + n).classList.add('active');
            renderInfo();
        }

        function renderInfo() {
            const t = translations[currentLang];
            const c = t.content[currentNode];
            document.getElementById('info-icon').textContent = c.icon;
            document.getElementById('info-title').textContent = c.title;
            document.getElementById('info-text').textContent = c.text;
            document.getElementById('examples-box').textContent = c.examples;
            document.getElementById('features-box').textContent = c.features;
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('sub-title').textContent = t.subtitle;
            document.getElementById('tree-heading').textContent = t.treeHeading;
            ['all','simple','complex','metals','nonmetals','organic','inorganic'].forEach(n => {
                document.getElementById('node-' + n + '-title').textContent = t.nodes[n].title;
                const sub = document.getElementById('node-' + n + '-sub');
                if (sub) sub.textContent = t.nodes[n].sub;
            });
            document.getElementById('examples-label').textContent = t.examplesLabel;
            document.getElementById('features-label').textContent = t.featuresLabel;
            renderInfo();
            for (let i = 0; i < 3; i++) {
                document.getElementById('card' + (i+1) + '-title').textContent = t.cards[i].title;
                document.getElementById('card' + (i+1) + '-desc').textContent = t.cards[i].desc;
            }
            document.getElementById('quote-text').textContent = t.quote;
            document.getElementById('quote-author').textContent = t.author;
        }

        window.onload = () => {
            let s = 'ru';
            try { s = localStorage.getItem('poster_lang') || 'ru'; } catch(e){}
            if (s === 'kk') s = 'kz';
            selectNode('all');
            setLang(s);
        };
    </script>
