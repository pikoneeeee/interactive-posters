<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Массовая доля элемента</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #451a03, #78350f, #1c1917);
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
        }
        .heading-font { font-family: 'Montserrat', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .rounded-custom { border-radius: 2.5rem; }
        .lang-btn { transition: all 0.2s; }
        .lang-btn.active { background: #f59e0b; color: #1c1917; border-color: transparent; font-weight: 800; }
        .compound-btn { transition: all 0.2s; cursor: pointer; }
        .compound-btn:hover { transform: translateY(-3px); }
        .compound-btn.active { background: rgba(245, 158, 11, 0.2); border-color: #f59e0b; }
        .formula-style { font-family: 'Courier New', monospace; }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="glass rounded-custom p-8 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 id="main-title" class="heading-font text-3xl md:text-5xl uppercase tracking-tight text-amber-400"></h1>
            <p id="sub-title" class="mt-2 text-white/60 font-light"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="setLang('ru')" id="btn-ru" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">RU</button>
            <button onclick="setLang('kz')" id="btn-kz" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">KZ</button>
            <button onclick="setLang('en')" id="btn-en" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">EN</button>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">
        <div class="lg:col-span-7 glass rounded-custom p-8">
            <h2 id="formula-heading" class="heading-font text-xl mb-6 opacity-80 uppercase tracking-wider"></h2>

            <div class="bg-black/30 rounded-2xl p-8 mb-6 border border-amber-500/20">
                <div class="text-center">
                    <div id="formula-name" class="text-amber-400 text-sm uppercase tracking-widest mb-2"></div>
                    <div class="flex items-center justify-center gap-3 text-3xl md:text-4xl formula-style mb-4">
                        <div class="text-white/60">ω(Э) =</div>
                        <div class="flex flex-col items-center text-amber-300">
                            <div class="text-xl border-b border-amber-300 pb-1 px-3" id="formula-num"></div>
                            <div class="text-xl pt-1 px-3" id="formula-den"></div>
                        </div>
                        <div class="text-white/60">× 100%</div>
                    </div>
                    <div id="formula-legend" class="text-sm text-white/60 mt-4"></div>
                </div>
            </div>

            <h3 id="example-heading" class="heading-font text-lg mb-4 text-amber-300"></h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                <div onclick="selectCompound('H2O')" id="cmp-H2O" class="compound-btn glass rounded-2xl p-4 text-center border border-white/10">
                    <div class="text-xl font-bold formula-style">H₂O</div>
                    <div id="cmp-H2O-name" class="text-xs text-white/60 mt-1"></div>
                </div>
                <div onclick="selectCompound('CO2')" id="cmp-CO2" class="compound-btn glass rounded-2xl p-4 text-center border border-white/10">
                    <div class="text-xl font-bold formula-style">CO₂</div>
                    <div id="cmp-CO2-name" class="text-xs text-white/60 mt-1"></div>
                </div>
                <div onclick="selectCompound('NaCl')" id="cmp-NaCl" class="compound-btn glass rounded-2xl p-4 text-center border border-white/10">
                    <div class="text-xl font-bold formula-style">NaCl</div>
                    <div id="cmp-NaCl-name" class="text-xs text-white/60 mt-1"></div>
                </div>
                <div onclick="selectCompound('CaCO3')" id="cmp-CaCO3" class="compound-btn glass rounded-2xl p-4 text-center border border-white/10">
                    <div class="text-xl font-bold formula-style">CaCO₃</div>
                    <div id="cmp-CaCO3-name" class="text-xs text-white/60 mt-1"></div>
                </div>
            </div>

            <div class="bg-black/30 rounded-2xl p-6 border border-white/10">
                <div id="solution-title" class="text-amber-400 text-sm uppercase tracking-widest mb-3"></div>
                <div id="solution-steps" class="space-y-2 text-white/80 leading-relaxed"></div>
            </div>
        </div>

        <div class="lg:col-span-5 glass rounded-custom p-8 flex flex-col border-l-4 border-amber-500">
            <div class="text-5xl mb-4">⚖️</div>
            <h3 id="info-title" class="heading-font text-3xl mb-4 text-amber-300"></h3>
            <p id="info-text" class="text-lg leading-relaxed text-white/80 mb-6"></p>

            <svg viewBox="0 0 360 320" class="w-full">
                <circle cx="180" cy="160" r="120" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
                <path id="pie-arc1" d="" fill="#f59e0b" stroke="#1c1917" stroke-width="2"/>
                <path id="pie-arc2" d="" fill="#dc2626" stroke="#1c1917" stroke-width="2"/>
                <path id="pie-arc3" d="" fill="#0ea5e9" stroke="#1c1917" stroke-width="2"/>
                <text id="pie-label1" x="180" y="160" text-anchor="middle" fill="white" font-size="16" font-weight="bold"></text>
                <text id="pie-label2" x="180" y="180" text-anchor="middle" fill="white" font-size="14"></text>
            </svg>
            <div id="pie-legend" class="grid grid-cols-3 gap-2 text-xs mt-2"></div>
        </div>
    </main>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
        <div class="glass rounded-custom p-8 hover:bg-amber-500/10 transition-colors">
            <div class="w-14 h-14 bg-amber-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">📐</div>
            <h4 id="card1-title" class="heading-font text-2xl mb-3 text-amber-300"></h4>
            <p id="card1-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-amber-500/10 transition-colors">
            <div class="w-14 h-14 bg-amber-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🔢</div>
            <h4 id="card2-title" class="heading-font text-2xl mb-3 text-amber-300"></h4>
            <p id="card2-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-amber-500/10 transition-colors">
            <div class="w-14 h-14 bg-amber-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">💡</div>
            <h4 id="card3-title" class="heading-font text-2xl mb-3 text-amber-300"></h4>
            <p id="card3-desc" class="text-white/70 leading-relaxed"></p>
        </div>
    </section>

    <footer class="glass rounded-custom p-10 text-center">
        <p id="quote-text" class="text-2xl md:text-3xl italic font-light leading-snug mb-4"></p>
        <cite id="quote-author" class="text-amber-400 font-bold uppercase tracking-widest text-sm"></cite>
    </footer>

    <script>
        const compounds = {
            H2O:   { mr: 18,  els: [{s:'H',n:2,m:1, color:'#f59e0b'},{s:'O',n:1,m:16,color:'#0ea5e9'}] },
            CO2:   { mr: 44,  els: [{s:'C',n:1,m:12,color:'#f59e0b'},{s:'O',n:2,m:16,color:'#0ea5e9'}] },
            NaCl:  { mr: 58.5,els: [{s:'Na',n:1,m:23,color:'#f59e0b'},{s:'Cl',n:1,m:35.5,color:'#0ea5e9'}] },
            CaCO3: { mr: 100, els: [{s:'Ca',n:1,m:40,color:'#f59e0b'},{s:'C',n:1,m:12,color:'#dc2626'},{s:'O',n:3,m:16,color:'#0ea5e9'}] }
        };

        const translations = {
            ru: {
                title: "Массовая доля элемента",
                subtitle: "Сколько процентов каждого элемента в веществе",
                formulaHeading: "Главная формула",
                formulaName: "Массовая доля элемента",
                formulaNum: "n · Aᵣ(Э)",
                formulaDen: "Mᵣ(вещества)",
                formulaLegend: "n — число атомов, Aᵣ — относительная атомная масса, Mᵣ — относительная молекулярная масса",
                exampleHeading: "Выберите вещество для расчёта:",
                solutionTitle: "Решение шаг за шагом",
                infoTitle: "Что показывает ω(Э)?",
                infoText: "Массовая доля элемента — это часть массы вещества, которую составляет данный элемент. Сумма массовых долей всех элементов всегда равна 100%.",
                compounds: { H2O: "Вода", CO2: "Углекислый газ", NaCl: "Поваренная соль", CaCO3: "Мел / Известняк" },
                cards: [
                    { title: "Зачем считать ω", desc: "Зная состав, можно определить чистоту удобрения, руды, лекарства. Это первый шаг к промышленным расчётам и стехиометрии." },
                    { title: "Алгоритм", desc: "1) Найти Mᵣ всего вещества; 2) умножить число атомов элемента на его Aᵣ; 3) разделить и умножить на 100%." },
                    { title: "Контроль", desc: "Сумма массовых долей всех элементов должна равняться 100%. Если получилось 99–101% — это округление, иначе ошибка в расчёте." }
                ],
                quote: "«В химии нет ничего важнее точного измерения массы»",
                author: "Антуан Лавуазье"
            },
            kz: {
                title: "Элементтің массалық үлесі",
                subtitle: "Заттағы әр элементтің пайыздық мөлшері",
                formulaHeading: "Негізгі формула",
                formulaName: "Элементтің массалық үлесі",
                formulaNum: "n · Aᵣ(Э)",
                formulaDen: "Mᵣ(зат)",
                formulaLegend: "n — атомдар саны, Aᵣ — салыстырмалы атомдық масса, Mᵣ — салыстырмалы молекулалық масса",
                exampleHeading: "Есептеу үшін зат таңдаңыз:",
                solutionTitle: "Қадам бойынша шешу",
                infoTitle: "ω(Э) нені көрсетеді?",
                infoText: "Элементтің массалық үлесі — заттың массасының осы элементке тиесілі бөлігі. Барлық элементтердің массалық үлестерінің қосындысы әрқашан 100%-ға тең.",
                compounds: { H2O: "Су", CO2: "Көмірқышқыл газ", NaCl: "Ас тұзы", CaCO3: "Бор / Әктас" },
                cards: [
                    { title: "Не үшін есептейміз", desc: "Құрамын біле отырып, тыңайтқыштың, кеннің, дәрінің тазалығын анықтауға болады. Бұл өнеркәсіптік есептеулер мен стехиометрияға бірінші қадам." },
                    { title: "Алгоритм", desc: "1) Заттың Mᵣ-ін табу; 2) элемент атомдарының санын Aᵣ-ге көбейту; 3) бөліп, 100%-ға көбейту." },
                    { title: "Тексеру", desc: "Барлық элементтердің массалық үлестерінің қосындысы 100%-ға тең болуы керек. 99–101% болса — дөңгелектеу, әйтпесе есептеудегі қате." }
                ],
                quote: "«Химияда массаны дәл өлшеуден маңыздырақ ештеңе жоқ»",
                author: "Антуан Лавуазье"
            },
            en: {
                title: "Mass fraction of element",
                subtitle: "What percentage of each element is in a substance",
                formulaHeading: "Key formula",
                formulaName: "Element mass fraction",
                formulaNum: "n · Aᵣ(E)",
                formulaDen: "Mᵣ(compound)",
                formulaLegend: "n — number of atoms, Aᵣ — relative atomic mass, Mᵣ — relative molecular mass",
                exampleHeading: "Pick a compound to calculate:",
                solutionTitle: "Step-by-step solution",
                infoTitle: "What does ω(E) show?",
                infoText: "Mass fraction is the part of a substance's mass contributed by a given element. The sum of mass fractions of all elements is always 100%.",
                compounds: { H2O: "Water", CO2: "Carbon dioxide", NaCl: "Table salt", CaCO3: "Chalk / Limestone" },
                cards: [
                    { title: "Why calculate ω", desc: "Knowing composition lets you determine purity of fertiliser, ore, or medicine. It's the first step into industrial chemistry and stoichiometry." },
                    { title: "Algorithm", desc: "1) Find Mᵣ of the whole compound; 2) multiply atoms of the element by its Aᵣ; 3) divide and multiply by 100%." },
                    { title: "Self-check", desc: "All mass fractions must sum to 100%. If you get 99–101% — rounding is fine, otherwise there is a calculation error." }
                ],
                quote: "«In chemistry nothing is more important than the accurate measurement of mass»",
                author: "Antoine Lavoisier"
            }
        };

        let currentLang = 'ru';
        let currentCmp = 'H2O';

        function polarToCart(cx,cy,r,a){return [cx + r*Math.cos(a-Math.PI/2), cy + r*Math.sin(a-Math.PI/2)];}
        function arcPath(cx,cy,r,startA,endA){
            const [x1,y1]=polarToCart(cx,cy,r,startA);
            const [x2,y2]=polarToCart(cx,cy,r,endA);
            const large=(endA-startA)>Math.PI?1:0;
            return `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`;
        }

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            try { localStorage.setItem('poster_lang', lang); } catch(e){}
            updateUI();
        }

        function selectCompound(c) {
            currentCmp = c;
            document.querySelectorAll('.compound-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('cmp-' + c).classList.add('active');
            updateUI();
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('sub-title').textContent = t.subtitle;
            document.getElementById('formula-heading').textContent = t.formulaHeading;
            document.getElementById('formula-name').textContent = t.formulaName;
            document.getElementById('formula-num').textContent = t.formulaNum;
            document.getElementById('formula-den').textContent = t.formulaDen;
            document.getElementById('formula-legend').textContent = t.formulaLegend;
            document.getElementById('example-heading').textContent = t.exampleHeading;
            document.getElementById('solution-title').textContent = t.solutionTitle;
            document.getElementById('info-title').textContent = t.infoTitle;
            document.getElementById('info-text').textContent = t.infoText;

            ['H2O','CO2','NaCl','CaCO3'].forEach(c => {
                document.getElementById('cmp-' + c + '-name').textContent = t.compounds[c];
            });

            const cmp = compounds[currentCmp];
            const stepsBox = document.getElementById('solution-steps');
            const lines = [];
            const formulaName = t.compounds[currentCmp];
            const labelMr = currentLang === 'ru' ? 'Mᵣ' : currentLang === 'kz' ? 'Mᵣ' : 'Mᵣ';
            const for_ = currentLang === 'ru' ? 'для' : currentLang === 'kz' ? 'үшін' : 'for';
            const calc = currentLang === 'ru' ? 'Расчёт' : currentLang === 'kz' ? 'Есептеу' : 'Calculation';

            const mrParts = cmp.els.map(e => `${e.n}·${e.m}`).join(' + ');
            lines.push(`<div><span class="text-amber-300 font-bold">${labelMr}(${currentCmp}) = </span>${mrParts} = <strong>${cmp.mr}</strong></div>`);

            cmp.els.forEach(e => {
                const num = e.n * e.m;
                const pct = (num / cmp.mr * 100).toFixed(2);
                lines.push(`<div><span class="text-amber-300 font-bold">ω(${e.s}) = </span>(${e.n}·${e.m})/${cmp.mr} · 100% = <strong>${pct}%</strong></div>`);
            });
            stepsBox.innerHTML = lines.join('');

            const cx = 180, cy = 160, r = 110;
            const total = cmp.mr;
            let cur = 0;
            const arcs = ['pie-arc1','pie-arc2','pie-arc3'];
            const legend = [];
            cmp.els.forEach((e, i) => {
                const part = (e.n * e.m) / total;
                const startA = cur * 2 * Math.PI;
                cur += part;
                const endA = cur * 2 * Math.PI;
                if (i < 3) {
                    const path = arcPath(cx, cy, r, startA, endA);
                    document.getElementById(arcs[i]).setAttribute('d', path);
                    document.getElementById(arcs[i]).setAttribute('fill', e.color);
                }
                legend.push(`<div class="bg-white/5 rounded-lg p-2 border border-white/10"><div class="w-3 h-3 rounded-full inline-block mr-1" style="background:${e.color}"></div><strong>${e.s}</strong>: ${(part*100).toFixed(1)}%</div>`);
            });
            for (let i = cmp.els.length; i < 3; i++) document.getElementById(arcs[i]).setAttribute('d', '');

            document.getElementById('pie-legend').innerHTML = legend.join('');
            document.getElementById('pie-label1').textContent = formulaName;
            document.getElementById('pie-label2').textContent = `Mᵣ = ${cmp.mr}`;

            for (let i = 0; i < 3; i++) {
                document.getElementById('card' + (i+1) + '-title').textContent = t.cards[i].title;
                document.getElementById('card' + (i+1) + '-desc').textContent = t.cards[i].desc;
            }
            document.getElementById('quote-text').textContent = t.quote;
            document.getElementById('quote-author').textContent = t.author;
        }

        window.onload = () => {
            let s = 'ru';
            try { s = localStorage.getItem('poster_lang') || 'ru'; } catch(e){}
            if (s === 'kk') s = 'kz';
            selectCompound('H2O');
            setLang(s);
        };
    </script>

<script data-oi-map-overlay>
(function(){
  const mapBtn=document.querySelector('[data-oi-map-btn]'),mapBackdrop=document.querySelector('[data-oi-map-backdrop]'),mapCloseBtn=document.querySelector('[data-oi-map-close]'),mapViewport=document.querySelector('[data-oi-map-viewport]'),mapTabs=Array.from(document.querySelectorAll('[data-oi-map-tab]')),mapImgs=Array.from(document.querySelectorAll('[data-oi-map-img][data-map]'));
  const tableBtn=document.querySelector('[data-oi-table-btn]'),tableBackdrop=document.querySelector('[data-oi-table-backdrop]'),tableCloseBtn=document.querySelector('[data-oi-table-close]'),tableViewport=document.querySelector('[data-oi-table-viewport]'),tableTabs=Array.from(document.querySelectorAll('[data-oi-table-tab]')),tableImgs=Array.from(document.querySelectorAll('[data-oi-table-img][data-table]'));
  let scale=1;
  function applyScale(){mapImgs.forEach(i=>i.style.transform=`scale(${scale})`);tableImgs.forEach(i=>i.style.transform=`scale(${scale})`);}
  function openBackdrop(b){b.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
  function closeBackdrop(b){b.setAttribute('aria-hidden','true');document.body.style.overflow='';}
  function showMap(n){mapImgs.forEach(i=>i.style.display=(i.getAttribute('data-map')===String(n))?'block':'none');mapTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-map-tab')===String(n)));if(mapViewport){mapViewport.scrollTop=0;mapViewport.scrollLeft=0;}}
  function showTable(n){tableImgs.forEach(i=>i.style.display=(i.getAttribute('data-table')===String(n))?'block':'none');tableTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-table-tab')===String(n)));if(tableViewport){tableViewport.scrollTop=0;tableViewport.scrollLeft=0;}}
  if(mapBtn&&mapBackdrop&&mapCloseBtn&&mapViewport&&mapImgs.length){mapBtn.addEventListener('click',()=>openBackdrop(mapBackdrop));mapCloseBtn.addEventListener('click',()=>closeBackdrop(mapBackdrop));mapBackdrop.addEventListener('click',e=>{if(e.target===mapBackdrop)closeBackdrop(mapBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(mapBackdrop);});mapTabs.forEach(t=>t.addEventListener('click',()=>showMap(t.getAttribute('data-oi-map-tab'))));mapViewport.addEventListener('wheel',e=>{if(mapBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showMap(1);}
  if(tableBtn&&tableBackdrop&&tableCloseBtn&&tableViewport&&tableImgs.length){tableBtn.addEventListener('click',()=>openBackdrop(tableBackdrop));tableCloseBtn.addEventListener('click',()=>closeBackdrop(tableBackdrop));tableBackdrop.addEventListener('click',e=>{if(e.target===tableBackdrop)closeBackdrop(tableBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(tableBackdrop);});tableTabs.forEach(t=>t.addEventListener('click',()=>showTable(t.getAttribute('data-oi-table-tab'))));tableViewport.addEventListener('wheel',e=>{if(tableBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showTable(1);}
  applyScale();
})();
</script>
