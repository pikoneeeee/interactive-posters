<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Основания: классификация, свойства, получение</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #14532d, #166534, #052e16);
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
        }
        .heading-font { font-family: 'Montserrat', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .rounded-custom { border-radius: 2.5rem; }
        .lang-btn { transition: all 0.2s; }
        .lang-btn.active { background: #4ade80; color: #052e16; border-color: transparent; font-weight: 800; }
        .tab-btn { transition: all 0.2s; cursor: pointer; }
        .tab-btn.active { background: rgba(74, 222, 128, 0.2); border-color: #4ade80; }
        .formula-style { font-family: 'Courier New', monospace; }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="glass rounded-custom p-8 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 id="main-title" class="heading-font text-3xl md:text-5xl uppercase tracking-tight text-green-400"></h1>
            <p id="sub-title" class="mt-2 text-white/60 font-light"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="setLang('ru')" id="btn-ru" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">RU</button>
            <button onclick="setLang('kz')" id="btn-kz" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">KZ</button>
            <button onclick="setLang('en')" id="btn-en" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">EN</button>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">
        <div class="lg:col-span-5 glass rounded-custom p-8">
            <h2 id="general-heading" class="heading-font text-xl mb-4 opacity-80 uppercase tracking-wider"></h2>

            <div class="bg-black/30 rounded-2xl p-6 mb-5 border border-green-500/20 text-center">
                <div id="general-formula-label" class="text-xs text-green-300 uppercase tracking-widest mb-2"></div>
                <div class="text-4xl formula-style text-green-300 font-bold">M(OH)ₙ</div>
                <div id="general-legend" class="text-xs text-white/60 mt-3"></div>
            </div>

            <h3 id="classify-heading" class="heading-font text-lg mb-3 text-green-300"></h3>
            <div class="space-y-2">
                <div class="bg-white/5 rounded-2xl p-4 border border-white/10">
                    <div class="flex justify-between items-center">
                        <div id="cls1-title" class="font-bold text-green-300"></div>
                        <div class="formula-style text-sm text-white/80">NaOH, KOH</div>
                    </div>
                    <p id="cls1-desc" class="text-white/70 text-sm mt-1"></p>
                </div>
                <div class="bg-white/5 rounded-2xl p-4 border border-white/10">
                    <div class="flex justify-between items-center">
                        <div id="cls2-title" class="font-bold text-green-300"></div>
                        <div class="formula-style text-sm text-white/80">Cu(OH)₂</div>
                    </div>
                    <p id="cls2-desc" class="text-white/70 text-sm mt-1"></p>
                </div>
                <div class="bg-white/5 rounded-2xl p-4 border border-white/10">
                    <div class="flex justify-between items-center">
                        <div id="cls3-title" class="font-bold text-green-300"></div>
                        <div class="formula-style text-sm text-white/80">Al(OH)₃, Zn(OH)₂</div>
                    </div>
                    <p id="cls3-desc" class="text-white/70 text-sm mt-1"></p>
                </div>
            </div>
        </div>

        <div class="lg:col-span-7 glass rounded-custom p-8 border-l-4 border-green-400">
            <div class="flex flex-wrap gap-2 mb-5">
                <button onclick="setTab('props')" id="tab-props" class="tab-btn glass px-4 py-2 rounded-full border border-white/15 text-sm font-bold"></button>
                <button onclick="setTab('prep')" id="tab-prep" class="tab-btn glass px-4 py-2 rounded-full border border-white/15 text-sm font-bold"></button>
                <button onclick="setTab('uses')" id="tab-uses" class="tab-btn glass px-4 py-2 rounded-full border border-white/15 text-sm font-bold"></button>
            </div>

            <h3 id="tab-title" class="heading-font text-2xl mb-4 text-green-300"></h3>
            <div id="tab-body" class="space-y-3"></div>
        </div>
    </main>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
        <div class="glass rounded-custom p-8 hover:bg-green-500/10 transition-colors">
            <div class="w-14 h-14 bg-green-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🧼</div>
            <h4 id="card1-title" class="heading-font text-2xl mb-3 text-green-300"></h4>
            <p id="card1-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-green-500/10 transition-colors">
            <div class="w-14 h-14 bg-green-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🔬</div>
            <h4 id="card2-title" class="heading-font text-2xl mb-3 text-green-300"></h4>
            <p id="card2-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-green-500/10 transition-colors">
            <div class="w-14 h-14 bg-green-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">⚠️</div>
            <h4 id="card3-title" class="heading-font text-2xl mb-3 text-green-300"></h4>
            <p id="card3-desc" class="text-white/70 leading-relaxed"></p>
        </div>
    </section>

    <footer class="glass rounded-custom p-10 text-center">
        <p id="quote-text" class="text-2xl md:text-3xl italic font-light leading-snug mb-4"></p>
        <cite id="quote-author" class="text-green-400 font-bold uppercase tracking-widest text-sm"></cite>
    </footer>

    <script>
        const translations = {
            ru: {
                title: "Основания",
                subtitle: "Гидроксиды металлов: щёлочи и не только",
                generalHeading: "Общая формула",
                generalFormulaLabel: "Основание",
                generalLegend: "M — атом металла, n — его валентность",
                classifyHeading: "Классификация",
                classes: [
                    { title: "Щёлочи (растворимые)", desc: "Гидроксиды щелочных и щёлочно-земельных металлов." },
                    { title: "Нерастворимые", desc: "Не диссоциируют в воде. Большинство гидроксидов." },
                    { title: "Амфотерные", desc: "Реагируют и с кислотами, и со щелочами." }
                ],
                tabs: { props: "Свойства", prep: "Получение", uses: "Применение" },
                content: {
                    props: {
                        title: "Химические свойства",
                        items: [
                            { eq: "NaOH + HCl → NaCl + H₂O", desc: "Реакция нейтрализации со всеми кислотами с образованием соли и воды." },
                            { eq: "2 NaOH + CO₂ → Na₂CO₃ + H₂O", desc: "Реакция щелочей с кислотными оксидами." },
                            { eq: "2 NaOH + CuSO₄ → Cu(OH)₂↓ + Na₂SO₄", desc: "Реакция со многими солями — выпадает осадок." },
                            { eq: "Cu(OH)₂ → CuO + H₂O", desc: "Нерастворимые основания разлагаются при нагревании." }
                        ]
                    },
                    prep: {
                        title: "Способы получения",
                        items: [
                            { eq: "2 Na + 2 H₂O → 2 NaOH + H₂↑", desc: "Активный металл (щелочные, щ-зем) + вода → щёлочь + водород." },
                            { eq: "CaO + H₂O → Ca(OH)₂", desc: "Гашение извести: основной оксид + вода → щёлочь." },
                            { eq: "FeCl₃ + 3 NaOH → Fe(OH)₃↓ + 3 NaCl", desc: "Соль + щёлочь → нерастворимое основание (осадок)." },
                            { eq: "2 NaCl + 2 H₂O → 2 NaOH + Cl₂↑ + H₂↑", desc: "Промышленный способ — электролиз раствора NaCl." }
                        ]
                    },
                    uses: {
                        title: "Применение",
                        items: [
                            { eq: "🧼 NaOH", desc: "Производство мыла, бумаги, искусственных волокон, чистящих средств." },
                            { eq: "🏗️ Ca(OH)₂", desc: "Гашёная известь — побелка стен, кладочный раствор, нейтрализация кислых почв в сельском хозяйстве." },
                            { eq: "🏥 Mg(OH)₂", desc: "Антацид: нейтрализует избыток соляной кислоты в желудке при изжоге." },
                            { eq: "💧 NH₄OH", desc: "Нашатырный спирт — в медицине при обмороках, в быту для чистки." }
                        ]
                    }
                },
                cards: [
                    { title: "Распознавание", desc: "Фенолфталеин в щёлочи становится малиновым, лакмус — синим, метилоранж — жёлтым. Это качественные реакции на ОН⁻." },
                    { title: "Нейтрализация", desc: "Реакция кислоты со щёлочью идёт быстро и до конца, выделяется тепло. На ней основано действие средств от изжоги." },
                    { title: "Безопасность", desc: "Щёлочи едкие: разъедают кожу, ткани, бумагу. При попадании на кожу — обильно промыть водой и слабым раствором уксуса." }
                ],
                quote: "«Щёлочь — это кислота наоборот: то, чего так не хватает кислоте, у щёлочи есть в избытке»",
                author: "Принцип кислотно-щелочного равновесия"
            },
            kz: {
                title: "Негіздер",
                subtitle: "Металдар гидроксидтері: сілтілер және басқалар",
                generalHeading: "Жалпы формула",
                generalFormulaLabel: "Негіз",
                generalLegend: "M — метал атомы, n — оның валенттілігі",
                classifyHeading: "Жіктелуі",
                classes: [
                    { title: "Сілтілер (еритін)", desc: "Сілтілік және сілтілік-жер металдарының гидроксидтері." },
                    { title: "Ерімейтін", desc: "Суда диссоциацияланбайды. Гидроксидтердің көпшілігі." },
                    { title: "Амфотерлік", desc: "Қышқылдармен де, сілтілермен де әрекеттеседі." }
                ],
                tabs: { props: "Қасиеттері", prep: "Алу", uses: "Қолданылуы" },
                content: {
                    props: {
                        title: "Химиялық қасиеттері",
                        items: [
                            { eq: "NaOH + HCl → NaCl + H₂O", desc: "Барлық қышқылдармен бейтараптау реакциясы: тұз және су түзіледі." },
                            { eq: "2 NaOH + CO₂ → Na₂CO₃ + H₂O", desc: "Сілтілердің қышқылдық оксидтермен әрекеттесуі." },
                            { eq: "2 NaOH + CuSO₄ → Cu(OH)₂↓ + Na₂SO₄", desc: "Көп тұздармен әрекеттеседі — тұнба түседі." },
                            { eq: "Cu(OH)₂ → CuO + H₂O", desc: "Ерімейтін негіздер қыздырғанда ыдырайды." }
                        ]
                    },
                    prep: {
                        title: "Алу тәсілдері",
                        items: [
                            { eq: "2 Na + 2 H₂O → 2 NaOH + H₂↑", desc: "Белсенді метал (сілтілік, сілтілік-жер) + су → сілті + сутегі." },
                            { eq: "CaO + H₂O → Ca(OH)₂", desc: "Әкті сөндіру: негіздік оксид + су → сілті." },
                            { eq: "FeCl₃ + 3 NaOH → Fe(OH)₃↓ + 3 NaCl", desc: "Тұз + сілті → ерімейтін негіз (тұнба)." },
                            { eq: "2 NaCl + 2 H₂O → 2 NaOH + Cl₂↑ + H₂↑", desc: "Өнеркәсіптік әдіс — NaCl ерітіндісінің электролизі." }
                        ]
                    },
                    uses: {
                        title: "Қолданылуы",
                        items: [
                            { eq: "🧼 NaOH", desc: "Сабын, қағаз, жасанды талшық, тазалағыш құрал өндірісі." },
                            { eq: "🏗️ Ca(OH)₂", desc: "Сөнген әк — қабырғаны әктеу, қалау ерітіндісі, ауыл шаруашылығында қышқыл топырақты бейтараптау." },
                            { eq: "🏥 Mg(OH)₂", desc: "Антацид: асқазандағы артық тұз қышқылын бейтараптайды." },
                            { eq: "💧 NH₄OH", desc: "Нашатыр спирті — медицинада есеңгіреген кезде, тұрмыста тазалау үшін." }
                        ]
                    }
                },
                cards: [
                    { title: "Тану", desc: "Фенолфталеин сілтіде таңқурайдай түс береді, лакмус — көк, метилоранж — сары. Бұл OH⁻-ге сапалық реакциялар." },
                    { title: "Бейтараптау", desc: "Қышқыл + сілті реакциясы тез әрі толық жүреді, жылу бөлінеді. Асқазан ауыруына қарсы дәрі осыған негізделген." },
                    { title: "Қауіпсіздік", desc: "Сілтілер күйдіргіш: теріні, мата, қағазды зақымдайды. Теріге тигенде — мол сумен және әлсіз сірке ерітіндісімен жуу керек." }
                ],
                quote: "«Сілті — кері қышқыл: қышқылда жетпейтін нәрсе сілтіде көп»",
                author: "Қышқыл-сілті тепе-теңдік қағидасы"
            },
            en: {
                title: "Bases",
                subtitle: "Metal hydroxides: alkalis and beyond",
                generalHeading: "General formula",
                generalFormulaLabel: "Base",
                generalLegend: "M — metal atom, n — its valency",
                classifyHeading: "Classification",
                classes: [
                    { title: "Alkalis (soluble)", desc: "Hydroxides of alkali and alkaline-earth metals." },
                    { title: "Insoluble", desc: "Do not dissociate in water. Most hydroxides." },
                    { title: "Amphoteric", desc: "React with both acids and alkalis." }
                ],
                tabs: { props: "Properties", prep: "Preparation", uses: "Applications" },
                content: {
                    props: {
                        title: "Chemical properties",
                        items: [
                            { eq: "NaOH + HCl → NaCl + H₂O", desc: "Neutralisation with any acid: salt and water are formed." },
                            { eq: "2 NaOH + CO₂ → Na₂CO₃ + H₂O", desc: "Reaction of alkalis with acidic oxides." },
                            { eq: "2 NaOH + CuSO₄ → Cu(OH)₂↓ + Na₂SO₄", desc: "Reaction with many salts — a precipitate forms." },
                            { eq: "Cu(OH)₂ → CuO + H₂O", desc: "Insoluble bases decompose on heating." }
                        ]
                    },
                    prep: {
                        title: "Methods of preparation",
                        items: [
                            { eq: "2 Na + 2 H₂O → 2 NaOH + H₂↑", desc: "Active metal (alkali, alkaline-earth) + water → alkali + hydrogen." },
                            { eq: "CaO + H₂O → Ca(OH)₂", desc: "Slaking lime: basic oxide + water → alkali." },
                            { eq: "FeCl₃ + 3 NaOH → Fe(OH)₃↓ + 3 NaCl", desc: "Salt + alkali → insoluble base (precipitate)." },
                            { eq: "2 NaCl + 2 H₂O → 2 NaOH + Cl₂↑ + H₂↑", desc: "Industrial route — electrolysis of NaCl brine." }
                        ]
                    },
                    uses: {
                        title: "Applications",
                        items: [
                            { eq: "🧼 NaOH", desc: "Soap, paper, synthetic fibres and cleaning agents." },
                            { eq: "🏗️ Ca(OH)₂", desc: "Slaked lime — wall whitewashing, mortar, neutralising acid farmland soils." },
                            { eq: "🏥 Mg(OH)₂", desc: "Antacid: neutralises excess stomach acid in heartburn." },
                            { eq: "💧 NH₄OH", desc: "Ammonia water — medical smelling salt and household cleaner." }
                        ]
                    }
                },
                cards: [
                    { title: "Identification", desc: "Phenolphthalein turns crimson in alkali, litmus turns blue, methyl orange turns yellow — qualitative tests for OH⁻." },
                    { title: "Neutralisation", desc: "Acid + alkali is fast, complete and exothermic. This is exactly how heartburn medicines work." },
                    { title: "Safety", desc: "Alkalis are caustic — they damage skin, fabric, paper. If splashed on skin, rinse with plenty of water and a weak vinegar solution." }
                ],
                quote: "«An alkali is an acid in reverse — what an acid lacks, an alkali has in excess»",
                author: "Acid–base balance principle"
            }
        };

        let currentLang = 'ru';
        let currentTab = 'props';

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            try { localStorage.setItem('poster_lang', lang); } catch(e){}
            updateUI();
        }

        function setTab(t) {
            currentTab = t;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + t).classList.add('active');
            renderTab();
        }

        function renderTab() {
            const t = translations[currentLang];
            const c = t.content[currentTab];
            document.getElementById('tab-title').textContent = c.title;
            document.getElementById('tab-body').innerHTML = c.items.map(it => `
                <div class="bg-white/5 rounded-2xl p-4 border border-white/10">
                    <div class="formula-style text-green-300 font-bold mb-1">${it.eq}</div>
                    <div class="text-white/70 text-sm leading-relaxed">${it.desc}</div>
                </div>
            `).join('');
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('sub-title').textContent = t.subtitle;
            document.getElementById('general-heading').textContent = t.generalHeading;
            document.getElementById('general-formula-label').textContent = t.generalFormulaLabel;
            document.getElementById('general-legend').textContent = t.generalLegend;
            document.getElementById('classify-heading').textContent = t.classifyHeading;
            for (let i = 0; i < 3; i++) {
                document.getElementById('cls' + (i+1) + '-title').textContent = t.classes[i].title;
                document.getElementById('cls' + (i+1) + '-desc').textContent = t.classes[i].desc;
            }
            document.getElementById('tab-props').textContent = t.tabs.props;
            document.getElementById('tab-prep').textContent = t.tabs.prep;
            document.getElementById('tab-uses').textContent = t.tabs.uses;
            renderTab();
            for (let i = 0; i < 3; i++) {
                document.getElementById('card' + (i+1) + '-title').textContent = t.cards[i].title;
                document.getElementById('card' + (i+1) + '-desc').textContent = t.cards[i].desc;
            }
            document.getElementById('quote-text').textContent = t.quote;
            document.getElementById('quote-author').textContent = t.author;
        }

        window.onload = () => {
            let s = 'ru';
            try { s = localStorage.getItem('poster_lang') || 'ru'; } catch(e){}
            if (s === 'kk') s = 'kz';
            setTab('props');
            setLang(s);
        };
    </script>

.oi-map-tabs{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto;}
.oi-map-tab{min-width:36px;height:34px;padding:0 10px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.35);color:#fff;cursor:pointer;font:600 14px system-ui,-apple-system,Segoe UI,Roboto,Arial;}
.oi-map-tab.is-active{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.45);}
.oi-map-hint{pointer-events:none;color:#fff;opacity:.85;font:12px/1.2 system-ui,-apple-system,Segoe UI,Roboto,Arial;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);padding:8px 10px;border-radius:10px;}
</style>

<button class="oi-map-btn" style="display:none" type="button" data-oi-map-btn>🗺️ Карта</button>
<button class="oi-table-btn" type="button" data-oi-table-btn>🧪 Таблица</button>

<div class="oi-map-backdrop" aria-hidden="true" data-oi-map-backdrop>
  <div class="oi-map-modal" role="dialog" aria-modal="true" aria-label="Карта">
    <button class="oi-map-close" type="button" aria-label="Закрыть" data-oi-map-close>×</button>
    <div class="oi-map-toolbar"><div class="oi-map-tabs"><button type="button" class="oi-map-tab is-active" data-oi-map-tab="1">1</button></div><div class="oi-map-hint">Колёсико/трекпад — зум • Esc — закрыть</div></div>
    <div class="oi-map-viewport" data-oi-map-viewport><img class="oi-map-img" data-oi-map-img data-map="1" src="../../assets/maps/mendeleev_1.png" alt="map 1" style="display:block;"></div>
  </div>
</div>

<div class="oi-map-backdrop" aria-hidden="true" data-oi-table-backdrop>
  <div class="oi-map-modal" role="dialog" aria-modal="true" aria-label="Таблица Менделеева">
    <button class="oi-map-close" type="button" aria-label="Закрыть" data-oi-table-close>×</button>
    <div class="oi-map-toolbar"><div class="oi-map-tabs"><button type="button" class="oi-map-tab is-active" data-oi-table-tab="1">1</button><button type="button" class="oi-map-tab" data-oi-table-tab="2">2</button></div><div class="oi-map-hint">Таблица Менделеева • Esc — закрыть</div></div>
    <div class="oi-map-viewport" data-oi-table-viewport><img class="oi-map-img" data-oi-table-img data-table="1" src="../../assets/maps/mendeleev_1.png" alt="table 1" style="display:block;"><img class="oi-map-img" data-oi-table-img data-table="2" src="../../assets/maps/mendeleev_2.png" alt="table 2" style="display:none;"></div>
  </div>
</div>

<script data-oi-map-overlay>
(function(){
  const mapBtn=document.querySelector('[data-oi-map-btn]'),mapBackdrop=document.querySelector('[data-oi-map-backdrop]'),mapCloseBtn=document.querySelector('[data-oi-map-close]'),mapViewport=document.querySelector('[data-oi-map-viewport]'),mapTabs=Array.from(document.querySelectorAll('[data-oi-map-tab]')),mapImgs=Array.from(document.querySelectorAll('[data-oi-map-img][data-map]'));
  const tableBtn=document.querySelector('[data-oi-table-btn]'),tableBackdrop=document.querySelector('[data-oi-table-backdrop]'),tableCloseBtn=document.querySelector('[data-oi-table-close]'),tableViewport=document.querySelector('[data-oi-table-viewport]'),tableTabs=Array.from(document.querySelectorAll('[data-oi-table-tab]')),tableImgs=Array.from(document.querySelectorAll('[data-oi-table-img][data-table]'));
  let scale=1;
  function applyScale(){mapImgs.forEach(i=>i.style.transform=`scale(${scale})`);tableImgs.forEach(i=>i.style.transform=`scale(${scale})`);}
  function openBackdrop(b){b.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
  function closeBackdrop(b){b.setAttribute('aria-hidden','true');document.body.style.overflow='';}
  function showMap(n){mapImgs.forEach(i=>i.style.display=(i.getAttribute('data-map')===String(n))?'block':'none');mapTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-map-tab')===String(n)));if(mapViewport){mapViewport.scrollTop=0;mapViewport.scrollLeft=0;}}
  function showTable(n){tableImgs.forEach(i=>i.style.display=(i.getAttribute('data-table')===String(n))?'block':'none');tableTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-table-tab')===String(n)));if(tableViewport){tableViewport.scrollTop=0;tableViewport.scrollLeft=0;}}
  if(mapBtn&&mapBackdrop&&mapCloseBtn&&mapViewport&&mapImgs.length){mapBtn.addEventListener('click',()=>openBackdrop(mapBackdrop));mapCloseBtn.addEventListener('click',()=>closeBackdrop(mapBackdrop));mapBackdrop.addEventListener('click',e=>{if(e.target===mapBackdrop)closeBackdrop(mapBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(mapBackdrop);});mapTabs.forEach(t=>t.addEventListener('click',()=>showMap(t.getAttribute('data-oi-map-tab'))));mapViewport.addEventListener('wheel',e=>{if(mapBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showMap(1);}
  if(tableBtn&&tableBackdrop&&tableCloseBtn&&tableViewport&&tableImgs.length){tableBtn.addEventListener('click',()=>openBackdrop(tableBackdrop));tableCloseBtn.addEventListener('click',()=>closeBackdrop(tableBackdrop));tableBackdrop.addEventListener('click',e=>{if(e.target===tableBackdrop)closeBackdrop(tableBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(tableBackdrop);});tableTabs.forEach(t=>t.addEventListener('click',()=>showTable(t.getAttribute('data-oi-table-tab'))));tableViewport.addEventListener('wheel',e=>{if(tableBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showTable(1);}
  applyScale();
})();
</script>
</body>
</html>
