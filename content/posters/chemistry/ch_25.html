<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свойства кислорода</title>
    <link rel="stylesheet" href="../../libs/tailwind.min.css">
    <link rel="stylesheet" href="../../libs/fonts.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #7f1d1d, #991b1b, #1c1917);
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
        }
        .heading-font { font-family: 'Montserrat', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .rounded-custom { border-radius: 2.5rem; }
        .lang-btn { transition: all 0.2s; }
        .lang-btn.active { background: #f87171; color: #1c1917; border-color: transparent; font-weight: 800; }
        .tab-btn { transition: all 0.2s; cursor: pointer; }
        .tab-btn.active { background: rgba(248, 113, 113, 0.2); border-color: #f87171; }
        .formula-style { font-family: 'Courier New', monospace; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        .o-atom { animation: float 3s ease-in-out infinite; }
        .o-atom-2 { animation: float 3s ease-in-out infinite reverse; }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="glass rounded-custom p-8 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 id="main-title" class="heading-font text-3xl md:text-5xl uppercase tracking-tight text-red-400"></h1>
            <p id="sub-title" class="mt-2 text-white/60 font-light"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="setLang('ru')" id="btn-ru" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">RU</button>
            <button onclick="setLang('kz')" id="btn-kz" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">KZ</button>
            <button onclick="setLang('en')" id="btn-en" class="lang-btn px-6 py-2 rounded-full border border-white/20 font-bold">EN</button>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">
        <div class="lg:col-span-5 glass rounded-custom p-8 flex flex-col items-center">
            <h2 id="molecule-heading" class="heading-font text-xl mb-4 opacity-80 uppercase tracking-wider self-start"></h2>
            <svg viewBox="0 0 360 320" class="w-full max-w-[360px]">
                <line x1="130" y1="160" x2="230" y2="160" stroke="#f87171" stroke-width="8"/>
                <line x1="130" y1="150" x2="230" y2="150" stroke="#f87171" stroke-width="8"/>
                <line x1="130" y1="170" x2="230" y2="170" stroke="#f87171" stroke-width="8" opacity="0.5"/>
                <circle class="o-atom" cx="120" cy="160" r="55" fill="url(#oxGrad1)" stroke="#fee2e2" stroke-width="3"/>
                <circle class="o-atom-2" cx="240" cy="160" r="55" fill="url(#oxGrad2)" stroke="#fee2e2" stroke-width="3"/>
                <text x="120" y="167" text-anchor="middle" fill="white" font-size="32" font-weight="bold">O</text>
                <text x="240" y="167" text-anchor="middle" fill="white" font-size="32" font-weight="bold">O</text>
                <text id="svg-mol-name" x="180" y="270" text-anchor="middle" fill="#fecaca" font-size="18" font-weight="bold"></text>
                <text id="svg-mol-mass" x="180" y="295" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="13"></text>
                <defs>
                    <radialGradient id="oxGrad1"><stop offset="0%" stop-color="#fca5a5"/><stop offset="100%" stop-color="#b91c1c"/></radialGradient>
                    <radialGradient id="oxGrad2"><stop offset="0%" stop-color="#fca5a5"/><stop offset="100%" stop-color="#b91c1c"/></radialGradient>
                </defs>
            </svg>
            <div class="grid grid-cols-2 gap-3 w-full mt-4">
                <div class="bg-white/5 rounded-xl p-3 border border-white/10">
                    <div class="text-xs text-white/50 uppercase tracking-wider" id="prop-tbo-label"></div>
                    <div class="text-lg font-bold text-red-300">−183 °C</div>
                </div>
                <div class="bg-white/5 rounded-xl p-3 border border-white/10">
                    <div class="text-xs text-white/50 uppercase tracking-wider" id="prop-tpl-label"></div>
                    <div class="text-lg font-bold text-red-300">−219 °C</div>
                </div>
                <div class="bg-white/5 rounded-xl p-3 border border-white/10">
                    <div class="text-xs text-white/50 uppercase tracking-wider" id="prop-color-label"></div>
                    <div id="prop-color-value" class="text-lg font-bold text-red-300"></div>
                </div>
                <div class="bg-white/5 rounded-xl p-3 border border-white/10">
                    <div class="text-xs text-white/50 uppercase tracking-wider" id="prop-solub-label"></div>
                    <div id="prop-solub-value" class="text-lg font-bold text-red-300"></div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-7 glass rounded-custom p-8 border-l-4 border-red-500">
            <h3 id="reactions-heading" class="heading-font text-xl mb-4 text-red-300 uppercase tracking-wider"></h3>

            <div class="flex flex-wrap gap-2 mb-5">
                <button onclick="setReaction('S')" id="rxn-S" class="tab-btn glass px-4 py-2 rounded-full border border-white/15 text-sm font-bold">S + O₂</button>
                <button onclick="setReaction('C')" id="rxn-C" class="tab-btn glass px-4 py-2 rounded-full border border-white/15 text-sm font-bold">C + O₂</button>
                <button onclick="setReaction('Mg')" id="rxn-Mg" class="tab-btn glass px-4 py-2 rounded-full border border-white/15 text-sm font-bold">Mg + O₂</button>
                <button onclick="setReaction('Fe')" id="rxn-Fe" class="tab-btn glass px-4 py-2 rounded-full border border-white/15 text-sm font-bold">Fe + O₂</button>
            </div>

            <div class="bg-black/30 rounded-2xl p-6 mb-5 border border-red-500/20">
                <div id="rxn-equation" class="text-center text-2xl md:text-3xl formula-style text-red-300 mb-3"></div>
                <div id="rxn-name" class="text-center text-white/70 text-sm"></div>
            </div>

            <h4 id="rxn-details-title" class="font-bold text-red-300 mb-2"></h4>
            <p id="rxn-details-text" class="text-white/80 leading-relaxed"></p>
        </div>
    </main>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
        <div class="glass rounded-custom p-8 hover:bg-red-500/10 transition-colors">
            <div class="w-14 h-14 bg-red-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🌬️</div>
            <h4 id="card1-title" class="heading-font text-2xl mb-3 text-red-300"></h4>
            <p id="card1-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-red-500/10 transition-colors">
            <div class="w-14 h-14 bg-red-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🧪</div>
            <h4 id="card2-title" class="heading-font text-2xl mb-3 text-red-300"></h4>
            <p id="card2-desc" class="text-white/70 leading-relaxed"></p>
        </div>
        <div class="glass rounded-custom p-8 hover:bg-red-500/10 transition-colors">
            <div class="w-14 h-14 bg-red-500/20 rounded-2xl mb-4 flex items-center justify-center text-3xl">🏥</div>
            <h4 id="card3-title" class="heading-font text-2xl mb-3 text-red-300"></h4>
            <p id="card3-desc" class="text-white/70 leading-relaxed"></p>
        </div>
    </section>

    <footer class="glass rounded-custom p-10 text-center">
        <p id="quote-text" class="text-2xl md:text-3xl italic font-light leading-snug mb-4"></p>
        <cite id="quote-author" class="text-red-400 font-bold uppercase tracking-widest text-sm"></cite>
    </footer>

    <script>
        const translations = {
            ru: {
                title: "Свойства кислорода",
                subtitle: "O₂ — окислитель №1 в природе и технике",
                moleculeHeading: "Молекула O₂",
                molName: "Кислород, O₂",
                molMass: "Mᵣ = 32 • газ при н.у.",
                propTBO: "Т. кипения",
                propTPL: "Т. плавления",
                propColor: "Цвет",
                colorValue: "Без цвета",
                propSolub: "Растворимость в воде",
                solubValue: "Слабая",
                reactionsHeading: "Реакции с кислородом",
                reactions: {
                    S:  { eq: "S + O₂ → SO₂", name: "Горение серы", title: "Образование оксида серы(IV)", text: "Сера загорается синеватым пламенем, образуя удушливый газ SO₂ — оксид серы(IV). Этот газ — основа производства серной кислоты." },
                    C:  { eq: "C + O₂ → CO₂", name: "Горение углерода", title: "Образование углекислого газа", text: "Уголь горит, выделяя тепло и CO₂. При недостатке O₂ образуется угарный газ CO — ядовитый продукт неполного сгорания." },
                    Mg: { eq: "2 Mg + O₂ → 2 MgO", name: "Горение магния", title: "Образование оксида магния", text: "Магний горит ослепительно-белым пламенем. Используется в пиротехнике и фотовспышках. Продукт — белый порошок MgO." },
                    Fe: { eq: "3 Fe + 2 O₂ → Fe₃O₄", name: "Горение железа", title: "Образование железной окалины", text: "Раскалённое железо в кислороде горит снопом искр, образуя смесь оксидов — железную окалину Fe₃O₄." }
                },
                cards: [
                    { title: "Где встречается", desc: "21% воздуха, 49% массы земной коры, 89% массы воды. Кислород — самый распространённый элемент на Земле." },
                    { title: "Получение", desc: "В лаборатории — разложением KMnO₄, KClO₃ или H₂O₂. В промышленности — разделением жидкого воздуха." },
                    { title: "Применение", desc: "Медицина (баллоны для дыхания), металлургия (выплавка стали), ракетное топливо (жидкий O₂), сварка (кислородно-ацетиленовая)." }
                ],
                quote: "«Кислород — это воздух жизни и пламя горения одновременно»",
                author: "Антуан Лавуазье"
            },
            kz: {
                title: "Оттегінің қасиеттері",
                subtitle: "O₂ — табиғат пен техникадағы №1 тотықтырғыш",
                moleculeHeading: "O₂ молекуласы",
                molName: "Оттегі, O₂",
                molMass: "Mᵣ = 32 • қ.ж.-да газ",
                propTBO: "Қайнау т-сы",
                propTPL: "Балқу т-сы",
                propColor: "Түсі",
                colorValue: "Түссіз",
                propSolub: "Суда ерігіштігі",
                solubValue: "Аз",
                reactionsHeading: "Оттегімен реакциялар",
                reactions: {
                    S:  { eq: "S + O₂ → SO₂", name: "Күкірттің жануы", title: "Күкірт(IV) оксидінің түзілуі", text: "Күкірт көгілдір жалынмен жанып, тұншықтырғыш SO₂ — күкірт(IV) оксидін түзеді. Бұл газ — күкірт қышқылы өндірісінің негізі." },
                    C:  { eq: "C + O₂ → CO₂", name: "Көміртектің жануы", title: "Көмірқышқыл газының түзілуі", text: "Көмір жанғанда жылу мен CO₂ бөлінеді. O₂ жетіспегенде улы CO — иіс газы түзіледі." },
                    Mg: { eq: "2 Mg + O₂ → 2 MgO", name: "Магнийдің жануы", title: "Магний оксидінің түзілуі", text: "Магний шамдай ақ жалынмен жанады. Пиротехникада, фотожарықта қолданылады. Өнімі — ақ MgO ұнтағы." },
                    Fe: { eq: "3 Fe + 2 O₂ → Fe₃O₄", name: "Темірдің жануы", title: "Темір қаспағының түзілуі", text: "Қызған темір оттегіде ұшқын шашып жанады, темір қаспағы Fe₃O₄ түзіледі." }
                },
                cards: [
                    { title: "Қайда кездеседі", desc: "Ауаның 21%-ы, жер қыртысының 49%-ы, судың 89%-ы. Оттегі — Жердегі ең көп таралған элемент." },
                    { title: "Алу", desc: "Зертханада — KMnO₄, KClO₃ немесе H₂O₂ ыдыратып. Өнеркәсіпте — сұйық ауаны бөлу арқылы." },
                    { title: "Қолданылуы", desc: "Медицина (тыныс баллондары), металлургия (болат қорыту), зымыран отыны (сұйық O₂), дәнекерлеу." }
                ],
                quote: "«Оттегі — бір мезгілде тіршілік ауасы әрі жану жалыны»",
                author: "Антуан Лавуазье"
            },
            en: {
                title: "Properties of oxygen",
                subtitle: "O₂ — the #1 oxidiser in nature and technology",
                moleculeHeading: "The O₂ molecule",
                molName: "Oxygen, O₂",
                molMass: "Mᵣ = 32 • gas at STP",
                propTBO: "Boiling point",
                propTPL: "Melting point",
                propColor: "Colour",
                colorValue: "Colourless",
                propSolub: "Solubility in water",
                solubValue: "Low",
                reactionsHeading: "Reactions with oxygen",
                reactions: {
                    S:  { eq: "S + O₂ → SO₂", name: "Burning sulfur", title: "Formation of sulfur(IV) oxide", text: "Sulfur burns with a bluish flame producing SO₂ — the basis of sulfuric-acid manufacture." },
                    C:  { eq: "C + O₂ → CO₂", name: "Burning carbon", title: "Formation of carbon dioxide", text: "Coal burns releasing heat and CO₂. With too little O₂ the toxic carbon monoxide CO is produced instead." },
                    Mg: { eq: "2 Mg + O₂ → 2 MgO", name: "Burning magnesium", title: "Formation of magnesium oxide", text: "Magnesium burns with a dazzling white flame. Used in pyrotechnics and photo-flashes. The product is white MgO powder." },
                    Fe: { eq: "3 Fe + 2 O₂ → Fe₃O₄", name: "Burning iron", title: "Formation of iron mill scale", text: "Red-hot iron in oxygen burns with showers of sparks, forming mill-scale Fe₃O₄." }
                },
                cards: [
                    { title: "Where it is found", desc: "21% of air, 49% of Earth's crust, 89% of water. Oxygen is the most abundant element on Earth." },
                    { title: "Preparation", desc: "In the lab — by decomposition of KMnO₄, KClO₃ or H₂O₂. Industrially — by fractional distillation of liquid air." },
                    { title: "Applications", desc: "Medicine (breathing cylinders), metallurgy (steel-making), rocket fuel (liquid O₂), oxy-acetylene welding." }
                ],
                quote: "«Oxygen is the air of life and the flame of combustion at the same time»",
                author: "Antoine Lavoisier"
            }
        };

        let currentLang = 'ru';
        let currentRxn = 'S';

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            try { localStorage.setItem('poster_lang', lang); } catch(e){}
            updateUI();
        }

        function setReaction(r) {
            currentRxn = r;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('rxn-' + r).classList.add('active');
            updateRxn();
        }

        function updateRxn() {
            const t = translations[currentLang];
            const r = t.reactions[currentRxn];
            document.getElementById('rxn-equation').textContent = r.eq;
            document.getElementById('rxn-name').textContent = r.name;
            document.getElementById('rxn-details-title').textContent = r.title;
            document.getElementById('rxn-details-text').textContent = r.text;
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('sub-title').textContent = t.subtitle;
            document.getElementById('molecule-heading').textContent = t.moleculeHeading;
            document.getElementById('svg-mol-name').textContent = t.molName;
            document.getElementById('svg-mol-mass').textContent = t.molMass;
            document.getElementById('prop-tbo-label').textContent = t.propTBO;
            document.getElementById('prop-tpl-label').textContent = t.propTPL;
            document.getElementById('prop-color-label').textContent = t.propColor;
            document.getElementById('prop-color-value').textContent = t.colorValue;
            document.getElementById('prop-solub-label').textContent = t.propSolub;
            document.getElementById('prop-solub-value').textContent = t.solubValue;
            document.getElementById('reactions-heading').textContent = t.reactionsHeading;
            updateRxn();
            for (let i = 0; i < 3; i++) {
                document.getElementById('card' + (i+1) + '-title').textContent = t.cards[i].title;
                document.getElementById('card' + (i+1) + '-desc').textContent = t.cards[i].desc;
            }
            document.getElementById('quote-text').textContent = t.quote;
            document.getElementById('quote-author').textContent = t.author;
        }

        window.onload = () => {
            let s = 'ru';
            try { s = localStorage.getItem('poster_lang') || 'ru'; } catch(e){}
            if (s === 'kk') s = 'kz';
            setReaction('S');
            setLang(s);
        };
    </script>

<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>

<style data-oi-map-overlay>
.oi-map-btn{position:fixed;right:16px;bottom:16px;z-index:9999;padding:10px 14px;border-radius:999px;border:1px solid rgba(0,0,0,.15);background:#fff;cursor:pointer;font:600 14px/1.1 system-ui,-apple-system,Segoe UI,Roboto,Arial;box-shadow:0 8px 20px rgba(0,0,0,.12);}
.oi-table-btn{position:fixed;right:120px;bottom:16px;z-index:9999;padding:10px 14px;border-radius:999px;border:1px solid rgba(0,0,0,.15);background:#fff;cursor:pointer;font:600 14px/1.1 system-ui,-apple-system,Segoe UI,Roboto,Arial;box-shadow:0 8px 20px rgba(0,0,0,.12);}

</style>

<button class="oi-map-btn" style="display:none" type="button" data-oi-map-btn>🗺️ Карта</button>
<button class="oi-table-btn" type="button" data-oi-table-btn>🧪 Таблица</button>

<div class="oi-map-backdrop" aria-hidden="true" data-oi-map-backdrop>
  <div class="oi-map-modal" role="dialog" aria-modal="true" aria-label="Карта">
    <button class="oi-map-close" type="button" aria-label="Закрыть" data-oi-map-close>×</button>
    <div class="oi-map-toolbar"><div class="oi-map-tabs"><button type="button" class="oi-map-tab is-active" data-oi-map-tab="1">1</button></div><div class="oi-map-hint">Колёсико/трекпад — зум • Esc — закрыть</div></div>
    <div class="oi-map-viewport" data-oi-map-viewport><img class="oi-map-img" data-oi-map-img data-map="1" src="../../assets/maps/mendeleev_1.png" alt="map 1" style="display:block;"></div>
  </div>
</div>

<div class="oi-map-backdrop" aria-hidden="true" data-oi-table-backdrop>
  <div class="oi-map-modal" role="dialog" aria-modal="true" aria-label="Таблица Менделеева">
    <button class="oi-map-close" type="button" aria-label="Закрыть" data-oi-table-close>×</button>
    <div class="oi-map-toolbar"><div class="oi-map-tabs"><button type="button" class="oi-map-tab is-active" data-oi-table-tab="1">1</button><button type="button" class="oi-map-tab" data-oi-table-tab="2">2</button></div><div class="oi-map-hint">Таблица Менделеева • Esc — закрыть</div></div>

<script data-oi-map-overlay>
(function(){
  const mapBtn=document.querySelector('[data-oi-map-btn]'),mapBackdrop=document.querySelector('[data-oi-map-backdrop]'),mapCloseBtn=document.querySelector('[data-oi-map-close]'),mapViewport=document.querySelector('[data-oi-map-viewport]'),mapTabs=Array.from(document.querySelectorAll('[data-oi-map-tab]')),mapImgs=Array.from(document.querySelectorAll('[data-oi-map-img][data-map]'));
  const tableBtn=document.querySelector('[data-oi-table-btn]'),tableBackdrop=document.querySelector('[data-oi-table-backdrop]'),tableCloseBtn=document.querySelector('[data-oi-table-close]'),tableViewport=document.querySelector('[data-oi-table-viewport]'),tableTabs=Array.from(document.querySelectorAll('[data-oi-table-tab]')),tableImgs=Array.from(document.querySelectorAll('[data-oi-table-img][data-table]'));
  let scale=1;
  function applyScale(){mapImgs.forEach(i=>i.style.transform=`scale(${scale})`);tableImgs.forEach(i=>i.style.transform=`scale(${scale})`);}
  function openBackdrop(b){b.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
  function closeBackdrop(b){b.setAttribute('aria-hidden','true');document.body.style.overflow='';}
  function showMap(n){mapImgs.forEach(i=>i.style.display=(i.getAttribute('data-map')===String(n))?'block':'none');mapTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-map-tab')===String(n)));if(mapViewport){mapViewport.scrollTop=0;mapViewport.scrollLeft=0;}}
  function showTable(n){tableImgs.forEach(i=>i.style.display=(i.getAttribute('data-table')===String(n))?'block':'none');tableTabs.forEach(t=>t.classList.toggle('is-active',t.getAttribute('data-oi-table-tab')===String(n)));if(tableViewport){tableViewport.scrollTop=0;tableViewport.scrollLeft=0;}}
  if(mapBtn&&mapBackdrop&&mapCloseBtn&&mapViewport&&mapImgs.length){mapBtn.addEventListener('click',()=>openBackdrop(mapBackdrop));mapCloseBtn.addEventListener('click',()=>closeBackdrop(mapBackdrop));mapBackdrop.addEventListener('click',e=>{if(e.target===mapBackdrop)closeBackdrop(mapBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(mapBackdrop);});mapTabs.forEach(t=>t.addEventListener('click',()=>showMap(t.getAttribute('data-oi-map-tab'))));mapViewport.addEventListener('wheel',e=>{if(mapBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showMap(1);}
  if(tableBtn&&tableBackdrop&&tableCloseBtn&&tableViewport&&tableImgs.length){tableBtn.addEventListener('click',()=>openBackdrop(tableBackdrop));tableCloseBtn.addEventListener('click',()=>closeBackdrop(tableBackdrop));tableBackdrop.addEventListener('click',e=>{if(e.target===tableBackdrop)closeBackdrop(tableBackdrop);});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackdrop(tableBackdrop);});tableTabs.forEach(t=>t.addEventListener('click',()=>showTable(t.getAttribute('data-oi-table-tab'))));tableViewport.addEventListener('wheel',e=>{if(tableBackdrop.getAttribute('aria-hidden')!=='false')return;e.preventDefault();const d=-Math.sign(e.deltaY)*0.1;scale=Math.min(4,Math.max(0.6,scale+d));applyScale();},{passive:false});showTable(1);}
  applyScale();
})();
</script>
