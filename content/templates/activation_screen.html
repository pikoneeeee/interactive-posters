<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Активация</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            max-width: 420px;
            width: 90%;
            text-align: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 32px;
        }
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            color: white;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            text-align: center;
            text-transform: uppercase;
            outline: none;
            transition: border-color 0.3s;
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            letter-spacing: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        input:focus {
            border-color: rgba(99, 102, 241, 0.8);
        }
        .hint {
            font-size: 12px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 24px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .status.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        .status.success {
            display: block;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }
        .status.loading {
            display: block;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
    <div class="container">
        <div class="logo">🔐</div>
        <h1>Активация продукта</h1>
        <p class="subtitle">Введите лицензионный ключ для активации</p>

        <div class="input-group">
            <input type="text" id="licenseKey"
                   placeholder="XXXX-XXXX-XXXX-XXXX-XXXX"
                   maxlength="24"
                   autocomplete="off"
                   spellcheck="false">
        </div>
        <button id="activateBtn" onclick="activateLicense()">Активировать</button>

        <div class="status" id="status"></div>
    </div>

    <script>
        let bridge = null;
        const input = document.getElementById('licenseKey');
        const btn = document.getElementById('activateBtn');
        const statusEl = document.getElementById('status');

        // Автоформатирование: добавляем дефисы при вводе
        input.addEventListener('input', function(e) {
            let val = this.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
            // Вставляем дефисы каждые 4 символа
            let parts = [];
            for (let i = 0; i < val.length && i < 20; i += 4) {
                parts.push(val.substring(i, i + 4));
            }
            this.value = parts.join('-');
        });

        // Enter для активации
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') activateLicense();
        });

        function showStatus(type, message) {
            statusEl.className = 'status ' + type;
            if (type === 'loading') {
                statusEl.innerHTML = '<span class="spinner"></span>' + message;
            } else {
                statusEl.innerHTML = (type === 'success' ? '✅ ' : '❌ ') + message;
            }
        }

        function activateLicense() {
            const key = input.value.trim();
            if (!key) {
                showStatus('error', 'Введите ключ лицензии');
                input.focus();
                return;
            }
            if (key.replace(/-/g, '').length !== 20) {
                showStatus('error', 'Ключ должен содержать 20 символов (без дефисов)');
                input.focus();
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Проверка...';
            showStatus('loading', 'Проверяю ключ...');

            if (typeof activationBridge !== 'undefined' && activationBridge) {
                activationBridge.activate(key);
            } else {
                showStatus('error', 'Ошибка связи с приложением. Перезапустите.');
                btn.disabled = false;
                btn.textContent = 'Активировать';
            }
        }

        // Функции обратной связи — вызываются из Python
        window.onActivationSuccess = function(message) {
            showStatus('success', message);
            btn.textContent = 'Активировано!';
            setTimeout(function() {
                // Python вызовет navigate
            }, 1500);
        };

        window.onActivationError = function(message) {
            showStatus('error', message);
            btn.disabled = false;
            btn.textContent = 'Активировать';
        };

        // WebChannel init
        if (typeof QWebChannel !== 'undefined' && typeof qt !== 'undefined') {
            new QWebChannel(qt.webChannelTransport, function(channel) {
                window.activationBridge = channel.objects.activationBridge;
            });
        }
    </script>
</body>
</html>
