<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор предмета</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: white;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
            flex-wrap: wrap;
            gap: 20px;
        }

        header h1 {
            font-size: 42px;
            font-weight: 800;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            flex: 1;
            text-align: center;
        }

        .lang-selector {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .lang-btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn:hover { background: rgba(255,255,255,0.2); }
        .lang-btn.active { background: white; color: #333; }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .subject-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 180px;
        }

        .subject-card:hover {
            transform: translateY(-10px) scale(1.05);
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .subject-card h2 { font-size: 22px; font-weight: 700; }

        .subject-card .icon {
            font-size: 48px;
            margin-bottom: 15px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .subject-card .icon.text-icon {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.18);
            border-radius: 14px;
            width: 64px;
            height: 64px;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            opacity: 0.8;
            font-size: 14px;
        }
    </style>
    <script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="lang-selector" style="visibility:hidden;">
                <button class="lang-btn">RU</button>
                <button class="lang-btn">KZ</button>
                <button class="lang-btn">EN</button>
            </div>
            <h1 id="page-title">Интерактивные плакаты</h1>
            <div class="lang-selector" id="lang-selector">
                <button class="lang-btn" data-lang="ru" onclick="selectLang('ru')">RU</button>
                <button class="lang-btn" data-lang="kz" onclick="selectLang('kz')">KZ</button>
                <button class="lang-btn" data-lang="en" onclick="selectLang('en')">EN</button>
            </div>
        </header>

        <div class="subjects-grid" id="subjects-grid"></div>

        <footer>
            <p>© 2024 Интерактивные электронные плакаты</p>
        </footer>
    </div>

    <script>
        let bridge = null;
        let bridgeReady = false;

        const subjectIcons = {
            'kazakhlang':   {text: 'KZ', isText: true},
            'russianlang':  {text: 'RU', isText: true},
            'englishlang':  {text: 'EN', isText: true},
            'mathematics':  {text: '📐'},
            'physics':      {text: '⚛️'},
            'chemistry':    {text: '🧪'},
            'informatics':  {text: '🖥️'},
            'geography':    {text: '🌍'},
            'biology':      {text: '🧬'},
            'historykaz':   {text: '📜'},
            'worldhistory': {text: '🏛️'}
        };

        const titles = {
            'ru': 'Интерактивные плакаты',
            'kz': 'Интерактивті плакаттар',
            'en': 'Interactive Posters'
        };

        function getSavedLang() {
            try { return localStorage.getItem('poster_lang') || 'ru'; } catch(e) { return 'ru'; }
        }
        function saveLang(lang) {
            try { localStorage.setItem('poster_lang', lang); } catch(e) {}
        }

        function selectLang(lang) {
            saveLang(lang);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            var btn = document.querySelector('.lang-btn[data-lang="' + lang + '"]');
            if (btn) btn.classList.add('active');
            document.getElementById('page-title').textContent = titles[lang] || titles['ru'];
            if (bridgeReady && bridge) {
                bridge.onLangChanged(lang);
            }
        }

        function initLangButtons() {
            var lang = getSavedLang();
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            var btn = document.querySelector('.lang-btn[data-lang="' + lang + '"]');
            if (btn) btn.classList.add('active');
            document.getElementById('page-title').textContent = titles[lang] || titles['ru'];
        }

        function renderSubjects(subjects) {
            console.log("renderSubjects()", subjects.length);
            const grid = document.getElementById('subjects-grid');
            grid.innerHTML = '';

            subjects.forEach(subject => {
                const card = document.createElement('div');
                card.className = 'subject-card';
                card.onclick = () => {
                    if (bridgeReady && bridge) bridge.onSubjectSelected(subject.id);
                };

                const iconData = subjectIcons[subject.id] || {text: '📚'};
                const iconDiv = document.createElement('div');
                iconDiv.className = 'icon' + (iconData.isText ? ' text-icon' : '');
                iconDiv.textContent = iconData.text;

                const h2 = document.createElement('h2');
                h2.textContent = subject.name;

                card.appendChild(iconDiv);
                card.appendChild(h2);
                grid.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            initLangButtons();

            if (typeof QWebChannel !== 'undefined') {
                new QWebChannel(qt.webChannelTransport, function(channel) {
                    bridge = channel.objects.bridge;
                    bridgeReady = true;
                    var savedLang = getSavedLang();
                    bridge.onLangChanged(savedLang);
                    bridge.onFrontEndReady();
                });
            }
        });
    </script>
</body>
</html>
