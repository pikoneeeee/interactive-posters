<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE_RU__</title>
<link rel="stylesheet" href="../../libs/tailwind.min.css">
<link rel="stylesheet" href="../../libs/fonts.css">
<link rel="stylesheet" href="_lb_style.css">
<style>
/* Add small poster-specific helpers here if needed. DO NOT use mb-9/mb-7/mb-11/gap-9 or arbitrary [..] classes. */
.lead{font-size:1.05rem;line-height:1.75;color:#44403c;}
.lead b{color:#881337;}
</style>
</head>
<body class="p-5 md:p-10">
<div id="poster-container" class="lang-ru" style="max-width:1300px;margin:auto">

<!-- HEADER (replace __РАЗДЕЛ__ / __SECTION__ and the three <h1> + subtitle) -->
<header class="card rounded-custom p-8 mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border-l-8" style="border-color:#be123c">
  <div>
    <p class="text-rose-400 font-light tracking-widest text-sm uppercase mb-2">
      <span lang="kk" class="lang-content">Көркем еңбек (ұлдар) · __РАЗДЕЛ_KK__</span>
      <span lang="en" class="lang-content">Art &amp; Craft (Boys) · __SECTION_EN__</span>
      <span lang="ru" class="lang-content">Художественный труд (мальчики) · __РАЗДЕЛ_RU__</span>
    </p>
    <h1 lang="kk" class="lang-content heading-font text-3xl md:text-4xl font-extrabold" style="color:#881337">__TITLE_KK__</h1>
    <h1 lang="en" class="lang-content heading-font text-3xl md:text-4xl font-extrabold" style="color:#881337">__TITLE_EN__</h1>
    <h1 lang="ru" class="lang-content heading-font text-3xl md:text-4xl font-extrabold" style="color:#881337">__TITLE_RU__</h1>
    <p class="mt-2 text-stone-600 text-base">
      <span lang="kk" class="lang-content">__SUBTITLE_KK__</span>
      <span lang="en" class="lang-content">__SUBTITLE_EN__</span>
      <span lang="ru" class="lang-content">__SUBTITLE_RU__</span>
    </p>
  </div>
  <div class="flex gap-2 flex-shrink-0">
    <button onclick="switchLang('ru')" data-lang="ru" class="lang-btn active">RU</button>
    <button onclick="switchLang('kk')" data-lang="kk" class="lang-btn">KZ</button>
    <button onclick="switchLang('en')" data-lang="en" class="lang-btn">EN</button>
  </div>
</header>

<!-- =================== BODY SECTIONS GO HERE ===================
  Build a layout that FITS the topic and VARIES (intro essay, step-by-step
  with .step-num, comparison tables as 3 per-language <table> wrapped in
  <div class="lang-content" lang="ru/kk/en">, card grids, a real-photo
  gallery with lightbox). Every text in 3 langs via
  <span lang="kk|en|ru" class="lang-content">…</span>.
  For a lightbox image use:
    <div class="genre-card" onclick="openLB(this)">
      <div class="pic"><img src="../../assets/labor_boys/__PREFIX__name.jpg" alt=""></div>
      <div class="body"><div class="genre-name"><span ...>…</span></div>
        <div class="genre-desc"><span ...>…</span></div></div>
    </div>
  ============================================================ -->

<!-- LIGHTBOX (keep inside #poster-container) -->
<div id="lightbox" class="lb" onclick="closeLB()">
  <div class="lb-inner" onclick="event.stopPropagation()">
    <button class="lb-close" onclick="closeLB()" aria-label="close">✕</button>
    <img id="lb-img" src="" alt="">
    <div class="lb-cap"><div id="lb-name" class="genre-name"></div><div id="lb-art" class="genre-cap"></div><div id="lb-desc" class="genre-desc"></div></div>
  </div>
</div>

</div>
<script>
var currentLang='ru';
function switchLang(lang){if(lang==='kz')lang='kk';currentLang=lang;var c=document.getElementById('poster-container');c.className=c.className.replace(/lang-\w+/,'')+' lang-'+lang;document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.toggle('active',b.dataset.lang===lang);});try{localStorage.setItem('poster_lang',lang);}catch(e){}}
function openLB(card){document.getElementById('lb-img').src=card.querySelector('.pic img').src;var n=card.querySelector('.genre-name');document.getElementById('lb-name').innerHTML=n?n.innerHTML:'';var cap=card.querySelector('.genre-cap');document.getElementById('lb-art').innerHTML=cap?cap.innerHTML:'';var d=card.querySelector('.genre-desc');document.getElementById('lb-desc').innerHTML=d?d.innerHTML:'';document.getElementById('lightbox').classList.add('open');}
function closeLB(){document.getElementById('lightbox').classList.remove('open');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLB();});
(function(){var s='ru';try{s=localStorage.getItem('poster_lang')||'ru';}catch(e){}if(s==='kz')s='kk';switchLang(s);})();
</script>
<script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>
</body>
</html>
