<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор темы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
            min-width: 300px;
        }

        .back-button {
            background: #2196F3;
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(33, 150, 243, 0.3);
        }

        .back-button:hover {
            background: #1976D2;
            transform: translateX(-5px);
        }

        .back-button:active {
            transform: scale(0.95);
        }

        header h1 {
            font-size: 42px;
            font-weight: 800;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .topic-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: background 0.15s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 120px;
        }

        .topic-card:active {
            background: rgba(255, 255, 255, 0.25);
        }

        .topic-card h3 {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
        }

        .grade-section {
            margin-bottom: 50px;
        }

        .grade-header {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 25px;
            padding: 18px 30px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            text-align: center;
        }

        .grade-header span {
            color: white;
            font-weight: 800;
        }

        footer {
            text-align: center;
            opacity: 0.8;
            font-size: 14px;
        }

        .search-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 14px;
            padding: 10px 12px;
            min-width: 320px;
        }

        .lang-selector {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .lang-btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .lang-btn.active {
            background: white;
            color: #333;
        }

        #search-input {
            width: 340px;
            max-width: 45vw;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
        }

        #search-input::placeholder {
            color: rgba(255,255,255,0.75);
        }

        .clear-btn {
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.22);
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clear-btn:hover {
            background: rgba(255,255,255,0.26);
            transform: scale(1.05);
        }

        .hint {
            margin: 10px 0 18px;
            opacity: 0.9;
            font-size: 14px;
        }

        .scroll-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .scroll-to-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .scroll-to-top:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .scroll-to-top::before {
            content: '↑';
            font-size: 24px;
            font-weight: 600;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <button class="back-button" id="back-btn" onclick="goBack()">← Назад</button>
                <h1 id="subject-title">Загрузка...</h1>
            </div>

            <div class="lang-selector" id="lang-selector">
                <button class="lang-btn" data-lang="ru" onclick="selectLang('ru')">RU</button>
                <button class="lang-btn" data-lang="kz" onclick="selectLang('kz')">KZ</button>
                <button class="lang-btn" data-lang="en" onclick="selectLang('en')">EN</button>
            </div>

            <div class="search-wrap">
                <input id="search-input" type="text" placeholder="Поиск плаката по названию..." autocomplete="off">
                <button class="clear-btn" id="clear-btn" title="Очистить">✕</button>
            </div>
        </header>

        <!-- Кнопка "Наверх" -->
        <button class="scroll-to-top" id="scroll-to-top" title="Наверх"></button>

        <div class="hint" id="hint"></div>

        <div class="topics-grid" id="topics-grid">
            <!-- Темы будут загружены здесь -->
        </div>

        <footer>
            <p>© 2024 Интерактивные электронные плакаты</p>
        </footer>
    </div>

    <script>
        let allTopics = [];

        function getSavedLang() {
            try { return localStorage.getItem('poster_lang') || 'ru'; } catch(e) { return 'ru'; }
        }

        function saveLang(lang) {
            try { localStorage.setItem('poster_lang', lang); } catch(e) {}
        }

        function selectLang(lang) {
            saveLang(lang);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            var btn = document.querySelector('.lang-btn[data-lang="' + lang + '"]');
            if (btn) btn.classList.add('active');
            if (typeof Android !== 'undefined') {
                Android.onLangChanged(lang);
            }
        }

        function initLangButtons() {
            var lang = getSavedLang();
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            var btn = document.querySelector('.lang-btn[data-lang="' + lang + '"]');
            if (btn) btn.classList.add('active');
            // Сообщаем бэкенду сохранённый язык
            if (typeof Android !== 'undefined') {
                Android.onLangChanged(lang);
            }
        }

        function goBack() {
            console.log("Back clicked");
            if (typeof Android !== 'undefined') {
                Android.onBackClicked();
            }
        }

        function renderTopics(topics) {
            allTopics = Array.isArray(topics) ? topics : [];
            console.log("renderTopics() called with", topics.length, "topics");
            const grid = document.getElementById('topics-grid');
            grid.innerHTML = '';

            const hasGrades = allTopics.some(t => t.grade !== undefined);

            if (hasGrades) {
                grid.style.display = 'block';
                renderTopicsWithGrades(allTopics, grid);
            } else {
                grid.style.display = 'grid';
                renderTopicsSimple(allTopics, grid);
            }
        }

        function renderTopicsWithGrades(topics, container) {
            const grades = {};
            topics.forEach(topic => {
                const grade = topic.grade || 5;
                if (!grades[grade]) grades[grade] = [];
                grades[grade].push(topic);
            });

            const sortedGrades = Object.keys(grades).sort((a, b) => parseInt(a) - parseInt(b));

            sortedGrades.forEach(grade => {
                const section = document.createElement('div');
                section.className = 'grade-section';

                const header = document.createElement('div');
                header.className = 'grade-header';
                header.innerHTML = '<span>' + grade + '</span> класс';
                section.appendChild(header);

                const gradeGrid = document.createElement('div');
                gradeGrid.className = 'topics-grid';

                grades[grade].forEach(topic => {
                    const card = createTopicCard(topic);
                    gradeGrid.appendChild(card);
                });

                section.appendChild(gradeGrid);
                container.appendChild(section);
            });
        }

        function renderTopicsSimple(topics, container) {
            topics.forEach(topic => {
                const card = createTopicCard(topic);
                container.appendChild(card);
            });
        }

        function createTopicCard(topic) {
            const card = document.createElement('div');
            card.className = 'topic-card';
            card.setAttribute('data-topic-id', topic.id);
            card.onclick = () => {
                if (typeof Android !== 'undefined') {
                    Android.onTopicClicked(topic.id);
                }
            };
            card.innerHTML = '<h3>' + topic.name + '</h3>';
            return card;
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            console.log("DOMContentLoaded - topics_screen");

            initLangButtons();

            if (typeof Android !== 'undefined') {
                console.log("Android bridge found");
                Android.onFrontEndReady();
            } else {
                console.error("Android bridge not found!");
            }

            // Поиск
            const input = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-btn');
            const hint = document.getElementById('hint');

            function applyFilter() {
                const q = (input.value || '').trim().toLowerCase();
                const filtered = !q
                    ? allTopics
                    : allTopics.filter(t => (t.name || '').toLowerCase().includes(q));

                const grid = document.getElementById('topics-grid');
                grid.innerHTML = '';
                grid.style.display = 'grid';

                if (hint) {
                    hint.innerText = q
                        ? 'Найдено: ' + filtered.length + ' из ' + allTopics.length
                        : 'Найдено: ' + allTopics.length;
                }

                filtered.forEach(topic => {
                    const card = createTopicCard(topic);
                    grid.appendChild(card);
                });
            }

            if (input) {
                input.addEventListener('input', applyFilter);
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        input.value = '';
                        applyFilter();
                        input.blur();
                    }
                });
            }

            if (clearBtn) {
                clearBtn.addEventListener('click', () => {
                    input.value = '';
                    applyFilter();
                    input.focus();
                });
            }

            // Кнопка "Наверх"
            const scrollToTopBtn = document.getElementById('scroll-to-top');
            if (scrollToTopBtn) {
                window.addEventListener('scroll', () => {
                    if (window.pageYOffset > 300) {
                        scrollToTopBtn.classList.add('visible');
                    } else {
                        scrollToTopBtn.classList.remove('visible');
                    }
                });

                scrollToTopBtn.addEventListener('click', () => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }
        });
    </script>
</body>
</html>
