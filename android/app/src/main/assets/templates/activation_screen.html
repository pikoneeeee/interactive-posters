<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Активация</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .logo {
            font-size: 56px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.55);
            margin-bottom: 28px;
        }
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 16px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            color: white;
            font-size: 15px;
            font-family: 'Courier New', monospace;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
            word-break: break-all;
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        input:focus {
            border-color: rgba(99, 102, 241, 0.8);
        }
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-size: 17px;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.85;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* Главная кнопка — сканировать QR */
        .qr-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            font-size: 19px;
            padding: 20px;
            margin-bottom: 18px;
        }
        .manual-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: rgba(255,255,255,0.35);
            font-size: 13px;
            margin: 18px 0;
        }
        .manual-divider::before,
        .manual-divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid rgba(255,255,255,0.12);
        }
        .manual-divider:not(:empty)::before { margin-right: 12px; }
        .manual-divider:not(:empty)::after { margin-left: 12px; }
        .status {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            line-height: 1.4;
        }
        .status.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        .status.success {
            display: block;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }
        .status.loading {
            display: block;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
        }
        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer-hint {
            margin-top: 28px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔐</div>
        <h1>Активация продукта</h1>
        <p class="subtitle">Отсканируйте QR-код камерой, выберите картинку с QR (кнопка «QR из файла» в сканере) или введите ключ вручную</p>

        <div id="deviceIdBlock" style="
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 22px;
            text-align: center;
        ">
            <div style="font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 4px;">
                ID устройства (сообщите его для получения ключа)
            </div>
            <div id="deviceId" style="
                font-family: 'Courier New', monospace;
                font-size: 18px;
                letter-spacing: 3px;
                color: #a5b4fc;
                font-weight: 700;
                user-select: text !important;
                -webkit-user-select: text !important;
            ">загрузка...</div>
        </div>

        <button id="scanBtn" class="qr-btn" onclick="scanQr()">📷 Сканировать QR-код</button>

        <div class="manual-divider">или введите ключ вручную</div>

        <div class="input-group">
            <input type="text" id="licenseKey"
                   placeholder="OL1-…"
                   maxlength="200"
                   autocomplete="off"
                   autocapitalize="off"
                   autocorrect="off"
                   spellcheck="false">
        </div>
        <button id="activateBtn" onclick="activateLicense()">Активировать</button>

        <div class="status" id="status"></div>

        <p class="footer-hint">
            Ключ привязан к этому устройству.<br>
            Сообщите Device ID для получения ключа.
        </p>
    </div>

    <script>
        const input = document.getElementById('licenseKey');
        const btn = document.getElementById('activateBtn');
        const statusEl = document.getElementById('status');

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') activateLicense();
        });

        function showStatus(type, message) {
            statusEl.className = 'status ' + type;
            if (type === 'loading') {
                statusEl.innerHTML = '<span class="spinner"></span>' + message;
            } else {
                statusEl.innerHTML = (type === 'success' ? '✅ ' : '❌ ') + message;
            }
        }

        // Сканировать QR-код через камеру (Android)
        function scanQr() {
            if (typeof Android !== 'undefined' && typeof Android.scanQr === 'function') {
                showStatus('loading', 'Открываю камеру…');
                Android.scanQr();
            } else {
                showStatus('error', 'Сканер доступен только на устройстве с камерой.');
            }
        }

        function activateLicense() {
            const key = input.value.trim();
            if (!key) {
                showStatus('error', 'Отсканируйте QR-код или вставьте ключ');
                input.focus();
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Проверка...';
            showStatus('loading', 'Проверяю ключ...');

            // Android JS-мост (Kotlin)
            if (typeof Android !== 'undefined' && typeof Android.activateKey === 'function') {
                Android.activateKey(key);
                return;
            }
            // QWebChannel (PySide6) — для совместимости, если HTML загружен в Windows
            if (typeof activationBridge !== 'undefined' && activationBridge) {
                activationBridge.activate(key);
                return;
            }
            showStatus('error', 'Ошибка связи с приложением. Перезапустите.');
            btn.disabled = false;
            btn.textContent = 'Активировать';
        }

        // Колбэки из нативной стороны
        window.onActivationSuccess = function(message) {
            showStatus('success', message);
            btn.textContent = 'Активировано!';
        };

        window.onActivationError = function(message) {
            showStatus('error', message);
            btn.disabled = false;
            btn.textContent = 'Активировать';
        };
    </script>
</body>
</html>
